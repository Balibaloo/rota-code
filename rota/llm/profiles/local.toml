# The default profile: local Ollama, the mechanical desks on qwen3:8b and the
# judging desks on qwen3.5:9b. This is the configuration that produced the
# first honest merge on an existing repository (tipsAD, 2026-09-09).
name = "local"

[provider]
kind = "ollama"
timeout = 300

# The 3080 sets this number: qwen3:8b needs 6.89 to 7.40 GB at 16384
# with no spill, and 8.01 GB at 20480, which leaves a 10 GB card
# nothing (the design record and probes/frame43/p_window.py, both
# 2026-09-19).
[pins]
temperature = 0.0
num_ctx = 16384

[models]
default = "qwen3:8b"
# Sprint 35 row 2: the count of the 24 L3R cases decides the Liaison
# seat's model. On df4b89b9 gemma4:12b-it-qat read 7 of 24 and qwen3:8b
# read 4 of 24 (frame 345, 2026-10-29).
liaison = "gemma4:12b-it-qat"
tester = "qwen3.5:9b"
critic = "qwen3.5:9b"
terminologist = "qwen3.5:9b"
developer = "qwen3.5:9b"
