# The provider seam, measured without a key or an install: Ollama's
# OpenAI-compatible endpoint through litellm. Every model name carries the
# `openai/` prefix litellm expects for that API, and litellm wants an
# OPENAI_API_KEY in the environment; any word does for Ollama. A llama.cpp
# server is the same file with its own port. The loader fills
# `{model_host}` from `llm.OLLAMA_HOST`, the one reader of the host (F29).
name = "local-openai"

[provider]
kind = "litellm"
endpoint = "{model_host}/v1"
timeout = 300

# The 3080 sets this number: qwen3:8b needs 6.89 to 7.40 GB at 16384
# with no spill, and 8.01 GB at 20480, which leaves a 10 GB card
# nothing (the design record and probes/frame43/p_window.py, both
# 2026-09-19).
[pins]
temperature = 0.0
num_ctx = 16384

[models]
default = "openai/qwen3:8b"
tester = "openai/qwen3.5:9b"
critic = "openai/qwen3.5:9b"
terminologist = "openai/qwen3.5:9b"
developer = "openai/qwen3.5:9b"
