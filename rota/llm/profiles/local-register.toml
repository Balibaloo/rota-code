# The register's model on every desk. Recorded per role on 2026-09-11:
# llama3.1:8b passes more cases than qwen3:8b or qwen3.5:9b on every desk
# but the Liaison, where qwen3:8b is one ahead. The briefs were tuned on
# llama. Whether the merge prefers it is measured by a walk, not by this
# file: `local` is what merged tipsAP.
name = "local-register"

[provider]
kind = "ollama"
timeout = 300

# The 3080 sets this number (2026-09-19): qwen3:8b needs 7.40 GB at
# 16384 and 8.01 GB at 20480, which leaves a 10 GB card nothing.
[pins]
temperature = 0.0
num_ctx = 16384

[models]
default = "llama3.1:8b"
