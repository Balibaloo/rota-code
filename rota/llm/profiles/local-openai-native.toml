# local-openai with native tool calling on: the transport the tool check
# passed on both models through litellm (plans/model-setup.md, step 10).
# A walk measures whether the desks judge as well with native calls.
# The loader fills `{model_host}` from `llm.OLLAMA_HOST` (F29).
name = "local-openai-native"
native_tools = true

[provider]
kind = "litellm"
endpoint = "{model_host}/v1"
timeout = 300

# The 3080 sets this number: qwen3:8b needs 6.89 to 7.40 GB at 16384
# with no spill, and 8.01 GB at 20480, which leaves a 10 GB card
# nothing (the design record and probes/frame43/p_window.py, both
# 2026-09-19).
[pins]
temperature = 0.0
num_ctx = 16384

[models]
default = "openai/qwen3:8b"
tester = "openai/qwen3.5:9b"
critic = "openai/qwen3.5:9b"
terminologist = "openai/qwen3.5:9b"
developer = "openai/qwen3.5:9b"
