# rota, packaged. `pip install .` on a clean machine gives the `rota`
# command with its prompts, schema, graph, profiles and cockpit assets.
# The checkout's tests, cases and register stay in the checkout.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rota"
version = "0.1.0"
description = "A team of desks that turns a sentence into a merged change on an existing repository."
readme = "rota/README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2",
    "PyYAML>=6.0",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=1.14",
]

[project.optional-dependencies]
cockpit = ["watchfiles>=1.1"]
litellm = ["litellm>=1.96"]
dev = ["pytest>=8.4", "pytest-asyncio>=1.3", "pytest-timeout>=2.4", "pytest-xdist>=3.8"]

[project.scripts]
rota = "rota.cli:main"

[tool.setuptools.packages.find]
include = ["rota*"]

[tool.setuptools.package-data]
"rota" = ["*.md", "core/*.sql", "design/*.json", "design/layouts/*",
          "roles/prompts/**/*.md", "roles/prompts/**/*.tools",
          "llm/profiles/*.toml", "llm/*.json", "cockpit/*.html", "cockpit/static/*"]
