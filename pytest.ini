[pytest]
norecursedirs = active_sessions active_sessions_backup .venv
pythonpath = . src
asyncio_mode = auto

# The deterministic suite has no model call in it and was running on one core of
# sixteen for eight minutes. Two and a half now. `loadfile` rather than plain
# `load` keeps a whole file on one worker, which is the cheap way to be safe
# about module-level fixtures without auditing all forty of them.
#
# The model tiers are exempt and `tests/rota/conftest.py` enforces it: parallel
# calls to one 8B model on one GPU thrash it, and the timings stop meaning
# anything, which is the whole reason those timings are recorded.
addopts = -n auto --dist loadfile
