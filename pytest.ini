[pytest]
norecursedirs = active_sessions active_sessions_backup .venv
pythonpath = . src
asyncio_mode = auto

# Parallelism is NOT a default here, and that is a decision rather than an
# omission.
#
# The deterministic suite has no model call in it and was running on one core of
# sixteen. Run it with workers and it goes from eight minutes to two and a half:
#
#     python -m pytest tests/rota -q -n auto --dist loadfile \
#         --ignore=tests/rota/test_l1.py --ignore=tests/rota/test_l3.py
#
# `loadfile` rather than plain `load` keeps a whole file on one worker, which is
# the cheap way to be safe about module-level fixtures without auditing all
# forty of them.
#
# The model tiers must NOT run that way. With ROTA_L1 set, L1 and L3 call a real
# 8B model on one GPU; several workers doing that at once thrash it, and the
# per-tier durations `tests/rota/conftest.py` records stop being a fact about
# anything.
#
# `-n auto` was in this file for exactly one commit, with three separate attempts
# to exempt the model tiers automatically. All three failed, and all three failed
# *silently* -- a directory conftest is loaded on the xdist workers rather than
# the controller, and a root conftest is itself loaded during the phase whose
# hook it was trying to implement. The result reported nothing wrong and put
# sixteen workers on the GPU; the failure looked exactly like the fix, and what
# caught it was `bringing up nodes` in a log somebody happened to read.
#
# So the default is the safe one. Forgetting the flag costs six minutes.
# Forgetting the exemption cost a measurement that looked real and was not.
