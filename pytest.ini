[pytest]
norecursedirs = .venv
pythonpath = .
asyncio_mode = auto

# Parallel by default. The deterministic suite has no model call in it and was
# running on one core of sixteen -- eight minutes, now two and a half.
#
# `loadfile` rather than plain `load` keeps a whole file on one worker, which is
# the cheap way to be safe about module-level fixtures without auditing forty
# files.
#
# `rota_serial_plugin` forces `-n0` when ROTA_L1 or ROTA_T1 is set, because the
# model tiers call one 8B model on one GPU and workers doing that concurrently
# thrash it. It is a `-p` plugin and not a conftest for a measured reason, which
# that file states: three conftest attempts all failed, and all three failed
# silently.
addopts = -p rota_serial_plugin -n auto --dist loadfile
