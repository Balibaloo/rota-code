# answer_key — the scoreable predictions.
#
# Not a table. The files beside this one mimic rota's schema and stay loadable;
# this holds the claims that have no column, and `must_not_mean` is the reason
# the whole probe is worth having.
#
# Scored against a finished run's database.

repository:
  name: Contextual Note Templating
  root: D:/tmp/rota-live/repo
  branch: v3
  commit: 766c9e30
  files: 18 source, 73 grains, 5 areas as folded

# --- 1. presence ------------------------------------------------------------
# Mechanical. Is the term in the glossary at all, under any sense?

terms_required:
  - intent            # the central one. Absent from the recorded run.
  - template
  - prompt
  - variable
  - variable_type
  - provider
  - frontmatter
  - global_intent
  - selection
  - filter_set

terms_expected:       # good to have, not damning to miss
  - template_variable
  - reserved_variable
