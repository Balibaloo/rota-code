# --- 5. consult questions (probes/ical/questions.py mirrors this) -----------

questions:
  - q: >-
      A user has the text of an .ics file. How do they get a Calendar
      object, and how do they get identical text back out?
    expect: >-
      Calendar.from_ical(text) parses; cal.to_ical() serialises; round-trip
      is the design, and values that failed to parse are preserved (vBroken)
      so the trip stays faithful.
  - q: What is a component here, and how do components nest?
    expect: >-
      the building block (VCALENDAR, VEVENT, VTODO, VALARM...): a
      CaselessDict of properties plus subcomponents; walk() traverses the
      tree.
  - q: What is the difference between a property and a parameter?
    expect: >-
      a property is a component's content line (DTSTART, SUMMARY) with a
      typed value; a parameter modifies a property (TZID=, CN=), kept in
      the Parameters mapping attached to the value.
  - q: >-
      Where does a DTSTART line's text become a Python datetime, and what
      decides which type parses which property?
    expect: >-
      the prop/dt value types (vDatetime and kin) do from_ical; the
      TypesFactory maps property names to types.
  - q: >-
      A maintainer renames Calendar.from_ical and the build passes. Who is
      affected, and how do they find out?
    expect: >-
      every downstream program importing icalendar -- AttributeError when
      their code runs; loud, ecosystem-wide (the library direction).
  - q: >-
      Parsing hits a property value it cannot parse. What happens -- an
      exception, a skip, or something else?
    expect: >-
      something else: the raw value is preserved as vBroken so
      serialisation round-trips, and the problem is recorded on the
      component's errors list rather than raised by default.
  - q: How does a VTIMEZONE become something datetime arithmetic can use?
    expect: >-
      the timezone package converts VTIMEZONE to a tzinfo (zoneinfo when
      it can, built custom otherwise); tzdata is a dependency for exactly
      this.
  - q: What does the `icalendar` command a user gets on their PATH do?
    expect: >-
      the console script icalendar = icalendar.cli:main, declared in
      pyproject [project.scripts]: a utility to preview a calendar's
      events.
