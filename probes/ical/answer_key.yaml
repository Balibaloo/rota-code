# answer_key — icalendar, written before the first understanding session ran.
#
# The fourth repository, second library, first spec-conformance project, and
# the successor to rota/ANSWER_KEY_icalendar.md, which preregistered an older
# commit for an older onboarding (its partition claims are stale; its spirit
# is kept). Everything here was verified by reading the source at the pinned
# commit 9961924, not recalled. Predictions about the run are labelled;
# truths are labelled.
#
# Scored against a finished run's database: .rota/ical_v0.db

repository:
  name: icalendar
  root: D:/tmp/rota-live/icalendar
  commit: "9961924"
  shape: >-
    258 py files, 23 areas, docs/ holds 118 prose files, 193 .ics fixtures;
    README is rst; pyproject declares name icalendar, "RFC 5545 compatible
    parser and generator of iCalendar files", requires-python >=3.10,
    dependencies python-dateutil + tzdata, console script
    icalendar = icalendar.cli:main

# --- 1. presence ------------------------------------------------------------

terms_required:
  - component        # the building block: VCALENDAR/VEVENT/VTODO..., nests
  - calendar         # the VCALENDAR component, the root
  - event            # the VEVENT component
  - alarm            # VALARM; Alarms/AlarmTime compute trigger times
  - timezone         # VTIMEZONE -> tzinfo
  - property         # a component's line: NAME;PARAMS:VALUE (DTSTART, SUMMARY)
  - parameter        # a property's modifier (TZID=, CN=), held by Parameters
  - recur            # RRULE machinery, prop/recur
  - uid              # the identity property; prop/uid
  - todo             # the VTODO component

terms_expected:
  - journal
  - factory          # ComponentFactory / TypesFactory: name -> class
  - subcomponent
  - text             # vText: the escaped TEXT value type
  - duration
  - caselessdict     # property names are case-insensitive; the base mapping
  - free_busy
  - broken           # vBroken: a value that failed to parse, kept for round-trip

# --- 2. must_not_mean -------------------------------------------------------
# The fluent wrong reading. For a calendar library the traps are the Python
# reading (property, parameter) and the everyday reading (event, alarm).

must_not_mean:
  component:
    is: >-
      a calendar building block (VCALENDAR, VEVENT, VTODO...), a
      CaselessDict of properties with subcomponents, parsed by from_ical
      and serialised by to_ical
    not: [software component, a module, reusable part, ui component, a piece of the system]
  property:
    is: >-
      a content line of a component -- NAME;PARAMS:VALUE, like DTSTART or
      SUMMARY -- whose value is typed by TypesFactory
    not: [a python property, an attribute of a class, "@property", a field of an object]
  parameter:
    is: a property's modifier, like TZID= or CN=, held in a Parameters mapping
    not: [a function parameter, an argument, a configuration setting]
  event:
    is: the VEVENT component -- a scheduled thing with DTSTART, on a calendar
    not: [an event handler, a callback, something that fires, a signal, an occurrence in the program]
  alarm:
    is: >-
      the VALARM subcomponent; the Alarms class computes concrete AlarmTime
      triggers, honouring acknowledged and snoozed state
    not: [a notification the OS shows, a warning, an error signal, a timer in this program]
  timezone:
    is: >-
      the VTIMEZONE component, converted to a usable tzinfo (zoneinfo /
      dateutil) by the timezone package
    not: [a region's offset, a setting of the machine, utc offset number]
  text:
    is: vText -- the RFC 5545 TEXT value type with escaping, a str subclass
    not: [any string, plain text, the contents of a file]

# --- 3. constraints ---------------------------------------------------------

constraints_required:
  # The standard is the outside. pyproject's own description: "RFC 5545
  # compatible parser and generator of iCalendar files"; keyword rfc5545;
  # every .ics any other program emits is the other side of this contract.
  - rfc_5545_conformance
  # PyPI name icalendar, the import surface, requires-python >=3.10, the
  # console script icalendar = icalendar.cli:main -- registry + downstream
  # importers (the library direction, again).
  - the_pypi_package_and_import_surface

constraints_required_match:
  rfc_5545_conformance:
    - [rfc, "5545", rfc5545, standard, spec, specification]
    - [ical, icalendar, ics, calendar, calendars]
    - [parse, parser, parsing, generate, generator, serialise, serialize,
       round, emit, format, files, compatible, conform, conformance]
  # Tightened 2026-08-24: "import"/"imports" let `vInt -- ImportError:
  # cannot import name ... from icalendar.prop.integer` match, an
  # identifier-grain row gamed by its own error string. Registry-level words
  # only, and a consequence-side group.
  the_pypi_package_and_import_surface:
    - [pypi, registry, publish, published, pip, install, distribution,
       downstream, importers, "517", packaging]
    - [icalendar]
    - [name, version, requires, floor, breaks, break, users, programs]

constraints_expected:
  - tzdata_and_dateutil_are_load_bearing   # zoneinfo fallback on Windows; recur math
  - unknown_content_survives_round_trip    # vBroken keeps failed values; errors list, not raise
  - the_cli_preview_entry_point

constraint_decoys:
  - .pre-commit-config.yaml
  - tox settings in pyproject
  - ruff settings in pyproject
  - Makefile
  - docs/conf.py
  - newsfragments

constraints_must_have_a_body: true

