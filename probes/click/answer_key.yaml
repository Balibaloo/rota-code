# --- recorded run result, v2 on qwen3:8b (2026-08-25, .rota/click_q3.db) ---

recorded_run_result_v2_qwen3:
  wall: 49 sessions, 641 seconds -- the full nine-stage spine in eleven
    minutes, against two and a half hours for the v1 run on the 14B
  terms_required_present: 8 of 10   # context, prompt, choice joined; echo and
                                    # callback still never nominated (lexicon, not model)
  must_not_mean_hits: 1 of 7        # context -> "the environment in which" --
                                    # the first trap hit since v1.0.0; the streak
                                    # ends at 22 and the briefs meet a new model
  copied_from_index: 1 of 24 (4%)
  constraints: 31 written, symbol-grain over-production (worse than the 14B's
    ten); the live challenge pass then broke seven of its twelve sampled
    claims with citations -- the immune system's first production catch,
    though the breaks' precision needs its own review
  constraints_required_found: 0 of 2  # the library-direction gap, unfixed by design
  blindspot_regression: the session parroted the brief's template literally
    ("this run could not see <boundary>; what it could hide") -- a discipline
    knife-edge the 14B never showed; the brief needs qwen3-proofing
  verdict: the engine switch holds discipline through the spine at 20x speed
    with better vocabulary coverage, and brings its own knife-edges -- the
    briefs were tuned against qwen2.5:14b, and a small qwen3 tuning pass is
    the predicted, bounded cost of migration
  consult: 4 of 8 strict, 6 of 8 lenient, against v1's 2 of 8 on the same
    preregistered questions. Clean -- option-vs-argument (named/optional vs
    positional/required, exact), CliRunner for shell-less testing (exact),
    ctx.obj as arbitrary data passed down the hierarchy via pass_context.
    Partial -- echo rename (right mechanism and blast radius, wrong
    exception class), Choice rejection (UsageError family named, no exit
    code), tab completion (sourced scripts named, the _PROG_COMPLETE
    protocol missing). Missed -- value-precedence order (invented "config
    files") and group dispatch (no get_command, no NoSuchCommand). The
    shape of the misses is one shape, not two -- both are *sequence*
    questions, what-happens-in-what-order, and no artefact in the set
    holds sequences. The glossary answers what-is-X well; the flows
    artefact already in the v2 queue is where these two points live.
  break_precision_review:  # 2026-08-25, all 12 verdicts read against source
    the_claims: eleven of twelve sampled constraints are one template --
      "WHO BREAKS applications using click.X; WHAT HAPPENS NameError if X
      is not found" -- a conditional true of every Python name, binding
      nothing. These are textbook vacuous claims, the exact shape the
      'unfounded' verdict was built for. The twelfth (readthedocs) is
      prose-sourced and sloppy but not vacuous.
    the_verdicts: the identical template drew 7 falsified and 4 stands --
      a coin flip, with self-contradictory whys on both sides ("is defined
      ... and does not raise a NameError if not found" as a *stands*
      reason). One falsification quotes the wrong function
      (click_push_context cites get_current_context). Zero verdicts used
      'unfounded'; the 14B never used it either.
    what_this_means: the Critic's evidence gate held (every citation is a
      real file, every quote a real line) but the verdict *ladder* failed --
      vacuous claims should drain as unfounded, not split at random between
      stands and falsified. Precision of the 8 breaks as breaks -- 0 clean;
      as attacks on junk claims -- all 8 aimed at rows that deserved to die.
    the_fixes: (1) upstream, the constraint over-production is the root --
      31 symbol-grain template rows gave the Critic nothing worth judging;
      (2) the challenge brief's unfounded arm must name the vacuous-
      conditional shape; (3) the bench challenge battery's unfounded
      fixture should use this exact live template.

# --- 5. consult questions (probes/click/questions.py mirrors this) ----------
# Expected answers are truths from the source, written before the run.

questions:
  - q: >-
      A maintainer renames `echo` to `print_out` throughout src/click and the
      build passes. Who is affected, and how do they find out?
    expect: >-
      every downstream program that does `from click import echo` or
      `click.echo` -- an ImportError/AttributeError the moment their program
      starts; loud, immediate, ecosystem-wide.
  - q: >-
      What is the difference between an option and an argument here?
    expect: >-
      both are Parameters attached to a command; an option is named
      (--name), optional by default, can prompt and read envvars; an
      argument is positional, required by default.
  - q: >-
      When an option's value is not on the command line, where else can it
      come from, and in what order?
    expect: >-
      environment variable (envvar), the context's default_map, the
      declared default; if still missing and prompt is set, the user is
      prompted. ParameterSource records which one won.
  - q: >-
      A user types a value that a Choice option does not allow. What exactly
      happens?
    expect: >-
      conversion fails with an invalid-choice UsageError (exit code 2),
      naming the allowed values; loud.
  - q: >-
      How does a group decide which command runs, and what does the user see
      when the name does not exist?
    expect: >-
      Group resolves the first argument via get_command(name); a missing
      name raises NoSuchCommand (a UsageError, added 8.4) -- "No such
      command", with suggestions.
  - q: >-
      What is `ctx.obj`, and how does a subcommand get at it?
    expect: >-
      an arbitrary user object carried on the Context and inherited down
      the chain; pass_context / pass_obj / make_pass_decorator hand it to
      callbacks; ensure_object creates it.
  - q: >-
      How does a user's shell get tab completion for a click program?
    expect: >-
      the _{PROG}_COMPLETE=<shell>_source protocol emits a script the user
      sources in their shell rc; ShellComplete subclasses implement bash,
      zsh, fish.
  - q: >-
      How do you test a click command without running a real shell?
    expect: >-
      CliRunner().invoke(cmd, args) from click.testing, returning a Result
      with output and exit_code.
