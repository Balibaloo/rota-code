# answer_key — click, written before the first understanding session ran.
#
# The third repository, and the first library. cnt is an app: its users write
# yaml, its importers are inside. click inverts that -- its users ARE
# importers, its authoring surface is Python decorators, its README is
# marketing and its real prose is docs/. Every entry here was verified by
# reading the source at the pinned commit, not recalled from familiarity with
# the library. Predictions about how the *system* will do are labelled as
# predictions; the truths are labelled as truths.
#
# Scored against a finished run's database: .rota/click_v0.db

repository:
  name: click
  root: D:/tmp/rota-live/click
  version: 8.5.0.dev (stable branch)
  files: 17 py in src/click; 6 areas after examples attach
  runtime_dependencies: none        # pyproject has no [project] dependencies

# --- 1. presence ------------------------------------------------------------

terms_required:
  - command          # the central one: a Command object wrapping a callback
  - group            # a Command that nests commands, dispatches by name
  - option           # a named parameter (--flag), may prompt / read envvar
  - argument         # a positional parameter
  - parameter        # the base Option and Argument share, attached to a Command
  - context          # the per-invocation Context object, chained via parent
  - echo             # click's print: encodings, ANSI, closed-pipe safety
  - prompt           # asks for input with type conversion; NOT cnt's prompt
  - choice           # a ParamType restricting to enumerated values
  - callback         # the user function a Command wraps / a param's processor

terms_expected:
  - param_type       # ParamType: the conversion pipeline (name, convert, fail)
  - completion       # shell completion via the _{PROG}_COMPLETE env protocol
  - runner           # CliRunner: invoke a command in-process for tests
  - decorator        # the authoring surface itself
  - envvar
  - eager            # eager params (--help, --version) processed before others
  - flag

# --- 2. must_not_mean -------------------------------------------------------
# The fluent, confident, wrong reading -- predicted before the run. For a CLI
# library the trap is the *English* reading of its own domain words.

must_not_mean:
  command:
    is: >-
      a Command object wrapping a Python callback, registered under a name,
      created by the @click.command decorator, invoked by a Group by name
    not: [a shell command, a terminal command, an instruction executed,
          a command the program runs, a subprocess]
  group:
    is: a Command that holds other commands and dispatches to one by name
    not: [a set of related, a collection of items, a category, a grouping of options]
  option:
    is: >-
      a named command-line parameter (--name), declared by @click.option,
      which can prompt, read an environment variable, or take a default
    not: [a choice available, a configuration option, a setting, a possibility]
  argument:
    is: a positional command-line parameter, declared by @click.argument
    not: [a value passed to a function, a function argument, a parameter of a method]
  context:
    is: >-
      the Context object created per invocation, linked to its parent,
      carrying params and obj down the command chain; reachable via
      pass_context / get_current_context
    not: [surrounding information, the circumstances, the environment in which,
          contextual data]
  echo:
    is: >-
      click's output function: writes to stdout handling encoding, ANSI
      stripping when piped, and closed-pipe errors
    not: [repeats, echoes back, returns the input, prints the same]
  prompt:
    is: asks the user for terminal input, converting and validating via a type
    not: [a dialog in a note, a template variable, a frontmatter key]

# --- 3. constraints ---------------------------------------------------------
# The library inversion, stated as truths:

constraints_required:
  # Every name re-exported in src/click/__init__.py is the public API; every
  # downstream program on PyPI imports them. Renaming any is an ImportError
  # in somebody else's release. This is the constraint the inside-party
  # guard, written for an app, is predicted to veto -- see prediction below.
  - the_import_surface_is_the_contract
  # pyproject: name "click" on PyPI, requires-python >=3.10, zero runtime
  # dependencies. The registry contract plus the floor downstreams pin to.
  - the_pypi_name_and_python_floor

constraints_expected:
  - the_shell_completion_protocol   # _{PROG}_COMPLETE=<shell>_source, sourced scripts in users' rc files
  - deprecations_are_commitments    # "removed in Click 9.0" strings: dated promises
  - readthedocs_builds_the_docs     # .readthedocs.yaml: a service contract

constraint_decoys:
  - .pre-commit-config.yaml
  - tox settings in pyproject
  - ruff settings in pyproject
  - docs/conf.py

constraints_must_have_a_body: true

# --- 4. predictions about the run (not truths) ------------------------------

predictions:
  - id: library_direction_veto
    text: >-
      The boundary/survey guard treats "anyone who imports an identifier" as
      inside -- true for an app, false for a library. Predicted: the run
      writes no constraint naming the import surface, or a session tries and
      is refused. ASSUMPTIONS.md carries the entry; this run is its measure.
  - id: prose_nominations_empty
    text: >-
      The README is marketing whose vocabulary the code owns; prose_names
      nominates nothing. Verified mechanically before any session ran.
  - id: docs_area_surveys
    text: >-
      docs/ and .github/* form areas and will be surveyed; none_found is the
      honest outcome there. Sessions spent: ~6 of ~12 survey sessions on
      non-program areas. The partition entry in ASSUMPTIONS.md counts this.
  - id: decorator_surface_invisible
    text: >-
      The "in what a user writes" concordance section keys on yaml/toml
      authoring keys; click's authoring surface is decorators in Python.
      Predicted: define sessions see no authoring-surface section, and the
      glossary leans on declarations -- adequate for presence, weaker for
      the user's-eye sense of a word.

