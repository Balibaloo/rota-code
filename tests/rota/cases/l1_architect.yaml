# L1 — Architect, the modes the judgement file left uncovered.
#
# Architect owns the system model and the second review gate. Its failure mode
# is the opposite of Critic's: where Critic is starved and might reach past what
# it was given, Architect sees everything and might decide something that was
# never its to decide.

- id: L1-AR-annotate-a-batch
  tier: T1
  role: architect
  runs: 5
  pass: 4
  tick: annotate
  refs: [<b1>]
  repo:
    batch: <b1>
    # This case expects a `code.probe`, and a probe against an index nobody
    # built returns the same empty list as a probe that matched nothing. The
    # Developer case next door lost 70 of 80 runs to exactly that ambiguity.
    onboard: true
  fixture:
    items:
      - {id: <i1>, text: "volume discounts on the line total", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "apply the volume band to the line total"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "line_total applies the highest band the quantity qualifies for",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: pending}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
  expect:
    calls: [code.probe, batches.annotate]
    writes:
      # Measured, not probed: read back from the runs already recorded
      # against this prompt that passed. The ceiling is the highest of them.
      batch_touch: {count: "1..7"}
  forbidden:
    # A prediction, not a permission, and made from source rather than from the
    # ticket text — which is why probing the codebase is part of the assertion.
    writes: [criteria, tickets, items, constraints]

- id: L1-AR-annotate-from-the-guess
  tier: T1
  role: architect
  runs: 5
  pass: 4
  # Frame 298's design, 1.3 (review 3, finding 4). The batch's prediction
  # starts from the item's guess, as the principal corrected it. The item has
  # the Architect's own set and a set rewritten from a ruling, so `the item's
  # guess` carries the corrected paths and the principal's words.
  tick: annotate
  refs: [<b1>]
  repo:
    batch: <b1>
    onboard: true
  fixture:
    config:
      - {key: "entry:<m_rule>", value: '"Line 2 names the charges file, which has nothing to do with this. The bands live in the pricing module, and the test goes in the pricing tests file."'}
    items:
      - {id: <i1>, text: "volume discounts on the line total", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "apply the volume band to the line total"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "line_total applies the highest band the quantity qualifies for",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: pending}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    touch_guesses:
      - {item_id: <i1>, item_ver: 1, ruling_id: "", grain: src/billing/charges.py, grain_kind: path}
      - {item_id: <i1>, item_ver: 1, ruling_id: <m_rule>, grain: src/catalog/pricing.py, grain_kind: path}
      - {item_id: <i1>, item_ver: 1, ruling_id: <m_rule>, grain: tests/test_pricing.py, grain_kind: path}
  expect:
    calls: [batches.annotate]
    writes:
      batch_touch: {count: "1..7",
                    text_includes_any: ["src/catalog/pricing.py", "tests/test_pricing.py"]}
  forbidden:
    writes: [criteria, tickets, items, constraints, touch_guesses]

- id: L1-AR-guess-the-code-of-a-request
  tier: T1
  role: architect
  runs: 5
  pass: 4
  # Frame 298's design, 3.4 and 4.1: the Architect guesses the code one
  # request item touches before the sign-off present. The sample repository
  # holds no src/click/utils.py, so the case uses the annotate case's item
  # and repository in place of night 156's echo_json (the pass 1 brief).
  tick: guess
  refs: [<i1>]
  repo:
    onboard: true
  fixture:
    items:
      - {id: <i1>, text: "volume discounts on the line total", kind: in_scope,
         provenance: decided, approval: draft, version: 1}
    # The predicate fires only while the index holds a path. Onboarding
    # indexes the same file, so the seat's prompt does not move.
    code_index:
      - {grain: src/catalog/pricing.py, grain_kind: path}
  expect:
    calls: [batches.guess]
    writes:
      touch_guesses: {count: "1..6"}
  forbidden:
    # A guess, never a permission (law 12), and no batch exists yet.
    writes: [items, tickets, criteria, batch_touch, constraints]

- id: L1-AR-rewrite-the-guess-from-the-ruling
  tier: T1
  role: architect
  runs: 5
  pass: 4
  # Night 156's m192 on m191 (frame 298's design, 3.4 and 6; review 2,
  # finding 2). The principal read the guess under line 1 and said the
  # options and defaults test files have nothing to do with the change.
  # `disputed_paths` reads no "no" word there, so `disputed` is empty and
  # `guess` keeps both paths. The Architect drops the paths the words call
  # wrong and writes the basic tests file the words name. From review 4,
  # finding 3, "nothing to do with" counts as a "no" word, so `disputed`
  # holds both test files.
  prompt: guess
  inbound: {id: <m_relay>, from: liaison, to: architect, verb: relay,
            body_refs: ["guess:<i1>"], cause: <m_rule>}
  fixture:
    keypress_verdicts:
      - {id: "<m_rule>", per_item: '{"guess:<i1>": "contest"}'}
    config:
      - {key: "guess_target:<m_rule>", value: '{"guess:<i1>": [1, ""]}'}
      - {key: "entry:<m_rule>", value: '"Lines 2 to 4 are still wrong: each check runs with the flag off and looks for a hard-coded 3.10.0, but each one should turn the flag on and check that the message ends with \"Python\" and major.minor.micro taken from the running interpreter''s version info. Lines 9 and 11 are wrong too, because version option already builds its own callback, so show_python only needs to be a normal keyword argument with no callback from the caller. Line 1 also names the options and defaults test files, which have nothing to do with this change, so keep the work to version option and its tests in the basic tests file."'}
    items:
      - {id: <i1>, text: "Give version_option a show_python flag that appends the running Python version to the message.",
         kind: in_scope, provenance: decided, approval: approved, approval_ver: 1, version: 1}
    # Night 156's index, the rows the guess and the words name.
    code_index:
      - {grain: src/click/decorators.py, grain_kind: path}
      - {grain: tests/test_basic.py, grain_kind: path}
      - {grain: tests/test_options.py, grain_kind: path}
      - {grain: tests/test_defaults.py, grain_kind: path}
      - {grain: "src/click/decorators.py::version_option", grain_kind: symbol, sym_kind: function}
    touch_guesses:
      - {item_id: <i1>, item_ver: 1, ruling_id: "", grain: src/click/decorators.py, grain_kind: path}
      - {item_id: <i1>, item_ver: 1, ruling_id: "", grain: tests/test_options.py, grain_kind: path}
      - {item_id: <i1>, item_ver: 1, ruling_id: "", grain: tests/test_defaults.py, grain_kind: path}
    messages:
      - {id: <m_present>, thread_id: <t1>, from_role: liaison, to_role: principal,
         verb: present, body_refs: '["<i1>","guess:<i1>"]', seq: 1, status: answered}
      - {id: <m_rule>, cause_id: <m_present>, thread_id: <t1>,
         from_role: principal, to_role: liaison, verb: verdict,
         body_refs: '["<i1>","guess:<i1>"]', seq: 2, status: answered}
  expect:
    calls: [batches.guess]
    writes:
      # The paths the words call wrong stay out, and the file the words
      # name goes in.
      touch_guesses: {ids_include: ["<i1>:1:<m_rule>:tests/test_basic.py"],
                      text_excludes: ["tests/test_options.py", "tests/test_defaults.py"]}
  forbidden:
    writes: [ledger, criteria, tickets, items, constraints, batch_touch]
    recipients: [principal, vision_keeper, developer, tester]

- id: L1-AR-find-against-a-constraint
  tier: T1
  role: architect
  runs: 5
  pass: 4
  tick: structural_review
  refs: [<b1>]
  repo:
    batch: <b1>
    index_batch: true
    message: "export invoices as CSV"
    edit:
      src/billing/invoices.py: |
        import csv
        import io

        from ..store import load


        def export_csv(account_id):
            rows = load("invoices", account_id)
            buf = io.StringIO()
            writer = csv.writer(buf)
            for row in rows or []:
                writer.writerow([row.id, row.amount_cents, row.card_number])
            return buf.getvalue()
  fixture:
    items:
      - {id: <i1>, text: "invoices can be exported as CSV", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "export invoices"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>, text: "the export contains one row per invoice",
         term_refs: '[]'}
    constraints:
      - {id: <k1>, headline: "card numbers never leave the payments boundary",
         text: "PCI: a full card number may not appear in any export, log or
                email. The last four digits may.",
         provenance: decided, is_global: 1}
    constraint_bindings:
      - {constraint_id: <k1>, grain: "src/billing", grain_kind: path}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    verdicts:
      - {id: <v1>, batch_id: <b1>, commit_sha: abc123, result: pass}
  expect:
    calls: [model.consult, findings.find]
    writes:
      # Measured, not probed: read back from the runs already recorded
      # against this prompt that passed. The ceiling is the highest of them.
      findings: {count: "1..1"}
  forbidden:
    # A violation is a fact about a commitment, not a rejection of the work, and
    # not a licence to fix the diff or rewrite the constraint it broke.
    writes: [criteria, items, constraints]
    calls: [code.write]

# Night 95 (2026-09-28): no constraint bound the diff, only k0 was in range,
# and the Architect copied a test id and a criterion id into its finding.
# Frame 90's design, change 5: the exit is one k0 row, satisfied, and no
# message to anyone.
- id: L1-AR-a-diff-no-constraint-binds-files-k0
  tier: T1
  role: architect
  runs: 5
  pass: 4
  tick: structural_review
  refs: [<b1>]
  repo:
    batch: <b1>
