# L1 — Critic, Tester, Architect. The judgement half of the delivery loop.
#
# Critic is the interesting one: it is starved on purpose, and the failure to
# watch for is a verdict that reaches past what it was given.

- id: L1-CR-pass-a-conforming-diff
  tier: T1
  role: critic
  runs: 5
  pass: 4
  tick: review
  refs: [<b1>]
  repo:
    batch: <b1>
    message: "prorate refuses more days than the period holds"
    edit:
      # The baseline guards the period and not the usage, so this is a real
      # diff. It has to be: an `edit:` identical to the file it replaces gives
      # Critic an empty diff, and a role that declines to judge what it cannot
      # see is behaving correctly while the case reads as a failure.
      src/billing/charges.py: |
        from dataclasses import dataclass


        @dataclass
        class Charge:
            id: str
            amount_cents: int
            description: str


        def total_of(charges):
            return sum(c.amount_cents for c in charges)


        def prorate(amount_cents, days_used, days_in_period):
            if days_in_period <= 0:
                raise ValueError("period must be positive")
            if days_used > days_in_period:
                raise ValueError("used more days than the period holds")
            return round(amount_cents * days_used / days_in_period)
  fixture:
    items:
      - {id: <i1>, text: "prorate charges on upgrade", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "prorate on upgrade"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "prorating more days than the period holds is refused",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    tests:
      - {id: <tst1>, batch_id: <b1>, criterion_id: <c1>, path: test_prorate.py,
         body: "assert prorate(999, 1, 3) == 333"}
    test_runs:
      - {id: <r1>, batch_id: <b1>, test_id: <tst1>, commit_sha: abc123, result: pass}
  expect:
    writes:
      verdicts: {count: 1}
  forbidden:
    # A judge that finds something wrong with everything is exactly as useless
    # as one that finds nothing. And it never touches what it judges.
    writes: [criteria, tests, items]
    recipients: [vision_keeper, architect, liaison]

- id: L1-CR-fail-names-its-criterion
  tier: T1
  role: critic
  runs: 5
  pass: 4
  tick: review
  refs: [<b1>]
  repo:
    batch: <b1>
    message: "delete an account"
    edit:
      src/billing/accounts.py: |
        from dataclasses import dataclass

        from ..store import Record, load, save


        @dataclass
        class BillingAccount:
            id: str
            name: str
            terms_days: int = 30


        def close_account(account_id):
            # Deletes the invoices too, which the criterion says must survive.
            rec = load("billing_accounts", account_id)
            if rec is None:
                return False
            from ..store.records import delete
            delete("invoices", account_id)
            delete("billing_accounts", account_id)
            return True
  fixture:
    items:
      - {id: <i1>, text: "deleting tombstones the account", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "delete an account"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "deleting an account tombstones it and keeps its invoices",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    tests:
      - {id: <tst1>, batch_id: <b1>, criterion_id: <c1>, path: test_delete.py,
         body: "assert deleted(account).invoices == []"}
    test_runs:
      - {id: <r1>, batch_id: <b1>, test_id: <tst1>, commit_sha: abc123, result: pass}
  expect:
    # The diff deletes the invoices, and the criterion keeps them, so a pass
    # is wrong. The count alone admitted a pass in 390 of 390 runs (frame
    # 170, 2026-10-07). Two routes are right. A fail on <c1> judges the code.
    # The test asserts the opposite of <c1>, so a challenge to the Tester
    # with no verdict is review.md step 2. The review tick fires only on a
    # green harness (rota/core/predicates.py:1155-1186), so a reachable
    # fixture cannot hold a test that encodes <c1> against this diff.
    any_of:
      - writes:
          verdicts: {count: 1, text_includes: ['"result": "fail"',
                                               '"failed_criterion": "<c1>"']}
      - messages:
          - {to: tester, verb: challenge, count: ">=1", refs_include: [<c1>, <tst1>]}
        writes:
          verdicts: {count: 0}
  forbidden:
    # The verdict judges the code. It never re-derives the criterion or
    # rewrites the test.
    writes: [criteria, tests]

# Night 101 (2026-09-30): the Critic failed click's bg_1 for the trailing
# newline that its criterion asks for. It read a purpose from the builder's
# docstring. Roman ruled on 2026-09-30 that the criterion's words bind a fail
# (13d138b2). Ruling 3 of 2026-11-03 adds one exception, a pushed commitment,
# and this case holds the rule for a docstring that is not one (frame 362,
# pass 3).
- id: L1-CR-a-purpose-in-a-docstring-is-not-a-fail
  tier: T1
  role: critic
  runs: 5
  pass: 4
  tick: review
  refs: [<b1>]
  repo:
    batch: <b1>
    message: "echo_json next to echo"
    edit:
      src/billing/output.py: |
        import json
        import sys


        def echo(message, file=None):
            """Write a message and a newline to a stream, stdout by default."""
            stream = file if file is not None else sys.stdout
            stream.write(f"{message}\n")


        def echo_json(obj, file=None):
            """Write an object for scripts that parse it, byte for byte as
            json.dumps gives it."""
            echo(json.dumps(obj, separators=(",", ":")), file=file)
  fixture:
    items:
      - {id: <i1>, text: "print an object as JSON next to echo", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "add echo_json next to echo"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "echo_json(obj) writes obj as compact JSON on one line, followed by a newline",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    tests:
      - {id: <tst1>, batch_id: <b1>, criterion_id: <c1>, path: test_output.py,
         body: "echo_json({'key': 'value'}, file=s); assert s.getvalue() == '{\"key\":\"value\"}\\n'"}
    test_runs:
      - {id: <r1>, batch_id: <b1>, test_id: <tst1>, commit_sha: abc123, result: pass}
  expect:
    # The docstring says "byte for byte as json.dumps gives it", and the
    # criterion asks for the newline. The criterion binds, so a pass.
    writes:
      verdicts: {count: 1, text_includes: ['"result": "pass"']}
  forbidden:
    writes: [criteria, tests, items]
    recipients: [vision_keeper, architect, liaison]

# Ruling 3 of 2026-11-03: a broken promise to outside programs stops the
# merge, also when the request does not name it. The push quotes the
# commitment and its witness line, so the Critic fails the diff on the
# commitment, outside the criteria (frame 362, pass 3). The witness key is
# `harvest.witness_key` of the candidate's kind, path and text.
- id: L1-CR-a-broken-pushed-commitment-is-a-fail
  tier: T1
  role: critic
  runs: 5
  pass: 4
  tick: review
  refs: [<b1>]
  repo:
    batch: <b1>
    message: "plural says no items for zero"
    edit:
      src/notify/formatting.py: |
        ELLIPSIS = chr(8230)


        def truncate(text, limit=80):
            return text if len(text) <= limit else text[: limit - 1] + ELLIPSIS


        def plural(count, singular, plural_form=None):
            if count == 0:
                return f"no {plural_form or singular + 's'}"
            if count == 1:
                return f"1 {singular}"
            return f"{count} {plural_form or singular + 's'}"
  fixture:
    items:
      - {id: <i1>, text: "plural says no items for zero", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "plural of zero"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "plural(0, 'item') returns 'no items'",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    batch_touch:
      - {batch_id: <b1>, grain: src/notify/formatting.py, grain_kind: path}
    tests:
      - {id: <tst1>, batch_id: <b1>, criterion_id: <c1>, path: test_formatting.py,
         body: "assert plural(0, 'item') == 'no items'"}
    test_runs:
      - {id: <r1>, batch_id: <b1>, test_id: <tst1>, commit_sha: abc123, result: pass}
    commitment_candidates:
      - {id: cc_41ef9c8a7252, kind: numeric_default, path: src/notify/formatting.py,
         line: 4, text: "def truncate(text, limit=72):", symbol: truncate,
         commit_sha: c1}
    candidate_bindings:
      - {witness_id: cc_41ef9c8a7252, path: src/notify/formatting.py, rule: witness_file}
    constraints:
      - {id: <k1>, headline: "src/notify/formatting.py: def truncate(text, limit=72)",
         text: "Mail clients show at most 72 characters of a subject line.",
         party: "the mail clients that show the subject line",
         behaviour: "truncate returns at most 72 characters",
         witness: wk_3d6a7794b9ee, provenance: observed, is_global: 0}
    constraint_bindings:
      - {constraint_id: <k1>, grain: src/notify/formatting.py, grain_kind: path, resolves: 1}
  expect:
    # The criterion is met. The diff moves the limit to 80, which no
    # criterion names, and the pushed commitment says 72. So a fail that
    # names the commitment.
    writes:
      verdicts: {count: 1, text_includes: ['"result": "fail"',
                                           '"failed_commitment": "<k1>"']}
  forbidden:
    writes: [criteria, tests, items, constraints]

# Night 174 (sprint 35 row 4): bg_2 changed clear() to return a bool, and
# c_3_clear_prints_same said the printed output stays the same. No added line
# meets such a criterion. The door refused the comment that stated it, and the
# Critic failed c_3 three times (plans/night174-read.md line 71). Here the
# same shape is on send(): the return value changes, and the delivered
# message stays. The kept line `smtp.send_message(msg)` meets <c3>.
- id: L1-CR-a-kept-behaviour-passes-by-its-kept-line
  tier: T1
  role: critic
  runs: 5
  pass: 4
  tick: review
  refs: [<b1>]
  repo:
    batch: <b1>
    message: "send returns True when it has sent the message"
    edit:
      src/notify/delivery.py: |
        import smtplib
        from email.message import EmailMessage

        from .templates import render


        def build(to, subject, template, **values):
            msg = EmailMessage()
            msg["To"] = to
            msg["Subject"] = subject
            msg.set_content(render(template, **values))
            return msg


        def send(msg, host="localhost", port=25) -> bool:
            with smtplib.SMTP(host, port) as smtp:
                smtp.send_message(msg)
            return True
  fixture:
    items:
      - {id: <i1>, text: "send reports that it sent the message", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "send returns a bool"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "send() returns True when it has sent the message",
         term_refs: '[]'}
      - {id: <c3>, ticket_id: <tk1>,
         text: "The message sent by send() remains exactly the same; only the return value changes behavior",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: HEAD}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    tests:
      - {id: <tst1>, batch_id: <b1>, criterion_id: <c1>, path: test_send.py,
         body: "assert send(msg) is True"}
      - {id: <tst3>, batch_id: <b1>, criterion_id: <c3>, path: test_send.py,
         body: "assert sent_messages() == [msg]"}
    test_runs:
      - {id: <r1>, batch_id: <b1>, test_id: <tst1>, commit_sha: HEAD, result: pass}
      - {id: <r3>, batch_id: <b1>, test_id: <tst3>, commit_sha: HEAD, result: pass}
  expect:
    # The pass lands through the kept route or the test route for <c3>.
    # Both are right, because <tst3> binds <c3> and passed (frame 344,
    # review 1, finding 3). A fail on <c3> is the night's wrong verdict.
    any_of:
      - writes:
          verdicts: {count: 1, text_includes: ['"result": "pass"', 'kept:']}
      - writes:
          verdicts: {count: 1, text_includes: ['"result": "pass"', 'test:']}
  forbidden:
    writes: [criteria, tests, items]
    recipients: [vision_keeper, architect, liaison]

# Night 94 (2026-09-27): the Critic passed `bg_1`, then the Architect filed a
# finding against `echo`, a constraint the Critic had falsified in s78. The
# finding woke the Developer twice and the batch never merged. Ruled by Roman
