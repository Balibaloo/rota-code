  pass: 3
  tick: finding_review
  refs: [<b1>, <f1>]
  repo:
    batch: <b1>
    message: "echo_json next to echo"
    edit:
      src/billing/output.py: |
        import json
        import sys


        def echo(message, file=None):
            """Write a message and a newline to a stream, stdout by default."""
            stream = file if file is not None else sys.stdout
            stream.write(f"{message}\n")


        def echo_json(obj, file=None):
            """Write an object as compact JSON on one line."""
            echo(json.dumps(obj), file=file)
  fixture:
    items:
      - {id: <i1>, text: "print an object as JSON next to echo", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "add echo_json next to echo"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "echo_json(obj) writes obj as compact JSON on one line, followed by a newline",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    tests:
      - {id: <tst1>, batch_id: <b1>, criterion_id: <c1>, path: test_output.py,
         body: "echo_json({'key': 'value'}, file=s); assert s.getvalue() == '{\"key\": \"value\"}\\n'"}
    test_runs:
      - {id: <r1>, batch_id: <b1>, test_id: <tst1>, commit_sha: abc123, result: pass}
    verdicts:
      - {id: "critic:<b1>:abc123", batch_id: <b1>, commit_sha: abc123, result: pass}
    constraints:
      - {id: <k1>, headline: "echo writes to the terminal",
         text: "echo is for applications that need to output messages to the terminal.",
         provenance: observed, is_global: 0}
    constraint_bindings:
      - {constraint_id: <k1>, grain: src/billing/output.py, grain_kind: path, resolves: 1}
    challenges:
      - {id: "constraints:<k1>", verdict: falsified, citation: src/billing/output.py,
         quote: "def echo(message, file=None):",
         why: "echo accepts any file-like object, not only the terminal, which contradicts the claim that it is for terminal output."}
    findings:
      - {id: <f1>, batch_id: <b1>, constraint_id: <k1>, commit_sha: abc123,
         status: violated, grain: src/billing/output.py::echo_json}
  expect:
    # The Critic's own challenge falsified the constraint the finding stands
    # on, so the finding does not hold the merge.
    writes:
      finding_rulings: {count: 1, text_includes: [dismissed]}
  forbidden:
    writes: [verdicts, findings, constraints, challenges, criteria, tests]

- id: L1-TS-encode-a-criterion
  tier: T1
  role: tester
  runs: 5
  pass: 4
