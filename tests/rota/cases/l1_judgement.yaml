# L1 — Critic, Tester, Architect. The judgement half of the delivery loop.
#
# Critic is the interesting one: it is starved on purpose, and the failure to
# watch for is a verdict that reaches past what it was given.

- id: L1-CR-pass-a-conforming-diff
  tier: T1
  role: critic
  runs: 5
  pass: 4
  tick: review
  repo:
    batch: b1
    message: "prorate rounds to the nearest cent"
    edit:
      src/billing/charges.py: |
        from dataclasses import dataclass


        @dataclass
        class Charge:
            id: str
            amount_cents: int
            description: str


        def total_of(charges):
            return sum(c.amount_cents for c in charges)


        def prorate(amount_cents, days_used, days_in_period):
            if days_in_period <= 0:
                raise ValueError("period must be positive")
            return round(amount_cents * days_used / days_in_period)
  fixture:
    items:
      - {id: i1, text: "prorate charges on upgrade", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: tk1, item_id: i1, text: "prorate on upgrade"}
    criteria:
      - {id: c1, ticket_id: tk1, text: "prorate(999, 1, 3) returns 333",
         term_refs: '[]'}
    batches:
      - {id: b1, item_id: i1, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: b1, ticket_id: tk1}
    tests:
      - {id: tst1, batch_id: b1, criterion_id: c1, path: test_prorate.py,
         body: "assert prorate(999, 1, 3) == 333"}
    test_runs:
      - {id: r1, batch_id: b1, test_id: tst1, commit_sha: abc123, result: pass}
  expect:
    writes:
      verdicts: {count: 1}
  forbidden:
    # A judge that finds something wrong with everything is exactly as useless
    # as one that finds nothing. And it never touches what it judges.
    writes: [criteria, tests, items]
    recipients: [gatekeeper, architect, liaison]

- id: L1-CR-fail-names-its-criterion
  tier: T1
  role: critic
  runs: 5
  pass: 4
  tick: review
  repo:
    batch: b1
    message: "delete an account"
    edit:
      src/billing/accounts.py: |
        from dataclasses import dataclass

        from ..store import Record, load, save


        @dataclass
        class BillingAccount:
            id: str
            name: str
            terms_days: int = 30


        def close_account(account_id):
            # Deletes the invoices too, which the criterion says must survive.
            rec = load("billing_accounts", account_id)
            if rec is None:
                return False
            from ..store.records import delete
            delete("invoices", account_id)
            delete("billing_accounts", account_id)
            return True
  fixture:
    items:
      - {id: i1, text: "deleting tombstones the account", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: tk1, item_id: i1, text: "delete an account"}
    criteria:
      - {id: c1, ticket_id: tk1,
         text: "deleting an account tombstones it and keeps its invoices",
         term_refs: '[]'}
    batches:
      - {id: b1, item_id: i1, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: b1, ticket_id: tk1}
    tests:
      - {id: tst1, batch_id: b1, criterion_id: c1, path: test_delete.py,
         body: "assert deleted(account).invoices == []"}
    test_runs:
      - {id: r1, batch_id: b1, test_id: tst1, commit_sha: abc123, result: pass}
  expect:
    writes:
      verdicts: {count: 1}
  forbidden:
    # The test contradicts its criterion — invoices must survive. That is a
    # challenge to Tester, never a re-derivation of the criterion.
    writes: [criteria, tests]

- id: L1-TS-encode-a-criterion
  tier: T1
  role: tester
  runs: 5
  pass: 4
  tick: tests_missing
  fixture:
    items:
      - {id: i1, text: "prorate charges on upgrade", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: tk1, item_id: i1, text: "prorate on upgrade"}
    criteria:
      - {id: c1, ticket_id: tk1, text: "prorate(999, 1, 3) returns 333",
         term_refs: '[]'}
    batches:
      - {id: b1, item_id: i1, status: pending}
    batch_tickets:
      - {batch_id: b1, ticket_id: tk1}
  expect:
    writes:
      tests: {count: ">=1"}
  forbidden:
    # Tester writes what "done" means. It does not decide what was asked for,
    # and it never writes the code that would satisfy its own test.
    writes: [criteria, items, tickets]

- id: L1-AR-constrain-an-external-commitment
  tier: T1
  role: architect
  runs: 5
  pass: 4
  fixture:
    entries:
      - {id: e1, author: principal, ts_order: 1,
         text: "invoices have to survive account deletion for seven years"}
    statements:
      - {id: s1, span_entry: e1, span_start: 0, span_end: 56,
         text: "invoices have to survive account deletion for seven years",
         status: ratified}
  inbound: {from: liaison, to: architect, verb: deliver, body_refs: [s1]}
  expect:
    writes:
      constraints: {count: ">=1"}
  forbidden:
    # A constraint protects an external commitment. Deciding *whether* to keep
    # invoices is scope, and scope is Gatekeeper's.
    writes: [items, tickets, criteria]

- id: L1-AR-group-into-batches
  tier: T1
  role: architect
  runs: 5
  pass: 4
  tick: grouping
  fixture:
    items:
      - {id: i1, text: "delete an account", kind: in_scope, provenance: decided,
         approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: tk1, item_id: i1, text: "add the delete button"}
      - {id: tk2, item_id: i1, text: "tombstone the account row"}
    criteria:
      - {id: c1, ticket_id: tk1, text: "the button asks for confirmation",
         term_refs: '[]'}
      - {id: c2, ticket_id: tk2, text: "the row is tombstoned, not removed",
         term_refs: '[]'}
  expect:
    writes:
      batches: {count: ">=1"}
  forbidden:
    # Grouping is composition. It does not write the criteria it groups by, and
    # it does not decide what is in scope.
    writes: [criteria, tickets, items]
