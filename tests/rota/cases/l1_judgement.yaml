- id: L1-CR-a-test-that-encodes-nothing-is-a-challenge
  tier: T1
  # The Critic's model in the local profile is gemma3:12b, which passes
  # all four Critic cases 5/5 (2026-09-12); qwen3:8b passes a wrong diff.
  model: gemma3:12b
  role: critic
  runs: 5
  pass: 3
  tick: review
  refs: [<b1>]
  repo:
    batch: <b1>
    message: "close an account"
    # The sample file whole with one line changed, so the diff deletes
    # nothing the Critic could review instead (observed: the ten-reds
    # record, 2026-09-24).
    edit:
      src/billing/accounts.py: |
        from dataclasses import dataclass

        from ..store import Record, load, save


        @dataclass
        class BillingAccount:
            """Who the invoice is addressed to. May cover several login identities."""
            id: str
            name: str
            terms_days: int = 30


        def open_account(id, name, terms_days=30):
            save(Record("billing_accounts", id, {"name": name, "terms_days": terms_days}))
            return BillingAccount(id, name, terms_days)


        def balance(account_id, conn=None):
            conn = conn or None
            rows = load("invoices", account_id, conn)
            if rows is None:
                return 0
            return sum(int(v) for k, v in rows.values.items() if k == "total_cents")


        def close_account(account_id):
            # Closing does not delete: the invoices have to survive for seven years.
            rec = load("billing_accounts", account_id)
            if rec is None:
                return False
            rec.values["state"] = "tombstoned"
            save(rec)
            return True
  fixture:
    items:
      - {id: <i1>, text: "closing tombstones the account", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "close an account"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "closing an account tombstones it and keeps its invoices",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    tests:
      - {id: <tst1>, batch_id: <b1>, criterion_id: <c1>, path: test_close.py,
         body: "assert close_account('a1') is not None"}
    test_runs:
      - {id: <r1>, batch_id: <b1>, test_id: <tst1>, commit_sha: abc123,
         result: pass}
  expect:
    # The diff satisfies the criterion; the test does not encode it -- it
    # would pass whatever close_account did to the invoices. The review
    # brief's own line: a test that does not encode its criterion is
    # `msg.challenge_tester`, not a fail -- and not a pass either, because a
    # green verdict here merges a batch whose safety net has a hole.
    messages:
      - {to: tester, verb: challenge, count: ">=1", refs_include: [<c1>, <tst1>]}
  forbidden:
    writes: [criteria, tests, verdicts]

# Frame 107 (ruled: Roman, 2026-10-01: the Critic's doubt about a criterion
# goes to the Terminologist, the writer of the criteria). The Critic cannot
# read the item row, so the doubt comes from the criterion and the code. The
# criterion says the invoices go. The test encodes that, and the diff meets
# it. The code's own comment says the invoices must survive.
- id: L1-CR-a-doubtful-criterion-is-a-question-to-the-terminologist
  tier: T1
  model: qwen3:8b
  role: critic
  runs: 5
  pass: 3
  tick: review
  refs: [<b1>]
  repo:
    batch: <b1>
    message: "close an account"
    # The sample file whole, with `delete` in the import and the delete
    # before the tombstone. The comment stays and carries the doubt. The
    # delete sits under the comment, so the diff's context shows the
    # comment. Four lines away, the seat never saw it (observed: frame 107's
    # re-record, 2026-10-01 22:03, 0 of 5).
    edit:
      src/billing/accounts.py: |
        from dataclasses import dataclass

        from ..store import Record, delete, load, save


        @dataclass
        class BillingAccount:
            """Who the invoice is addressed to. May cover several login identities."""
            id: str
            name: str
            terms_days: int = 30


        def open_account(id, name, terms_days=30):
            save(Record("billing_accounts", id, {"name": name, "terms_days": terms_days}))
            return BillingAccount(id, name, terms_days)


        def balance(account_id, conn=None):
            conn = conn or None
            rows = load("invoices", account_id, conn)
            if rows is None:
                return 0
            return sum(int(v) for k, v in rows.values.items() if k == "total_cents")


        def close_account(account_id):
            # Closing does not delete: the invoices have to survive for seven years.
            delete("invoices", account_id)
            rec = load("billing_accounts", account_id)
            if rec is None:
                return False
            rec.values["state"] = "tombstoned"
            save(rec)
            return True
  fixture:
    items:
      - {id: <i1>, text: "closing an account", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "close an account"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "closing an account tombstones it and deletes its invoices",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    tests:
      - {id: <tst1>, batch_id: <b1>, criterion_id: <c1>, path: test_close.py,
         body: "close_account('a1')\nassert load('invoices', 'a1') is None\nassert load('billing_accounts', 'a1').values['state'] == 'tombstoned'"}
    test_runs:
      - {id: <r1>, batch_id: <b1>, test_id: <tst1>, commit_sha: abc123,
         result: pass}
  expect:
    # The diff meets the criterion as written, so the verdict is a pass.
    # The doubt travels beside it as one question to the Terminologist.
    writes:
      verdicts: {count: 1, text_includes: ['"result": "pass"']}
    messages:
      - {to: terminologist, verb: question, count: 1, refs_include: [<c1>]}
  forbidden:
    recipients: [tester, developer]

- id: L1-AR-a-dead-end-leaves-the-desk-to-a-named-seat
  tier: T1
  role: architect
  runs: 5
  pass: 3
  tick: exhausted
  refs: [<b1>]
  repo:
    batch: <b1>
    # The tenth attempt, committed. With no edit the batch's diff is empty
    # since its fork (commit 4876aae), and the seat reads that as no work done.
    message: "stream the export"
    edit:
      src/catalog/export.py: |
        import csv

        from ..store import connect


        def export_csv(scope, out):
            conn = connect()
            query = "SELECT id, name, ingredients FROM recipes"
            if scope != "all":
                query += " WHERE collection = ?"
            cursor = conn.execute(query, () if scope == "all" else (scope,))
            writer = csv.writer(out)
            writer.writerow(["id", "name", "ingredients"])
            count = 0
            for row in cursor:
                writer.writerow([row["id"], row["name"], row["ingredients"]])
                count += 1
            return count
  fixture:
    items:
      - {id: <i1>, text: "exports stream in constant memory", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "stream the export"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "export_csv('all') peaks under 64MB for a 1GB recipe set",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    constraints:
      - {id: <cn1>, provenance: decided,
         headline: "exports never buffer the whole set",
         text: "memory stays flat however large the recipe set grows"}
    tests:
      - {id: <tst1>, batch_id: <b1>, criterion_id: <c1>, path: test_mem.py,
         body: "assert peak_memory(export_csv, 'all') < 64 * 2**20"}
    test_runs:
      # At the loop cap: what makes the batch exhausted rather than bouncing.
      # `HEAD` so the fixture names the edit's commit as the failed attempt.
      # The output is the measured peak. The streamed attempt still holds the set.
      - id: <r1>
        batch_id: <b1>
        test_id: <tst1>
        commit_sha: HEAD
        result: fail
        attempt: 10
        output: |
          E       assert 2039480320 < 67108864
          E        +  where 2039480320 = peak_memory(export_csv, 'all')
          1 failed in 41.73s
    sessions:
      # The rung is derived from the sessions the exhaustion opened (frame 79,
      # 2026-09-24). The message stays because the prompt reads it.
      - {id: <s_dev>, role: developer, seq: 1, wake_kind: "tick:exhausted",
         wake_refs: '["<b1>"]', committed: 1}
    messages:
      - {id: <me1>, thread_id: <te1>, from_role: developer, to_role: architect,
         verb: escalate, body_refs: '["<b1>"]', seq: 1, status: answered}
  expect:
    # The second rung. The stall leaves the Architect's desk to a named next
    # seat, with the batch in refs. A proposal or a challenge goes to the
    # Vision Keeper. A report goes to the Liaison. The Liaison exit alone has
    # no case, and it is in the coverage backlog (frame 106, ruled: Roman,
    # 2026-10-01).
    any_of:
      - messages: [{to: vision_keeper, verb: propose, count: ">=1", refs_include: [<b1>]}]
      - messages: [{to: vision_keeper, verb: challenge, count: ">=1", refs_include: [<b1>]}]
      - messages: [{to: liaison, verb: report, count: ">=1", refs_include: [<b1>]}]
  forbidden:
    # Reporting is not amending: a dead end you cannot name is not a licence
    # to reshape the model until you can.
    writes: [constraints, model_areas, items, tickets, criteria]
