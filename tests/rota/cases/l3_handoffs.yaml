# L3 — handoffs. Does A's message make B do the right thing?
#
# The tier the whole design rests on, and the only one that cannot be faked with
# two independent cases. Every other test hands a role a message somebody wrote
# by hand, which measures whether it can act on a *well-formed* message. Here the
# second session is woken by the first session's own outbound row — same verb,
# same refs, nothing rewritten in between — so what is under test is whether the
# vocabulary carries enough for a stranger to act on.
#
# The two roles share a database and nothing else. No context, no history, no
# prose channel. That is the arrangement being tested, not an implementation
# detail, and a chain that fails because A said too little is exactly the finding
# the tier exists to produce.

- id: L3-ratified-statement-becomes-scope
  tier: T3
  runs: 5
  pass: 3
  first: {role: liaison, prompt: verdict, verb: verdict, refs: [<s1>]}
  then:  {role: vision_keeper}
  fixture:
    entries:
      - {id: <e1>, author: principal, ts_order: 1,
         text: "people should be able to close their account, and the invoices
                have to stay"}
    statements:
      - {id: <s1>, span_entry: <e1>, span_start: 0, span_end: 70,
         text: "people can close their account and the invoices are kept",
         status: proposed}
  expect:
    # Liaison broadcasts the ratified statement; Vision Keeper turns it into scope.
    # Nothing hand-written passes between them — if `deliver` with a statement
    # ref is not enough to produce an item, the vocabulary is too thin.
    writes:
      items: {count: ">=1"}
  forbidden:
    # Vision Keeper decides what is in scope. It does not write the words the
    # statement is made of, nor the criteria that would test it.
    writes: [statements, glossary_terms, criteria, tickets]

- id: L3-ratified-statement-becomes-a-term
  tier: T3
  runs: 5
  pass: 3
  first: {role: liaison, prompt: verdict, verb: verdict, refs: [<s1>]}
  then:  {role: terminologist}
  fixture:
    entries:
      - {id: <e1>, author: principal, ts_order: 1,
         text: "closing an account should not touch the billing account"}
    statements:
      - {id: <s1>, span_entry: <e1>, span_start: 0, span_end: 58,
         text: "closing an account does not touch the billing account",
         status: proposed}
  expect:
    # The statement uses "account" twice meaning two things. That is a term
    # collision arriving as ordinary English, and noticing it is the job.
    writes:
      # Measured, not probed: read back from the runs already recorded
      # against this prompt that passed. The ceiling is the highest of them.
      glossary_terms: {count: "1..2"}
  forbidden:
    writes: [items, statements, tickets]

- id: L3-scope-becomes-a-ticket-with-criteria
  tier: T3
  runs: 5
  pass: 3
  first: {role: vision_keeper, tick: slicing, refs: [<i1>]}
  then:  {role: terminologist, tick: criteria}
  fixture:
    items:
      - {id: <i1>, text: "people can close their account and the invoices are kept",
         kind: in_scope, provenance: decided, approval: approved,
         approval_ver: 1, version: 1}
    glossary_terms:
      - {id: <g1>, term: account, provenance: decided,
         sense_short: "the login identity"}
  expect:
    # Vision Keeper slices; Terminologist writes what done means for what it sliced.
    # The handoff here is not a message at all — it is a *state*, which is the
    # other half of the frontier and the half nothing has tested.
    writes:
      # Measured, not probed: read back from the runs already recorded
      # against this prompt that passed. The ceiling is the highest of them.
      criteria: {count: "1..7"}
  forbidden:
    # Criteria are written against the ticket that exists, not against a
    # re-reading of what the item should have said.
    writes: [items, tickets]

- id: L3-a-challenge-reaches-the-role-that-can-answer-it
  tier: T3
  runs: 5
  pass: 3
  first: {role: terminologist, tick: criteria, refs: [<i1>]}
  then:  {role: vision_keeper}
  fixture:
    items:
      # Unbuildable as written, and Terminologist is the role that finds out —
      # it is the one asked to say what "done" would mean.
      - {id: <i1>, text: "make the reporting better", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "make the reporting better"}
  expect:
    # Whether the item changes is Vision Keeper's call; that it is *answered* is
    # the law. Silence here strands the ticket forever with no criteria.
    any_of:
      - writes: {items: {count: ">=1"}}
      - writes: {decisions: {count: ">=1"}}
  forbidden:
    writes: [glossary_terms, criteria]

- id: L3-a-failed-verdict-turns-into-a-fix
  tier: T3
  runs: 5
  pass: 3
  first: {role: critic, tick: review, refs: [<b1>]}
  # The handoff is the artefact and the frontier, not a message: the fail
  # verdict lands as a row and `verdict_failed` wakes the Developer from it.
  # Declared as `prompt:` until 2026-09-03, which demanded a critic→developer
  # *message* — and passed only because the verb-generic verdict guard forced
  # the Critic into `challenge_developer` instead of a verdict: the wrong
  # route wearing the right name. The recipient-scoped guard exposed it.
  then:  {role: developer, tick: verdict_failed, refs: [<b1>]}
  repo:
    batch: <b1>
    message: "close an account"
    edit:
      src/billing/accounts.py: |
        from dataclasses import dataclass

        from ..store import Record, load, save


        @dataclass
        class BillingAccount:
            id: str
            name: str
            terms_days: int = 30


        def close_account(account_id):
            # Removes the invoices, which the criterion says must survive.
            from ..store.records import delete
            delete("invoices", account_id)
            delete("billing_accounts", account_id)
            return True
  fixture:
    items:
      - {id: <i1>, text: "closing an account keeps its invoices", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "close an account"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "closing an account marks it closed and leaves its invoices in place",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    tests:
      - {id: <tst1>, batch_id: <b1>, criterion_id: <c1>, path: test_close.py,
         body: "close_account(a); assert invoices_for(a) != []"}
    test_runs:
      - {id: <r1>, batch_id: <b1>, test_id: <tst1>, commit_sha: abc123, result: pass}
  expect:
    # A verdict names a criterion and carries no argument. The whole question is
    # whether one criterion id is enough for a cold Developer to find and fix
    # what was wrong — which is the design's central bet, stated as a test.
    calls: [code.write, code.commit]
  forbidden:
    writes: [criteria, verdicts, items]

- id: L3-a-maintainers-question-reaches-the-owner
  tier: T3
  runs: 5
  pass: 3
  # Validation 2's first hop, run as a hop rather than as two cases.
  #
  # `probes/consult.py` measured the routing idea against a hand-written charter
  # and its own dump of each artefact, and it beat the monolithic dump 4-8 to
  # 2-8. None of that touched the system: the route was drawn in the graph, had
  # a brief at both ends, and had never carried a message. Here it carries one,
  # and the second session is woken by the first session's own outbound row.
  #
  # What is under test is narrower than "did it answer well". The ask channel
  # takes refs and nothing else, so the whole of how the principal's words reach
  # the owner is the entry id Liaison chose to put in them. A leg one that asks
  # with empty refs produces a leg two woken to answer nothing, and it looks
  # from the outside exactly like a leg one that worked.
  first: {role: liaison, prompt: converse, verb: converse, inbound: <m1>}
  then:  {role: terminologist}
  fixture:
    entries:
      - {id: e_<m1>, author: principal, ts_order: 1,
         text: "what do we mean by an account here?"}
    messages:
      - {id: <m1>, thread_id: <t1>, from_role: principal, to_role: liaison,
         verb: converse, body_refs: '["e_<m1>"]', seq: 1, status: open}
    glossary_terms:
      - {id: <g1>, term: account, provenance: observed,
         sense_short: "the login identity"}
      - {id: <g2>, term: account, provenance: observed,
         sense_short: "the billing entity that owes money"}
  expect:
    # Two live senses is the answer, and saying one of them would be resolving a
    # collision, which is a decision, which is a write this session does not
    # have. The refs are what carry it back.
    #
    # `refs_include` is what makes this case worth running. Without it the case
    # passed while the route was broken: the ask reached Terminologist with a
    # ref it could not follow -- `_resolve_refs` had no `entries` row, so the
    # question resolved to nothing -- and an owner handed nothing still sends
    # an answer, from memory. On the live click run the same fault had Architect
    # describe a three-layer architecture click does not have. Requiring the
    # answer to name rows from the artefact it owns is the difference between
    # "it replied" and "it replied from somewhere".
    messages:
      - {to: liaison, verb: answer, count: 1, refs_include: [<g1>, <g2>]}
  forbidden:
    # Read-only means read-only: law 10's guarantee is that the writers were
    # never built, so a breach here is a breach of the mode and not of a rule.
    writes: [glossary_terms, statements, items, decisions]
