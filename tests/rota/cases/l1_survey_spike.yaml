# The survey spike (Roman, 2026-09-15): does the survey brief make the model
# write constraints that bind? Five areas of the sample repository, one kind
# each: a signature callers rely on, an exception contract, a patch seam, a
# shared helper, an exported name. Pass: a constraint names the surface and
# cites a source line. The wording under test is the brief's 'who outside
# this repository breaks', which rules importers out; for a library the
# importers are the outside.

- id: L1-AR-survey-a-signature-callers-rely-on
  tier: T1
  role: architect
  runs: 5
  pass: 3
  # Survey spike (Roman, 2026-09-15). Kind: a signature callers rely on. billing/subscriptions.py calls catalog.pricing.price_for(sku); a renamed parameter or return breaks it.
  # Scored on a called symbol of the area named in the constraint and the
  # constraint bound to a grain (is_global 0: the tool sets it from bindings
  # and refuses a grain the session did not open). source_refs are
  # reference ids, not source lines; the tool drops unknown ones by design.
  tick: survey
  tick_unseedable: areas are created by repo onboarding, not by fixture rows
  refs: [src/catalog]
  repo:
    onboard: true
  expect:
    writes:
      model_areas: {count: 1}
      survey_records: {count: 1}
      constraints: {count: "1..9", text_includes: ['"is_global": 0'], text_includes_any: ["price_for", "line_total", "get", "all_products"]}
  forbidden:
    writes: [glossary_terms, items, criteria]

