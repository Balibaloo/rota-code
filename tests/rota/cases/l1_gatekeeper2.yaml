# L1 — Vision Keeper, the modes the first file left uncovered.
#
# Vision Keeper is the only role that can change what is in scope, which makes its
# failures the quiet expensive kind: an item amended without dropping its
# approval, or a contest answered by arguing rather than by deciding.

- id: L1-VK-amend-a-contested-item
  tier: T1
  role: vision_keeper
  runs: 5
  pass: 4
  tick: contested
  refs: [<i1>]
  fixture:
    entries:
      - {id: <e1>, author: principal, ts_order: 1,
         text: "no, I meant closing the account, not deleting it"}
    # An item always came from a statement -- Vision Keeper writes them off what
    # Liaison delivers -- and this case used to seed an orphan, which left the
    # correction sitting in a transcript the role had no id for. It answered
    # the exit interview exactly that way: "I needed to know what the principal
    # said they meant instead, but that information was not available."
    statements:
      - {id: <s1>, span_entry: <e1>, span_start: 0, span_end: 47,
         text: "closing an account is not deleting it", status: ratified}
    items:
      - {id: <i1>, text: "users can delete their account", kind: in_scope,
         provenance: decided, approval: contested, approval_ver: 1, version: 1}
    item_statements:
      - {item_id: <i1>, statement_id: <s1>}
  expect:
    writes:
      items: {count: ">=1"}
  forbidden:
    # They said what they meant. Amending is the answer; defending an item the
    # principal has just corrected is arguing with the only authority there is.
    writes: [tickets, criteria, glossary_terms]
    calls: [decisions.author]

- id: L1-VK-amend-a-contested-item-from-a-verdict
  tier: T1
  role: vision_keeper
  runs: 5
  pass: 4
  tick: contested
  refs: [<i1>]
  fixture:
    # The shape the running system actually produces, as against the case
    # above, whose correction reaches the role through a statement the item
    # was written off. A contest is a verdict keyed to the message the
    # principal answered, and its reason is the entry recorded against that
    # message; the item points at no statement carrying it. Measured on the
    # tips run (2026-09-03): woken cold on this shape the role quoted the item
    # id as an entry, read nothing, and reported it could not tell what they
    # objected to. Handed the reason, it reached for `decisions.author` to
    # change the item and errored twice. They said what they meant instead;
    # amending is the answer.
    entries:
      - {id: e_<m1>, author: principal, ts_order: 2,
         text: "no service quality. just bill + tip %"}
    messages:
      - {id: <m1>, thread_id: <th>, from_role: principal, to_role: liaison,
         verb: verdict, body_refs: '["<i1>"]', seq: 1}
    config:
      - {key: "verdict:<m1>", value: '{"<i1>": "contest"}'}
    items:
      - {id: <i1>, kind: in_scope, provenance: decided, approval: contested,
         approval_ver: 1, version: 1,
         text: "Calculate tips based on bill amount and service quality"}
  expect:
    writes:
      items: {count: "1..1"}
  forbidden:
    writes: [tickets, criteria, glossary_terms]
    calls: [decisions.author]

- id: L1-VK-submit-drafts-together
  tier: T1
  role: vision_keeper
  runs: 5
  pass: 4
  tick: signoff
  refs: [<i1>, <i2>]
  fixture:
    items:
      - {id: <i1>, text: "users can close their account", kind: in_scope,
         provenance: decided, approval: draft, version: 1}
      - {id: <i2>, text: "bulk export is not part of this", kind: out_of_scope,
         provenance: decided, approval: draft, version: 1}
  expect:
    messages:
      # One submit carrying both. An interpretation is read whole: the in-scope
      # item means something different with the out-of-scope one beside it.
      - {to: liaison, verb: submit, count: 1, refs_include: [<i1>, <i2>]}
  forbidden:
    writes: [items, tickets, criteria]

- id: L1-VK-answer-a-refactor-proposal
  tier: T1
  role: vision_keeper
  runs: 5
  pass: 4
  inbound: {from: architect, to: vision_keeper, verb: propose, body_refs: [<i1>]}
  fixture:
    items:
      - {id: <i1>, text: "invoices can be exported as CSV", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    decisions:
      # Refused eighteen months ago, for a reason that has not expired.
      - {id: <d1>, author: vision_keeper,
         text: "the store layer stays synchronous: the export path is the only
                caller that would benefit and it is not hot"}
  expect:
    # Assert it as an item or refuse it with a reason. Both are answers.
    any_of:
      - writes: {items: {count: ">=1"}}
      - writes: {decisions: {count: ">=1"}}
  forbidden:
    # Architect is blocked on this and will not ask twice. Silence is the one
    # answer that is not an answer, and the case that catches it is the empty
    # session — no write, no message.
    writes: [tickets, criteria]
    recipients: [developer, critic, tester]

- id: L1-VK-reopen-after-an-election
  tier: T1
  role: vision_keeper
  runs: 5
  pass: 4
  inbound: {from: developer, to: vision_keeper, verb: elect, body_refs: [<b1>]}
  fixture:
    items:
      - {id: <i1>, text: "accounts are never deleted, only closed", kind: in_scope,
         provenance: decided, approval: draft, approval_ver: 1, version: 2}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "close the account row"}
    batches:
      - {id: <b1>, item_id: <i1>, status: running}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
  expect:
    messages:
      - {to: developer, verb: reopen, count: 1}
  forbidden:
    # There is no judgement here. Whether the worktree survives is a fact about
    # how much of the Developer's understanding survives, and they already said.
    writes: [items, tickets, criteria]

- id: L1-VK-decide-a-challenge-to-an-approved-item
  tier: T1
  role: vision_keeper
  runs: 5
  pass: 4
  inbound: {from: terminologist, to: vision_keeper, verb: challenge, body_refs: [<i1>]}
  fixture:
    items:
      # "Account" has two senses in this codebase and the item does not say
      # which, so it cannot be built as written.
      - {id: <i1>, text: "deleting an account removes the account", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    glossary_terms:
      - {id: <g1>, term: account, sense_short: "the login identity",
         provenance: decided}
      - {id: <g2>, term: account, sense_short: "the billing entity that owes money",
         provenance: decided}
  expect:
    # Either amend the item or author a decision saying why it stands. What is
    # forbidden is amending it and leaving the approval where it was.
    any_of:
      - writes: {items: {count: ">=1"}}
      - writes: {decisions: {count: ">=1"}}
  forbidden:
    writes: [glossary_terms, tickets, criteria]

- id: L1-VK-an-outside-fact-is-the-researchers
  tier: T1
  role: vision_keeper
  runs: 5
  pass: 4
  # The state before `L1-VK-a-source-does-not-settle-scope` (l1_researcher.yaml),
  # whose fixture already carries this desk's question answered. A ratified
  # statement whose scope turns on what an outside standard requires of it:
  # "sign in with an existing account" is an obligation to whatever that
  # account's provider mandates, and nobody here has read it. Asserting the
  # scope as if the words were the whole of it is the failure; the desk that
  # reads the standard is the Researcher.
  inbound: {from: liaison, to: vision_keeper, verb: deliver, body_refs: [<s1>]}
  fixture:
    entries:
      - {id: <e1>, author: principal, ts_order: 1,
         text: "let people sign in with their existing account"}
    statements:
      - {id: <s1>, span_entry: <e1>, span_start: 0, span_end: 45,
         text: "people can sign in with an existing account", status: ratified}
  expect:
    any_of:
      - messages: [{to: researcher, verb: question, count: 1}]
      - messages: [{to: liaison, verb: report, count: 1, refs_include: [<s1>]}]
  forbidden:
    # Asserting the words as scope is this mode's job and is not forbidden;
    # what is measured is that the outside obligation is put to the desk that
    # reads standards rather than settled here. Measured 2026-09-03: the
    # recording model questioned the Researcher five of five, and asserted the
    # item beside it, as the brief says.
    writes: [decisions, glossary_terms, constraints]
    recipients: [architect, terminologist, developer]
