# L1 — the survey modes. Onboarding, one area at a time.
#
# Each of these runs against a real checkout that has been indexed and
# partitioned, because a survey of an area that does not exist is a session
# correctly doing nothing. The failure they all share a shape with: writing
# `decided` where the truth is `observed`. Onboarding's whole claim is that it
# can tell "the code does this" from "we meant it to", and a role that quietly
# promotes the first to the second has thrown away the distinction the rest of
# the system is built on.
#
# `src/billing` is the area on purpose: it holds one half of the planted term
# collision, and `account` there means the entity that owes money.

- id: L1-TE-survey-an-area-for-its-terms
  tier: T1
  role: terminologist
  runs: 5
  pass: 4
  tick: survey
  # Areas come from onboarding a real checkout, not from the fixture tables,
  # so the lint's DB-only seeding cannot produce the state this fires on.
  tick_unseedable: areas are created by repo onboarding, not by fixture rows
  refs: [src/billing]
  repo:
    onboard: true
  expect:
    # The area's source is pushed (`code.area`); what the session calls is the
    # file it wants whole. The per-area pass runs after the define phase and
    # usually finds the words already defined, so zero terms is a pass too.
    calls: [code.source]
    writes:
      glossary_terms: {count: "0..4"}
      survey_records: {count: 1}
  forbidden:
    # Terms first, and only terms. Constraints are Architect's pass over the
    # same area and behaviours are Vision Keeper's; a Terminologist that writes
    # either has done the next two roles' jobs from the first role's brief.
    writes: [constraints, items, criteria]
    recipients: [architect, vision_keeper, liaison]

- id: L1-AR-survey-an-area-for-its-commitments
  tier: T1
  role: architect
  runs: 5
  pass: 3
  tick: survey
  # Areas come from onboarding a real checkout, not from the fixture tables,
  # so the lint's DB-only seeding cannot produce the state this fires on.
  tick_unseedable: areas are created by repo onboarding, not by fixture rows
  refs: [src/billing]
  repo:
    onboard: true
  fixture:
    glossary_terms:
      - {id: <g1>, term: account, provenance: observed,
         sense_short: "the billing entity that owes money"}
      - {id: <g2>, term: invoice, provenance: observed,
         sense_short: "a charge issued against a billing account"}
  expect:
    # `code.source` was expected when `code.area` pushed a grain list; the
    # push now carries the area's own files whole, so reading needs no call.
    # The model row is the survey's account, kept.
    writes:
      model_areas: {count: 1}
      survey_records: {count: 1}
  forbidden:
    # `none_found` is a legitimate outcome here and often the right one, so the
    # assertion is on the attestation rather than on finding something. What is
    # forbidden is closing the area without reading it, and writing the terms
    # Terminologist already wrote.
    writes: [glossary_terms, items, criteria]

- id: L1-AR-a-boundary-file-read-outside-in
  tier: T1
  role: architect
  runs: 5
  pass: 3
  tick: boundary
  # Boundary subjects are enumerated from a real index, like areas.
  tick_unseedable: boundary subjects are enumerated from repo onboarding
  refs: ["@surface:pyproject.toml"]
  repo:
    onboard: true
  expect:
    # The view arrives pushed; the session's job is the attestation, and
    # `none_found` is legitimate -- a sample project's pyproject may commit
    # nothing. What is forbidden is answering at symbol grain or writing
    # another role's artefact.
    writes:
      survey_records: {count: 1}
  forbidden:
    writes: [glossary_terms, items, criteria, model_areas]

- id: L1-VK-survey-an-area-for-what-it-does
  tier: T1
  role: vision_keeper
  runs: 5
  pass: 4
  tick: survey
  # Areas come from onboarding a real checkout, not from the fixture tables,
  # so the lint's DB-only seeding cannot produce the state this fires on.
  tick_unseedable: areas are created by repo onboarding, not by fixture rows
  refs: [src/billing]
  repo:
    onboard: true
  fixture:
    glossary_terms:
      - {id: <g1>, term: account, provenance: observed,
         sense_short: "the billing entity that owes money"}
    constraints:
      - {id: <k1>, headline: "invoices outlive the account they belong to",
         text: "closing an account leaves its invoices readable",
         provenance: observed}
  expect:
    calls: [code.survey, code.source]
    writes:
      items: {count: ">=1"}
      survey_records: {count: 1}
  forbidden:
    # Every item written here is observed and unapproved: "the system does
    # this", never "we meant it to". Approving one would be the system granting
    # itself the principal's ruling over a codebase they have not seen yet.
    writes: [glossary_terms, constraints, criteria, tickets]
    calls: [problem.set_approval]

# The two modes that came before the per-area pass. Orientation is one
# session over the whole program; define is one session per word, from the
# project's own lexicon, with the concordance and the orientation pushed.
#
# Both `tick_unseedable`: the program and its lexicon come from onboarding a
# checkout, which fixture rows cannot produce.

- id: L1-AR-judge-the-frame
  tier: T1
  role: architect
  runs: 5
  pass: 3
  tick: frame
  # The frame wake exists the moment an index does; the tree it judges
  # comes from onboarding a real checkout.
  tick_unseedable: the tree comes from repo onboarding
  refs: ["@frame"]
  repo:
    onboard: true
  expect:
    # The judgement is the attest; assignments are welcome but a
    # conventionally-shaped sample repo may honestly attest none_found
    # with every prior standing.
    writes:
      survey_records: {count: 1}
  forbidden:
    writes: [glossary_terms, items, constraints, model_areas]

- id: L1-VK-orient-the-program
  tier: T1
  role: vision_keeper
  runs: 5
  pass: 3
  tick: orient
  tick_unseedable: the program and its front come from repo onboarding, not fixture rows
  refs: ["@program"]
  repo:
    onboard: true
  expect:
    writes:
      # The brief asks for four to eight; the first real session wrote five.
      items: {count: "2..8"}
      survey_records: {count: 1}
  forbidden:
    # The account of what the product does, observed. Not its words, not its
    # commitments, and never approved -- approving an observation is the
    # system granting itself the principal's ruling.
    writes: [glossary_terms, constraints, criteria, tickets]
    calls: [problem.set_approval]

- id: L1-TE-define-a-word
  tier: T1
  role: terminologist
  runs: 5
  pass: 3
  tick: define
  tick_unseedable: the lexicon the wake is drawn from comes from repo onboarding, not fixture rows
  refs: ["@term:invoice"]
  repo:
    onboard: true
  fixture:
    survey_records:
      - {id: "vision_keeper:@program", area: "@program", outcome: found}
    items:
      - {id: <i1>, kind: in_scope, provenance: observed, approval: draft,
         text: "The product issues invoices to billing accounts and records
                what each account owes; a login account is a different thing."}
  expect:
    writes:
      glossary_terms: {count: 1}
  forbidden:
    # One word, this word. Constraints and items are other roles' artefacts,
    # and a second glossary row would be a word nobody asked for.
    writes: [constraints, items, criteria]

- id: L1-VK-reconcile-the-readme
  tier: T1
  role: vision_keeper
  runs: 5
  pass: 3
  tick: reconcile
  tick_unseedable: the README and the account come from repo onboarding, not fixture rows
  refs: ["@prose"]
  repo:
    onboard: true
  expect:
    writes:
      # The sample repo's README makes claims an empty account cannot support;
      # each becomes one ledger entry, and the attestation closes @prose.
      ledger: {count: "1..6"}
      survey_records: {count: 1}
  forbidden:
    # Reconciling is not merging: the README adds no items, no words, no
    # constraints -- a disagreement is the principal's to rule on.
    writes: [items, glossary_terms, constraints, criteria, tickets]
