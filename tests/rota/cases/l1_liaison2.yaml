- id: L1-LI-words-about-another-function-get-their-own-statement
  tier: T1
  role: liaison
  runs: 5
  pass: 4
  # Night 138's s270: the principal asked about confirm() while the request
  # before was the echo_json helper. The seat confirmed that statement and
  # segmented nothing, so the shift question never fired. The wake's
  # current_request now says what it is, and the confirm door refuses a
  # confirm that skips the words that woke the seat (frame 193's design,
  # 2.G.1 and 2.G.2).
  fixture:
    entries:
      - {id: e_<m1>, author: principal, ts_order: 1,
         text: "Add an echo_json(obj) helper next to echo that prints an object as compact JSON on one line, followed by a newline."}
      - {id: e_<m_in>, author: principal, ts_order: 2,
         text: "Let confirm() take a default_on_eof flag: when stdin is closed it returns the default instead of aborting."}
    statements:
      - {id: <s1>, span_entry: e_<m1>, span_start: 0, span_end: 115,
         text: "Add an echo_json(obj) helper next to echo that prints an object as compact JSON on one line, followed by a newline.",
         status: ratified}
    messages:
      - {id: <m1>, thread_id: t1, from_role: principal, to_role: liaison,
         verb: converse, body_refs: '["e_<m1>"]', seq: 1, status: answered}
      - {id: <m2>, thread_id: t1, cause_id: <m1>, from_role: liaison,
         to_role: principal, verb: confirm, body_refs: '["<s1>"]', seq: 2,
         status: answered}
      - {id: <m3>, thread_id: t1, cause_id: <m2>, from_role: principal,
         to_role: liaison, verb: converse, body_refs: '["<s1>"]', body_text: ok,
         seq: 3, status: answered}
    rulings:
      - {id: <r1>, ask_id: <m2>, reply_id: <m3>, per_item: '{"<s1>": "approve"}',
         words: ok, status: landed}
  inbound: {id: <m_in>, from: principal, to: liaison, verb: converse,
            body_refs: [e_<m_in>]}
  expect:
    writes:
      # The new words are a new request, so the statement supersedes nothing.
      statements: {count: 1, text_includes: [e_<m_in>, default_on_eof],
                   text_excludes: [<s1>]}
    messages:
      - {to: principal, verb: confirm, count: 1}
  forbidden:
    writes: [items, glossary_terms]
    recipients: [vision_keeper, terminologist, architect]
    messages:
      - {to: principal, verb: clarify}

