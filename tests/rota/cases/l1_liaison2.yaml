- id: L1-LI-a-contested-statement-is-not-delivered
  tier: T1
  role: liaison
  runs: 5
  pass: 4
  # Night 138's s273: the principal contested the echo_json statement on its
  # confirm page and said the new words are a separate change. The verdict
  # seat ratified that statement again and delivered it to three desks. A
  # contested statement is not ratified and not delivered, and the ratify door
  # refuses it (frame 193's design, 2.G.3).
  prompt: verdict
  inbound: {id: <m_rule>, from: principal, to: liaison, verb: verdict,
            body_refs: [<s1>], cause: <m5>}
  fixture:
    keypress_verdicts:
      - {id: "<m_rule>", per_item: '{"<s1>": "contest"}'}
    entries:
      - {id: e_<m1>, author: principal, ts_order: 1,
         text: "Add an echo_json(obj) helper next to echo that prints an object as compact JSON on one line, followed by a newline."}
      - {id: e_<m4>, author: principal, ts_order: 2,
         text: "Let confirm() take a default_on_eof flag: when stdin is closed it returns the default instead of aborting."}
      - {id: e_<m_rule>, author: principal, ts_order: 3,
         text: "They are two separate changes, and I am on the confirm change now. Please restate the request as letting confirm take a default_on_eof flag that returns the default when stdin is closed instead of aborting."}
    statements:
      - {id: <s1>, span_entry: e_<m1>, span_start: 0, span_end: 115,
         text: "Add an echo_json(obj) helper next to echo that prints an object as compact JSON on one line, followed by a newline.",
         status: ratified}
    messages:
      - {id: <m1>, thread_id: t1, from_role: principal, to_role: liaison,
         verb: converse, body_refs: '["e_<m1>"]', seq: 1, status: answered}
      - {id: <m4>, thread_id: t1, from_role: principal, to_role: liaison,
         verb: converse, body_refs: '["e_<m4>"]', seq: 4, status: answered}
      - {id: <m5>, thread_id: t1, cause_id: <m4>, from_role: liaison,
         to_role: principal, verb: confirm, body_refs: '["<s1>"]', seq: 5,
         status: answered}
      - {id: <m6>, thread_id: t1, cause_id: <m5>, from_role: principal,
         to_role: liaison, verb: converse, body_refs: '["<s1>"]', seq: 6,
         status: answered,
         body_text: "They are two separate changes, and I am on the confirm change now. Please restate the request as letting confirm take a default_on_eof flag that returns the default when stdin is closed instead of aborting."}
    rulings:
      - {id: <r2>, ask_id: <m5>, reply_id: <m6>, per_item: '{"<s1>": "contest"}',
         words: "They are two separate changes", status: landed}
  # The case measures effects, not calls: no statement ratified again and no
  # delivery landed. A refused call is the door at work (frame 193's design,
  # 2.G.6).
  forbidden:
    writes: [statements, items]
    recipients: [vision_keeper, terminologist, architect, principal]
