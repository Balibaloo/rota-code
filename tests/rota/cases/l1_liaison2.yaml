# L1 — Liaison, the modes the first file left uncovered.
#
# Liaison is the only role that touches the principal, which makes it the only
# role whose failures cost the one budget that cannot be topped up: the
# principal's attention. Most of these modes are one message, and the failure to
# watch for is the session that decides something on the way past.

- id: L1-LI-put-a-contradiction-back-unresolved
  tier: T1
  role: liaison
  runs: 5
  pass: 4
  tick: contradiction
  refs: [<s1>, <s2>]
  fixture:
    entries:
      - {id: <e1>, author: principal, ts_order: 1,
         text: "deleting an account should remove everything we hold about them"}
      - {id: <e2>, author: principal, ts_order: 2,
         text: "we have to keep invoices for seven years"}
    statements:
      # `contradicted`, not `ratified`. The predicate reads the status and
      # nothing else, so with two ratified statements it never fired and this
      # case was grading Liaison on a wake it could not have been given -- the
      # exact defect the reachability lint exists for, hidden behind its skip.
      - {id: <s1>, span_entry: <e1>, span_start: 0, span_end: 62,
         text: "deleting an account removes everything we hold about them",
         status: contradicted}
      - {id: <s2>, span_entry: <e2>, span_start: 0, span_end: 38,
         text: "invoices are kept for seven years", status: contradicted}
  expect:
    messages:
      - {to: principal, verb: clarify, count: 1, refs_include: [<s1>, <s2>]}
  forbidden:
    # Only the principal can say which stands. Ranking them by recency is the
    # tempting wrong answer and it looks like helpfulness.
    writes: [statements, items, decisions]
    recipients: [vision_keeper, terminologist, architect]

- id: L1-LI-ask-for-the-confirmation-nobody-asked-for
  tier: T1
  role: liaison
  runs: 5
  pass: 4
  tick: awaiting_confirm
  refs: [<s1>]
  fixture:
    entries:
      - {id: <e1>, author: principal, ts_order: 1,
         text: "add a button so people can close their account"}
    statements:
      - {id: <s1>, span_entry: <e1>, span_start: 0, span_end: 45,
         text: "people can close their account from a button", status: proposed}
  expect:
    messages:
      - {to: principal, verb: confirm, count: 1, refs_include: [<s1>]}
  forbidden:
    # It stalled because nothing put it in front of them. Re-reading the
    # segmentation for quality while here is work that was already done and is
    # not what unblocks it.
    writes: [statements, items]

- id: L1-LI-relay-a-ruling-without-interpreting-it
  tier: T1
  role: liaison
  runs: 5
  pass: 4
  prompt: verdict_signoff
  inbound: {id: <m_rule>, from: principal, to: liaison, verb: verdict,
            body_refs: [<i1>, <i2>], cause: <m_present>}
  fixture:
    config:
      - {key: "verdict:<m_rule>", value: '{"<i1>": "approve", "<i2>": "contest"}'}
    items:
      - {id: <i1>, text: "people can close their account", kind: in_scope,
         provenance: decided, approval: draft, version: 1}
      - {id: <i2>, text: "bulk export is not part of this", kind: out_of_scope,
         provenance: decided, approval: draft, version: 1}
    messages:
      - {id: <m_present>, thread_id: t1, from_role: liaison, to_role: principal,
         verb: present, body_refs: '["<i1>","<i2>"]', seq: 1}
  expect:
    messages:
      - {to: vision_keeper, verb: relay, count: 1, refs_include: [<i1>, <i2>]}
  forbidden:
    # Approval state is Vision Keeper's artefact and the ruling travels as refs.
    # A Liaison that applies it here is writing another role's artefact; one
    # that relays only the approval has decided what a contest ought to mean.
    writes: [items, decisions, statements]
    recipients: [terminologist, architect, developer]

- id: L1-LI-two-questions-at-most-from-three-reports
  tier: T1
  role: liaison
  runs: 5
  pass: 3
  # This case used to say `tick: report`, which is not a predicate at all —
  # `report` is a message verb. The harness built the wake with no message id,
  # so the prompt showed Liaison *neither* report: the whole working set was one
  # ratified statement. It was being graded on deduping reports it could not see.
  #
  # Underneath that was a live scheduler bug the case was quietly resting on.
  # `tick_round_close` says dedupe "is impossible if Liaison wakes per report",
  # and open tips are band `traffic` (0) while round_close is band `gate` (20) —
  # so the first report always won, Liaison clarified from the one report in
  # front of it, and the `harvested` check then suppressed the round for good.
  # The round existed in the design, the docstring and the prompt, and never ran.
  # `open_tips` now leaves in-round reports to the harvest.
  tick: round_close
  refs: [t1]
  fixture:
    entries:
      - {id: <e1>, author: principal, ts_order: 1,
         text: "let people delete their account"}
    statements:
      - {id: <s1>, span_entry: <e1>, span_start: 0, span_end: 30,
         text: "people can delete their account", status: ratified}
    glossary_terms:
      # Two senses, one word. Deleting the row and revoking the login are
      # different promises and the transcript does not say which was meant.
      - {id: <g1>, term: "delete", sense_short: "erase the account record",
         provenance: observed, source_refs: '["<s1>"]'}
      - {id: <g2>, term: "delete", sense_short: "revoke access, keep the record",
         provenance: observed, source_refs: '["<s1>"]'}
    items:
      # Recorded but never approved: Vision Keeper could not tell which promise it
      # is being asked to admit, which is the same collision in its own words.
      - {id: <i1>, text: "people can delete their account", kind: in_scope,
         provenance: decided, version: 1}
    messages:
      - {id: <m0>, thread_id: t1, from_role: liaison, to_role: vision_keeper,
         verb: deliver, body_refs: '["<s1>"]', seq: 1, status: answered}
      # Three reports, two questions at most. The first two are one question in
      # two vocabularies — Terminologist calls it a term collision, Vision Keeper
      # calls it a scope ambiguity, and both point back at the same statement.
      # Architect's is a genuinely separate one.
      - {id: <m1>, thread_id: t1, from_role: terminologist, to_role: liaison,
         verb: report, body_refs: '["<g1>","<g2>","<s1>"]', seq: 2}
      - {id: <m2>, thread_id: t1, from_role: vision_keeper, to_role: liaison,
         verb: report, body_refs: '["<i1>","<s1>"]', seq: 3}
      - {id: <m3>, thread_id: t1, from_role: architect, to_role: liaison,
         verb: report, body_refs: '["<s1>"]', seq: 4}
  expect:
    messages:
      # At most two questions means exactly one message carrying them, and it
      # points at whatever the problem being raised actually is.
      #
      # This required <s1>, the statement, on the reasoning that the principal
      # can only recognise their own words. Liaison sent the two senses instead
      # and was failed 5/5 for it -- and it was right. The problem being raised
      # *is* the collision: "delete" means erase the record, or revoke access
      # and keep it, and which did you mean. The statement is where the word
      # appears, not what is in question about it.
      #
      # A guard enforcing the old reading got as far as being written before
      # `LI-relay-an-answer-without-improving-it` refuted it -- that case
      # expects a clarify carrying two glossary senses and nothing else, and had
      # passed 335 of 340 runs. Two cases in one file, contradicting each other,
      # and the role was failing the one that was wrong.
      #
      # So the refs are the collision. Nothing is mandatory beyond naming the
      # thing being asked about; `render_refs` is what makes any of it legible
      # to a person, and it resolves a glossary term to "delete: erase the
      # account record" without needing the sentence it came from.
      - {to: principal, verb: clarify, count: 1, refs_include: [<g1>, <g2>]}
  forbidden:
    # Deduping is the work the round exists for; forwarding each report as its
    # own question spends the principal's attention on the system's bookkeeping.
    # Choosing a sense is the principal's call — writing one here is the system
    # answering its own question and calling it progress.
    writes: [statements, items, decisions, glossary_terms]
    recipients: [vision_keeper, terminologist, architect]

- id: L1-LI-surface-a-quarantined-message
  tier: T1
  role: liaison
  runs: 5
  pass: 4
  tick: quarantined
  # The payload, not the envelope — and this case used to say `[<m_dead>]`,
  # which is a wake production never emits. `msg.present_principal` refuses
  # message ids by design, and it is the mode's only tool, so five runs went on
  # arguing with the guard and then reaching for a tool the role does not have.
  # The case was unpassable and read as a role failing to do its job.
  refs: [<i1>]
  fixture:
    items:
      - {id: <i1>, text: "search results are ranked by relevance", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "rank the search results"}
    messages:
      - {id: <m_dead>, thread_id: t1, from_role: liaison, to_role: terminologist,
         verb: deliver, body_refs: '["<i1>"]', seq: 1, attempts: 6,
         status: quarantined}
  expect:
    # Naming the stalled work, which is what the brief asks for and what the
    # principal has a name for. A `present` that names nothing tells them
    # something has gone wrong and not what.
    messages:
      - {to: principal, verb: present, count: 1, refs_include: [<i1>]}
  forbidden:
    # The one thing that must not happen is this staying invisible. Retrying it
    # is not available and re-sending the work to another role would hide the
    # gap rather than report it.
    writes: [items, tickets, statements]
    recipients: [terminologist, vision_keeper, architect]

- id: L1-LI-present-what-onboarding-only-observed
  tier: T1
  role: liaison
  runs: 5
  pass: 4
  tick: observed_entries
  fixture:
    glossary_terms:
      - {id: <g1>, term: account, sense_short: "the login identity",
         provenance: observed}
      - {id: <g2>, term: account, sense_short: "the billing entity that owes money",
         provenance: observed}
    constraints:
      - {id: <k1>, headline: "the store layer is synchronous",
         text: "every call into src/store blocks", provenance: observed}
  expect:
    messages:
      - {to: principal, verb: present, count: 1}
  forbidden:
    # Observed means found, not decided: true about the code and carrying no
    # authority about what the project is for. Promoting one to `decided` here
    # would be the system granting itself the principal's ruling.
    writes: [glossary_terms, constraints, items, decisions]

# `L1-LI-the-reports-came-back-clean` stood here, and it is gone twice over.
#
# It began as round_close with no reports at all, which `tick_round_close`
# cannot produce, and moved to test_predicates. It was rewritten as a round
# whose reports had all settled -- the harder and realer case -- and failed
# 5/5 through five prose attempts, because it asked Liaison to decide that a
# role had finished. Liaison does not make decisions; its responsibility is
# lossless communication. The crossing-off is a lookup and now happens in
# `report_is_settled`, so the wake does not occur at all and this case tests a
# situation the system can no longer be in. Its guarantee is in
# `test_a_round_whose_reports_all_settled_never_wakes_liaison`.
#
# Both removals are the same mistake found twice: grading a role on a
# situation the frontier cannot hand it.

- id: L1-LI-a-question-about-the-program-goes-to-its-owners
  tier: T1
  role: liaison
  runs: 5
  pass: 3
  # The first hop of the read-only route, which had no case at all.
  #
  # The route is drawn three times in the graph, has a brief and a `.tools` file
  # at each end, and has never fired. Driven through the real loop against the
  # click run with the model onboarding uses, Liaison answered a maintainer's
  # question by asking the principal to clarify it.
  #
  # Two faults, both found by measurement. The brief's taxonomy was binary --
  # "decide whether the current message is chat or work", "default to chat",
  # "when in doubt, chat" -- and a question about the onboarded program is
  # neither, so it fell through to the tiebreaker, which is also what
  # `L1-LI-segment` was falling through to. And the only worked example of the
  # route in the system called `msg.ask_terminologist(refs=[], question='...')`,
  # which is refused: there is no `question` parameter, and an ask with empty
  # refs wakes an owner with an empty inbox.
  #
  # `refs_include` is the sharp half. The entry id is the whole of how the
  # principal's words reach the owner -- the resolver expands it into
  # `principal_said` -- so an ask that carries no refs is a role woken to answer
  # nothing, and it scores as an ask unless the refs are checked.
  fixture:
    entries:
      - {id: e_<m_in>, author: principal, ts_order: 1,
         text: "what does a provider do in this codebase?"}
  inbound: {id: <m_in>, from: principal, to: liaison, verb: converse,
            body_refs: []}
  expect:
    # Which owner holds the answer is not Liaison's to know -- that is the whole
    # reason the question is routed rather than answered. Asking the wrong one
    # costs a read-only session and nothing else; asking nobody is the failure.
    any_of:
      - messages:
          - {to: terminologist, verb: ask, count: 1, refs_include: [e_<m_in>]}
      - messages:
          - {to: architect, verb: ask, count: 1, refs_include: [e_<m_in>]}
      - messages:
          - {to: vision_keeper, verb: ask, count: 1, refs_include: [e_<m_in>]}
  forbidden:
    # A question is not a commitment. Segmenting one puts a statement in front of
    # the principal to ratify, and answering it from Liaison's own head is the
    # role deciding something it does not own.
    writes: [statements, items, glossary_terms, decisions]
    # Not the recipient: `clarify` to the principal is the honest answer when
    # the question really is unintelligible, and forbidding the recipient would
    # forbid that too. `converse` is the tiebreaker firing.
    messages:
      - {to: principal, verb: converse}
