# L1 — Terminologist. One meaning per word, and the discipline of finding a
# collision by looking rather than by being told.

- id: L1-TE-amend-glossary
  tier: T1
  role: terminologist
  runs: 5
  pass: 4
  fixture:
    entries:
      - {id: <e1>, author: principal, text: "let users delete their account", ts_order: 1}
    statements:
      - {id: <s1>, span_entry: <e1>, span_start: 0, span_end: 30,
         text: "let users delete their account", status: ratified}
  inbound: {from: liaison, to: terminologist, verb: deliver, body_refs: [<s1>]}
  expect:
    writes:
      # Measured, not probed: read back from the runs already recorded
      # against this prompt that passed. The ceiling is the highest of them.
      glossary_terms: {count: "1..2"}
  forbidden:
    # Terms, not scope. What the software should do is Gatekeeper's.
    writes: [items, tickets, statements]

- id: L1-TE-specify-criteria
  tier: T1
  role: terminologist
  runs: 5
  pass: 4
  tick: criteria
  refs: [<tk1>]
  fixture:
    items:
      - {id: <i1>, text: "users can delete their account", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "add a delete button to the account page"}
    glossary_terms:
      - {id: <g1>, term: account, sense_short: "the login identity",
         provenance: decided}
  expect:
    writes:
      # Measured, not probed: read back from the runs already recorded
      # against this prompt that passed. The ceiling is the highest of them.
      criteria: {count: "1..7"}
  forbidden:
    # Criteria are written *in* glossary terms; writing the term at the same
    # time would be defining the word to suit the criterion.
    writes: [tickets, items]

- id: L1-TE-answer-a-term-question
  tier: T1
  role: terminologist
  runs: 5
  pass: 4
  fixture:
    glossary_terms:
      - {id: <g1>, term: account, sense_short: "the login identity",
         provenance: decided}
      - {id: <g2>, term: account, sense_short: "the billing entity that owes money",
         provenance: decided}
  # The refs said `<g1>` and nothing else, because `question` to a role inside
  # the project could not carry a question. Terminologist was woken with the
  # term "account", its sense "the login identity", and no indication of what
  # was being asked about it -- so it invented a question, answered that, and
  # the Developer received an answer to something it never asked. The case
  # passed, which says more about the assertion than the session: one message
  # to developer is satisfied by an answer to anything at all.
  inbound: {from: developer, to: terminologist, verb: question, body_refs: [<g1>],
            body_text: "I am adding a balance column. Is the `account` a
              transaction row hangs off the login identity or the billing
              entity that owes the money?"}
  expect:
    messages:
      - {to: developer, verb: answer, count: 1}
  forbidden:
    # Two senses is the answer. Resolving the collision by deleting one would be
    # a decision, and a decision needs a reason on file and somebody asking for
    # it — neither of which is in this session.
    writes: [glossary_terms]

- id: L1-TE-challenge-an-unusable-item
  tier: T1
  role: terminologist
  runs: 5
  pass: 4
  fixture:
    items:
      - {id: <i1>, text: "make the thing work properly", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "make the thing work properly"}
  inbound: {from: liaison, to: terminologist, verb: ask, body_refs: [<i1>]}
  mode: readonly
  expect:
    messages:
      - {to: liaison, verb: answer, count: 1}
  forbidden:
    # Readonly. The sandbox builds no write functions at all in this mode, so
    # this is belt and braces on a guarantee that already holds structurally.
    writes: [glossary_terms, criteria]
    versions: [glossary_terms]

- id: L1-TE-the-words-are-already-defined
  tier: T1
  role: terminologist
  runs: 5
  pass: 4
  # The brief's first bullet is "if your glossary already defines it **the same
  # way**, do nothing", and doing nothing is the one instruction in this system
  # with no act behind it. Every other outcome is something produced; this one
  # is an absence, and a session with eleven turns left does not produce an
  # absence.
  #
  # Written before the mechanism, on purpose. `settled` would otherwise be built
  # with nothing measuring it -- two green checks over an empty table, which is
  # the failure this repository already refuses elsewhere.
  fixture:
    entries:
      - {id: <e1>, author: principal, ts_order: 1,
         text: "an invoice is issued when a subscription renews"}
    statements:
      - {id: <s1>, span_entry: <e1>, span_start: 0, span_end: 47,
         text: "an invoice is issued when a subscription renews", status: ratified}
    glossary_terms:
      # Every word that carries meaning here is already on file, once, in the
      # sense the statement uses. There is no collision to find and nothing
      # undefined to define.
      - {id: <g1>, term: invoice,
         sense_short: "the billing document raised against a subscription",
         provenance: decided}
      - {id: <g2>, term: issued,
         sense_short: "created and sent to the customer",
         provenance: decided}
      - {id: <g3>, term: subscription,
         sense_short: "a recurring agreement that renews on a fixed period",
         provenance: decided}
      - {id: <g4>, term: renews,
         sense_short: "the period rolls over and the agreement continues",
         provenance: decided}
  inbound: {from: liaison, to: terminologist, verb: deliver, body_refs: [<s1>]}
  expect:
    # Ruled: a role woken by a message may reply that it has nothing to do. The
    # absence already had a positive form and no brief used it -- a report whose
    # refs are all ratified is settled, and `report_is_settled` strikes it out
    # before Liaison's round_close ever sees it. So this costs the principal
    # nothing, and the round learns the difference between done and silent,
    # which are identical from outside.
    #
    # This case previously expected `messages: []` and forbade Liaison. That was
    # written on the assumption that any reply spends attention, before the
    # settled-report machinery existed to make it free.
    messages:
      - {to: liaison, verb: report, count: 1, refs_include: [<s1>]}
  forbidden:
    # A second sense for a word that has one is the failure this measures: it
    # reads as diligence, it survives review because both senses look
    # reasonable, and every criterion written afterwards has two things it
    # might mean.
    writes: [glossary_terms, decisions, items, statements]
    recipients: [researcher]

- id: L1-TE-put-a-word-with-two-senses-to-the-principal
  tier: T1
  role: terminologist
  runs: 5
  pass: 4
  tick: term_collision
  refs: [<g1>, <g2>]
  # The mode `term_collision` created, and the obligation it exists to raise.
  # Two statements that conflict have gone to the principal since
  # `contradiction` was written; two senses of one word are the same situation
  # in the glossary and used to sit there until a role tripped over them.
  fixture:
    entries:
      - {id: <e1>, author: principal, ts_order: 1,
         text: "archived orders should still be searchable"}
    statements:
      - {id: <s1>, span_entry: <e1>, span_start: 0, span_end: 42,
         text: "archived orders are searchable", status: ratified}
    glossary_terms:
      # Genuinely two promises. One keeps the row and hides it; the other moves
      # it somewhere cheaper and slower. Code written against the wrong one is
      # wrong in a way no test written from the same sense would catch.
      - {id: <g1>, term: archived, sense_short: "flagged inactive, row stays in place",
         provenance: decided}
      - {id: <g2>, term: archived, sense_short: "moved to cold storage",
         provenance: decided}
  expect:
    messages:
      - {to: liaison, verb: report, count: 1, refs_include: [<g1>, <g2>]}
  forbidden:
    # Collapsing the two is the failure: it is fast, it reads as tidying, and it
    # picks which promise the software keeps without anyone deciding to. The
    # mode offers no `glossary.amend` at all, so this is belt and braces on a
    # guarantee that already holds structurally -- and `decisions` would be the
    # same ruling written by the wrong role.
    writes: [glossary_terms, decisions, statements]
    recipients: [gatekeeper, architect, developer, tester, researcher]
