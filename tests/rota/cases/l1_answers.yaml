# L1 — the `answer` modes, and the two that were left over.
#
# An answer mode is the cheapest session in the system and the easiest to get
# wrong in a way nobody notices: the answer arrives, the role weighs it against
# its own reading, and quietly does something else. Asking a *second* role the
# same question is the other half — that is how one question becomes three
# answers and nobody can say which was used.

- id: L1-DV-apply-the-answer-and-carry-on
  tier: T1
  role: developer
  runs: 5
  pass: 4
  inbound: {from: terminologist, to: developer, verb: answer, body_refs: [<g1>]}
  repo:
    batch: <b1>
  fixture:
    items:
      - {id: <i1>, text: "show money amounts in the invoice email", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "format cent amounts for display"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "amounts are shown in the display currency, in
                src/notify/formatting.py",
         term_refs: '["<g1>"]'}
    glossary_terms:
      - {id: <g1>, term: "display currency", provenance: decided,
         sense_short: "always US dollars, with a leading $ and two decimals"}
    batches:
      - {id: <b1>, item_id: <i1>, status: running}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
  expect:
    calls: [code.write, code.commit]
  forbidden:
    # The answer is from the role that owns the artefact, so it is
    # authoritative. Taking it to Vision Keeper as well is how one question becomes
    # two answers that nobody reconciles.
    calls: [msg.question_vision_keeper, msg.question_terminologist]
    writes: [criteria, glossary_terms]

- id: L1-DV-take-out-what-nobody-asked-for
  tier: T1
  role: developer
  runs: 5
  pass: 3
  inbound: {from: critic, to: developer, verb: challenge, body_refs: [<c1>]}
  repo:
    batch: <b1>
    message: "truncate long subject lines"
    edit:
      src/notify/formatting.py: |
        ELLIPSIS = chr(8230)


        def truncate(text, limit=72):
            if len(text) <= limit:
                return text
            return text[: limit - 1] + ELLIPSIS


        def pluralise(count, singular, plural_form=None):
            """Renamed from `plural` while passing. Nobody asked for this."""
            if count == 1:
                return f"1 {singular}"
            return f"{count} {plural_form or singular + 's'}"
  fixture:
    items:
      - {id: <i1>, text: "long subject lines are truncated", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "truncate the subject"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "a truncated string ends in an ellipsis character",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
  expect:
    # Take it out, or log why the truncation could not have been done without
    # it. Both are honest; doing neither leaves an unexplained rename in a diff.
    any_of:
      - calls: [code.write, code.commit]
      - calls: [ledger.log]
  forbidden:
    # There is no route back to Critic and no version of this where arguing
    # helps: a judge that can be talked round is not one.
    writes: [criteria, items]

- id: L1-TS-apply-a-term-and-write-the-test
  tier: T1
  role: tester
  runs: 5
  pass: 4
  # Attributed 2026-09-13 on qwen3:8b, 0/5: read the answer, loaded
  # criteria, and said no criteria were mentioned; named the encode and did
  # not perform it. 8B on an answer wake.
  inbound: {from: terminologist, to: tester, verb: answer, body_refs: [<g1>]}
  fixture:
    items:
      - {id: <i1>, text: "closing an account keeps its invoices", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "close an account"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "closing an account leaves its invoices in place", term_refs: '["<g1>"]'}
    glossary_terms:
      - {id: <g1>, term: account, provenance: decided,
         sense_short: "the billing entity that owes money, not the login identity"}
    batches:
      - {id: <b1>, item_id: <i1>, status: pending}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
  expect:
    writes:
      # One criterion in the fixture, and one test per criterion is now
      # structural rather than asked for -- `tests.encode` reports a second
      # test for a criterion it has already encoded and stages nothing. So the
      # ceiling is derived, not probed: there are no runs behind this number
      # and none needed, which is the only bound in this file that can say so.
      tests: {count: "1..1"}
  forbidden:
    # The answer settles which "account" the criterion means. It does not make
    # the criterion Tester's to rewrite.
    writes: [criteria, glossary_terms, items]

- id: L1-TE-answer-an-inquiry-read-only
  tier: T1
  role: terminologist
  runs: 5
  pass: 4
  inbound: {from: liaison, to: terminologist, verb: ask, body_refs: [<g1>, <g2>]}
  fixture:
    glossary_terms:
      - {id: <g1>, term: account, sense_short: "the login identity",
         provenance: decided}
      - {id: <g2>, term: account, sense_short: "the billing entity that owes money",
         provenance: decided}
  expect:
    messages:
      - {to: liaison, verb: answer, count: 1}
  forbidden:
    # Two senses is what the glossary says, and saying so is the answer.
    # Collapsing them into one while here would settle a collision the principal
    # has never been asked about.
    writes: [glossary_terms, decisions, criteria]
    recipients: [vision_keeper, architect, developer, tester]

- id: L1-LI-put-the-open-assumptions-to-a-present-principal
  tier: T1
  role: liaison
  runs: 5
  pass: 4
  tick: agenda
  fixture:
    items:
      - {id: <i1>, text: "people can close their account", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "close the account row"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>, text: "the row is marked closed", term_refs: '[]'}
    ledger:
      - {id: <l1>, about_ref: <c1>, about_table: criteria, author: developer,
         default_taken: "a closed account can still be logged into; the criteria
                         did not say"}
      - {id: <l2>, about_ref: <c1>, about_table: criteria, author: tester,
         default_taken: "closing twice is a no-op rather than an error"}
  expect:
    messages:
      # A present, not a clarify (2026-09-09): the page renders each row as
      # an assumption to approve or contest, and the ruling lands at the
      # keypress. A clarify put a question, the answer relayed, the rows
      # stayed open, and the agenda asked again until quarantined (tipsJ).
      - {to: principal, verb: present, count: 1, refs_include: [<l1>, <l2>]}
  forbidden:
    # Presentation, not a gate. They may defer every one of these; what must not
    # happen is Liaison resolving one on their behalf to keep things moving.
    writes: [ledger, decisions, items, criteria]
    recipients: [vision_keeper, developer, tester, architect]

- id: L1-LI-relay-an-answer-without-improving-it
  tier: T1
  role: liaison
  runs: 5
  pass: 4
  inbound: {from: terminologist, to: liaison, verb: answer, body_refs: [<g1>, <g2>]}
  fixture:
    entries:
      - {id: <e1>, author: principal, ts_order: 1,
         text: "when you say account, which one do you mean?"}
    glossary_terms:
      - {id: <g1>, term: account, sense_short: "the login identity",
         provenance: decided}
      - {id: <g2>, term: account, sense_short: "the billing entity that owes money",
         provenance: decided}
  expect:
    # `converse`, not `clarify`. The relay went out on the channel that asks
    # the principal a question, whose words go in `question=`, and the model
    # wrote a question -- on a live run the principal asked where a recipe is
    # written and got back "what is the structure of the system?". The words
    # go in `reply=` now, which is what a relayed answer is.
    messages:
      - {to: principal, verb: converse, count: 1, refs_include: [<g1>, <g2>]}
  forbidden:
    # Read-only, so nothing is revoked and no checkpoint is disturbed. Inquiry
    # is free and that is a property to preserve, not an opportunity to tidy
    # something up while here — and the answer travels as the owner wrote it.
    writes: [glossary_terms, statements, items, decisions]
    recipients: [vision_keeper, terminologist, architect, developer]
    # The old channel, named so the regression cannot come back quietly: an
    # answer relayed as a question is the failure this case now pins.
    messages:
      - {to: principal, verb: clarify}

- id: L1-TE-answer-the-architects-question
  tier: T1
  role: terminologist
  runs: 5
  pass: 4
  # The exchange the tips run performed live (2026-09-03): the Architect,
  # modelling a ratified statement, met a word it could not place and put it
  # to the desk that owns words; the Terminologist answered from the glossary.
  # Two message edges the register had never touched -- the Architect's
  # question and the Terminologist's answer to it -- come off the backlog
  # with this one case: the inbound edge and the expected edge.
  inbound: {from: architect, to: terminologist, verb: question,
            body_refs: [<s1>],
            body_text: "What does 'line total' mean here -- the bill before the tip is added, or after?"}
  fixture:
    entries:
      - {id: <e1>, author: principal, ts_order: 1,
         text: "tip calculator: bill amount and tip percent in, tip amount out"}
    statements:
      - {id: <s1>, span_entry: <e1>, span_start: 0, span_end: 62,
         text: "tip calculator: bill amount and tip percent in, tip amount out",
         status: ratified}
    glossary_terms:
      - {id: <g1>, term: line total, sense_short: "the bill before the tip is added",
         provenance: decided}
  expect:
    messages:
      - {to: architect, verb: answer, count: 1}
  forbidden:
    # The word is defined. Answering is the act; redefining it while here would
    # settle a sense nobody disputed, and the Architect asked a question, not
    # for a change. And a question from a desk is answered at that desk, not
    # escalated past it.
    writes: [glossary_terms, statements, items]
    messages:
      - {to: liaison, verb: report}

- id: L1-CR-finish-the-review-with-the-answer-in-hand
  tier: T1
  role: critic
  runs: 5
  pass: 4
  # Night 69 (2026-09-14): the Critic challenged a test, the Tester had no
  # answer verb to the Critic, and the review re-fired until quarantined.
  # The answer channel exists now; the answer is the Tester's reading of
  # record, and the review ends the way any review ends.
  inbound: {from: tester, to: critic, verb: answer, body_refs: [<c1>, <tst1>]}
  repo:
    batch: <b1>
    message: "prorate charges"
    edit:
      src/billing/prorate.py: |
        def prorate(cents, days_used, days_in_period):
            if days_in_period <= 0:
                raise ValueError("days_in_period must be positive")
            if days_used <= 0:
                return 0
            return round(cents * days_used / days_in_period)
  fixture:
    items:
      - {id: <i1>, text: "prorate charges on upgrade", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "prorate on upgrade"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>, text: "prorate(999, 1, 3) returns 333",
         term_refs: '[]', surface_refs: '["src/billing/prorate.py::prorate"]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    tests:
      - id: <tst1>
        batch_id: <b1>
        criterion_id: <c1>
        path: tests/test_prorate.py
        body: |
          from billing.prorate import prorate


          def test_prorate_first_day():
              assert prorate(999, 1, 3) == 333
    test_runs:
      - {id: <r1>, batch_id: <b1>, test_id: <tst1>, commit_sha: abc123, result: pass}
  expect:
    calls: [verdicts.claim_encodes, verdicts.emit]
    writes: {verdicts: [1, 1]}
  forbidden:
    # The answer settled the claim. A second challenge on the same test is
    # the same argument again.
    messages: [{to: tester, verb: challenge}]
    writes: [criteria, tests]
