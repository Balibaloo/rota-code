- id: L1-LI-put-the-open-assumptions-to-a-present-principal
  tier: T1
  role: liaison
  model: gemma4:12b-it-qat
  runs: 5
  pass: 4
  tick: agenda
  fixture:
    items:
      - {id: <i1>, text: "people can close their account", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "close the account row"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>, text: "the row is marked closed", term_refs: '[]'}
    ledger:
      - {id: <l1>, about_ref: <c1>, about_table: criteria, author: developer,
         default_taken: "a closed account can still be logged into; the criteria
                         did not say"}
      - {id: <l2>, about_ref: <c1>, about_table: criteria, author: tester,
         default_taken: "closing twice is a no-op rather than an error"}
  expect:
    messages:
      # A present, not a clarify (2026-09-09): the page renders each row as
      # an assumption to approve or contest, and the ruling lands at the
      # keypress. A clarify put a question, the answer relayed, the rows
      # stayed open, and the agenda asked again until quarantined (tipsJ).
      - {to: principal, verb: present, count: 1, refs_include: [<l1>, <l2>]}
  forbidden:
    # Presentation, not a gate. They may defer every one of these; what must not
    # happen is Liaison resolving one on their behalf to keep things moving.
    writes: [ledger, decisions, items, criteria]
    recipients: [vision_keeper, developer, tester, architect]

- id: L1-LI-relay-an-answer-without-improving-it
  tier: T1
  role: liaison
  model: gemma4:12b-it-qat
  runs: 5
  pass: 4
  inbound: {from: terminologist, to: liaison, verb: answer, body_refs: [<g1>, <g2>]}
  fixture:
    entries:
      - {id: <e1>, author: principal, ts_order: 1,
         text: "when you say account, which one do you mean?"}
    glossary_terms:
      - {id: <g1>, term: account, sense_short: "the login identity",
         provenance: decided}
      - {id: <g2>, term: account, sense_short: "the billing entity that owes money",
         provenance: decided}
  expect:
    # `converse`, not `clarify`. The relay went out on the channel that asks
    # the principal a question, whose words go in `question=`, and the model
    # wrote a question -- on a live run the principal asked where a recipe is
    # written and got back "what is the structure of the system?". The words
    # go in `reply=` now, which is what a relayed answer is.
    messages:
      - {to: principal, verb: converse, count: 1, refs_include: [<g1>, <g2>]}
  forbidden:
    # Read-only, so nothing is revoked and no checkpoint is disturbed. Inquiry
    # is free and that is a property to preserve, not an opportunity to tidy
    # something up while here — and the answer travels as the owner wrote it.
    writes: [glossary_terms, statements, items, decisions]
    recipients: [vision_keeper, terminologist, architect, developer]
    # The old channel, named so the regression cannot come back quietly: an
    # answer relayed as a question is the failure this case now pins.
    messages:
      - {to: principal, verb: clarify}

- id: L1-TE-answer-the-architects-question
  tier: T1
  role: terminologist
  runs: 5
  pass: 4
  # The exchange the tips run performed live (2026-09-03): the Architect,
  # modelling a ratified statement, met a word it could not place and put it
  # to the desk that owns words; the Terminologist answered from the glossary.
  # Two message edges the register had never touched -- the Architect's
  # question and the Terminologist's answer to it -- come off the backlog
  # with this one case: the inbound edge and the expected edge.
  inbound: {from: architect, to: terminologist, verb: question,
            body_refs: [<s1>],
            body_text: "What does 'line total' mean here -- the bill before the tip is added, or after?"}
  fixture:
    entries:
      - {id: <e1>, author: principal, ts_order: 1,
         text: "tip calculator: bill amount and tip percent in, tip amount out"}
    statements:
      - {id: <s1>, span_entry: <e1>, span_start: 0, span_end: 62,
         text: "tip calculator: bill amount and tip percent in, tip amount out",
         status: ratified}
    glossary_terms:
      - {id: <g1>, term: line total, sense_short: "the bill before the tip is added",
         provenance: decided}
  expect:
    messages:
      - {to: architect, verb: answer, count: 1}
  forbidden:
    # The word is defined. Answering is the act; redefining it while here would
    # settle a sense nobody disputed, and the Architect asked a question, not
    # for a change. And a question from a desk is answered at that desk, not
    # escalated past it.
    writes: [glossary_terms, statements, items]
    messages:
      - {to: liaison, verb: report}

- id: L1-CR-finish-the-review-with-the-answer-in-hand
