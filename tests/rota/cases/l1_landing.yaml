- id: L1-LI-a-question-then-a-statement-at-the-confirm-is-the-question
  tier: T1
  role: liaison
  prompt: landing
  runs: 5
  pass: 3
  # seat1, the first exchange with the agent at the seat (2026-09-12): at the
  # confirm page the reply was a question followed by what the asker meant
  # ("before I say yes: does each person pay an equal share, or their own
  # order? I mean an equal share of the total including the tip."). The
  # Liaison read the statement, approved the line, and the next page was
  # signoff; the question was never answered. A question beside a ruling
  # is the question (2db5969): answer it, and the page stays open.
  # Attributed 2026-09-12: 0/5 on qwen3:8b and llama under the brief as
  # it stands. A sentence saying "a question anywhere in the reply makes
  # it a question" moved nothing here and turned a green landing case red
  # on each model; reverted. The lever is not another sentence on 8B.
  inbound: {from: principal, to: liaison, verb: converse,
            body_refs: [<s1>], cause: <m_confirm>,
            body_text: "before I say yes: does each person pay an equal share, or their own order? I mean an equal share of the total including the tip."}
  fixture:
    entries:
      - {id: <e1>, author: principal, ts_order: 1,
         text: "Split the bill: ask how many people are paying and print each person's share."}
    statements:
      - {id: <s1>, span_entry: <e1>, span_start: 0, span_end: 78,
         text: "Split the bill: ask how many people are paying and print each person's share.",
         status: proposed}
    messages:
      - {id: <m_confirm>, thread_id: t1, from_role: liaison, to_role: principal,
         verb: confirm, body_refs: '["<s1>"]', seq: 1}
  expect:
    messages:
      - {to: principal, verb: converse, count: 1}
  forbidden:
    writes: [rulings, statements, items, decisions, ledger]
    recipients: [vision_keeper, terminologist, architect]

- id: L1-LI-approve-one-line-only-approves-that-line-alone
  tier: T1
  role: liaison
  prompt: landing
  runs: 5
  pass: 3
  # seat2, click (2026-09-12): the page carried nineteen lines that said
  # the same sentence twice each. The reply approved one line and dismissed
  # the rest: "6 is fine, go ahead with it. 7 to 25 say the same sentence
  # twice each; I am not reading nineteen of those. approve 6 only." The
  # landing approved every line. A part-approval that names one line
  # approves that line and no other. What the rest become is the brief's;
  # that they are not approved is the case.
  inbound: {from: principal, to: liaison, verb: converse,
            body_refs: [<i1>, <i2>, <i3>], cause: <m_present>,
            body_text: "1 is fine, go ahead with it. 2 and 3 say the same sentence twice each; I am not reading those. approve 1 only."}
  fixture:
    items:
      - {id: <i1>, text: "The user types the bill and the number of people.",
         kind: in_scope, provenance: decided, approval: draft, version: 1}
      - {id: <i2>, text: "The software prints each person's share. The software prints each person's share.",
         kind: in_scope, provenance: decided, approval: draft, version: 1}
      - {id: <i3>, text: "The software rounds each share to cents. The software rounds each share to cents.",
         kind: in_scope, provenance: decided, approval: draft, version: 1}
    messages:
      - {id: <m_present>, thread_id: t1, from_role: liaison, to_role: principal,
         verb: present, body_refs: '["<i1>","<i2>","<i3>"]', seq: 1}
  expect:
    writes:
      rulings: {count: 1, text_includes: ['"<i1>": "approve"'],
                text_excludes: ['"<i2>": "approve"', '"<i3>": "approve"']}
  forbidden:
    writes: [statements, items, decisions, ledger]
    recipients: [vision_keeper, terminologist, architect, principal]

- id: L1-LI-a-long-page-is-ruled-without-the-rows
  tier: T1
  role: liaison
  prompt: landing
  runs: 5
  pass: 4
  # The long-page path, which no case measured. Night 85 (2026-09-18): the
  # landing wake for a 77-line present was 17,220 tokens against a 12,288
  # window, ollama kept the tail, and the seat answered as a generic
  # assistant. A page whose rows pass `LANDING_ROWS_CHARS` now travels as the
  # page text, a map of line number to id and kind, and `rows_not_shown`. The
  # rows are not in the wake at all, and the seat must still rule every line.
  inbound: {from: principal, to: liaison, verb: converse,
            body_refs: [<i1>, <i2>, <i3>, <i4>, <i5>, <i6>, <i7>, <i8>, <i9>],
            cause: <m_present>,
            body_text: "yes, that is all right, go ahead"}
  fixture:
    items:
      - {id: <i1>, text: "The user types the total on the bill and the number of
         people at the table, and the software reads both from the command line
         rather than from a file, because the person running it has the receipt
         in front of them and nothing else. Neither number is remembered between
         runs, and a second run with the same numbers prints the same answer.",
         kind: in_scope, provenance: decided, approval: draft, version: 1}
      - {id: <i2>, text: "The software prints each person's share to the nearest
         cent, and prints the remainder on its own line when the total does not
         divide evenly, so that the person paying the remainder can see what
         they are covering. The rounding is stated in the output rather than
         left for the reader to work out from the numbers.",
         kind: in_scope, provenance: decided, approval: draft, version: 1}
      - {id: <i3>, text: "The user can give a tip as a percentage of the bill or
         as a flat amount, and the software adds it to the total before it
         divides. A tip given as a percentage is worked out on the bill alone,
         never on a total that already includes an earlier tip, because a tip
         on a tip is not what anybody at the table means.",
         kind: in_scope, provenance: decided, approval: draft, version: 1}
      - {id: <i4>, text: "The software refuses a bill that is not a number and
         says which value it could not read, rather than printing a share of
         zero. It refuses a party of fewer than one person for the same reason.
         Each refusal names the value it rejected and the value it expected,
         in one sentence, on the error stream.",
         kind: in_scope, provenance: decided, approval: draft, version: 1}
      - {id: <i5>, text: "The output is one block of plain text with one line
         per person, and the currency symbol comes from the machine's own
         settings rather than from a flag, because the person splitting a bill
         is in one country at a time. A machine with no setting for it prints
         the numbers alone.",
         kind: in_scope, provenance: decided, approval: draft, version: 1}
      - {id: <i6>, text: "The software runs from one command with no
         installation step beyond the interpreter, and prints its usage when it
         is called with no arguments at all. The usage names every argument in
         the order the command takes them, with one example line that a reader
         can copy and change.",
         kind: in_scope, provenance: decided, approval: draft, version: 1}
      - {id: <i7>, text: "The software reads an optional name for each person
         at the table, and prints the name beside the share when it was given.
         A party with no names prints as numbered people in the order they were
         entered, and a party with some names prints the rest as numbers, so a
         half-filled list is still readable.",
         kind: in_scope, provenance: decided, approval: draft, version: 1}
      - {id: <i8>, text: "The software can split a bill unevenly when the user
         gives a share per person, and it refuses a set of shares that does not
         add up to the whole bill. The refusal prints the difference, so the
         person correcting it can see how far out the numbers are without
         adding them up again.",
         kind: in_scope, provenance: decided, approval: draft, version: 1}
      - {id: <i9>, text: "The software prints the total it worked from on the
         first line of the output, including the tip, so that the person
         reading the shares can check the arithmetic against the receipt in
         their hand. The line names the bill and the tip apart, never as one
         number the reader has to take on trust.",
         kind: in_scope, provenance: decided, approval: draft, version: 1}
    messages:
      - {id: <m_present>, thread_id: t1, from_role: liaison, to_role: principal,
         verb: present,
         body_refs: '["<i1>","<i2>","<i3>","<i4>","<i5>","<i6>","<i7>","<i8>","<i9>"]',
         seq: 1}
  expect:
    writes:
      rulings: {count: 1,
                text_includes: ['"<i1>": "approve"', '"<i9>": "approve"']}
  forbidden:
    writes: [statements, items, decisions, ledger]
    recipients: [vision_keeper, terminologist, architect, principal]

# Night 133's m350 said the confirm change is a separate request. On the
# shift page, separate is later, even beside "leave it out of this one"
# (frame 193's design, 2.F.3 and 2.F.5).
- id: L1-LI-a-separate-request-is-later
  tier: T1
  role: liaison
  prompt: landing
  runs: 5
  pass: 4
  inbound: {from: principal, to: liaison, verb: converse,
            body_refs: [<i1>, <s3>], cause: "m_shift_<i1>_<m3>",
            body_text: "They're independent. The confirm change is a separate request I'll take up on its own, so leave it out of this one. This change only adds an optional flag to the version option, off by default, that puts the running Python version from the interpreter's version info, written as major.minor.micro, at the end of the version message."}
  fixture:
    entries:
      - {id: <e2>, author: principal, ts_order: 1,
         text: "Let confirm() take a default_on_eof flag: when stdin is closed it returns the default instead of aborting."}
      - {id: <e3>, author: principal, ts_order: 2,
         text: "Give version_option a show_python flag that appends the running Python version to the message."}
    statements:
      - {id: <s2>, span_entry: <e2>, span_start: 0, span_end: 106,
         text: "Let confirm() take a default_on_eof flag: when stdin is closed it returns the default instead of aborting.",
         status: ratified}
      - {id: <s3>, span_entry: <e3>, span_start: 0, span_end: 94,
         text: "Give version_option a show_python flag that appends the running Python version to the message.",
         status: ratified}
    items:
      - {id: <i1>, text: "Let confirm() take a default_on_eof flag: when stdin is closed it returns the default instead of aborting.",
         kind: in_scope, provenance: decided, approval: approved, approval_ver: 1, version: 1}
    item_statements:
      - {item_id: <i1>, statement_id: <s2>}
    messages:
      - {id: <m2>, thread_id: t1, from_role: principal, to_role: liaison,
         verb: converse, body_refs: '["<e2>"]', seq: 1, status: answered}
      - {id: <m3>, thread_id: t1, from_role: principal, to_role: liaison,
         verb: converse, body_refs: '["<e3>"]', seq: 2, status: answered}
      - {id: "m_shift_<i1>_<m3>", thread_id: t2, from_role: liaison,
         to_role: principal, verb: present, body_refs: '["<i1>","<s3>"]', seq: 3}
  expect:
    writes:
      rulings: {count: 1, text_includes: ['"<i1>": "park"', 'separate request']}
  forbidden:
    writes: [statements, items, decisions, ledger]
    recipients: [vision_keeper, terminologist, architect, principal]

# Night 175 (W14): he deleted c_2 and c_3 five times in his own verb, and the
# seat wrote `remove` on the rows. Only `drop` retires a criterion, so both
# rows stayed live with no test and walk 3 gave up. The page and the reply
# are m116 and m118 of the night, without the two read-back lines.
- id: L1-LI-remove-lines-on-a-criteria-page-is-a-drop
  tier: T1
  role: liaison
  prompt: landing
  model: qwen3:8b
  runs: 5
  pass: 4
  inbound: {from: principal, to: liaison, verb: converse,
            body_refs: [<b1>, <i1>, <c1>, <c2>, <c3>], cause: <m_present>,
            body_text: "Please don't give up on this change: remove lines 7 and 8 and finish with line 2 alone, because I asked for only one example and only the docstring changes, not the code. Lines 1 to 6 and line 9 are ok."}
  fixture:
    items:
      - {id: <i1>, text: "Give format_filename one example in its docstring: with shorten set to True, the path a/b/c.txt shows as c.txt.",
         kind: in_scope, provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "give format_filename one example in its docstring"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "The docstring for format_filename must include an example showing that when shorten=True, the path a/b/c.txt is displayed as c.txt."}
      - {id: <c2>, ticket_id: <tk1>,
         text: "The docstring for format_filename must include an example showing that when shorten=False, the path a/b/c.txt is displayed as a/b/c.txt."}
      - {id: <c3>, ticket_id: <tk1>,
         text: "The docstring for format_filename must include an example showing that when shorten=True, a long path like /very/long/path/to/a/b/c.txt is displayed as c.txt."}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    tests:
      - {id: <tst1>, batch_id: <b1>, criterion_id: <c1>, path: tests/test_format_filename_1.py,
         body: "def test_example():\n    pass\n"}
      - {id: <tst2>, batch_id: <b1>, criterion_id: <c1>, path: tests/test_format_filename_2.py,
         body: "def test_example():\n    pass\n"}
      - {id: <tst3>, batch_id: <b1>, criterion_id: <c1>, path: tests/test_format_filename_3.py,
         body: "def test_example():\n    pass\n"}
      - {id: <tst4>, batch_id: <b1>, criterion_id: <c1>, path: tests/test_format_filename_4.py,
         body: "def test_example():\n    pass\n"}
    messages:
      - {id: <m_present>, thread_id: t1, from_role: liaison, to_role: principal,
         verb: present, body_refs: '["<b1>","<i1>","<c1>","<c2>","<c3>"]', seq: 1}
  expect:
    writes:
      rulings: {count: 1, text_includes: ['"<c2>": "contest"', '"<c3>": "contest"',
                                          '"<i1>": "approve"', '"<c1>": "approve"']}
      ruled_refs: {text_includes: ['"ref": "<c2>", "line": 7, "verdict": "contest", "act": "drop", "target_kind": "row"',
                                   '"ref": "<c3>", "line": 8, "verdict": "contest", "act": "drop", "target_kind": "row"'],
                   text_excludes: ['"act": "remove"']}
  forbidden:
    writes: [statements, items, decisions, ledger]
    recipients: [vision_keeper, terminologist, architect, principal]

