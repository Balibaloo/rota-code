# L1 — Liaison. The only role that sees the principal, and the one most likely
# to fail by being helpful: interpreting, summarising, or inventing a question.
# The `forbidden:` blocks here carry most of the weight.

- id: L1-LI-chat-is-not-work
  tier: T1
  role: liaison
  runs: 5
  pass: 4
  # The chat half of intake, which had no case at all.
  #
  # `converse` grew a chat path -- greetings get a reply rather than a
  # segmentation -- and nothing measured it, so the only evidence it worked was
  # that somebody had watched it work once. Meanwhile it took the two cases that
  # did exist to 0/5: handed "morning. we need SSO, but only if it works with
  # our LDAP", Liaison answered "Hello! What would you like to build?", which is
  # the greeting from its own brief's worked example.
  #
  # Both halves are pinned now. A brief that can only be tuned in one direction
  # gets tuned until the other direction breaks, and that is exactly what
  # happened here.
  fixture:
    entries:
      - {id: e_<m_in>, author: principal, ts_order: 1,
         text: "hey, morning!"}
  inbound: {id: <m_in>, from: principal, to: liaison, verb: converse,
            body_refs: []}
  expect:
    messages:
      - {to: principal, verb: converse, count: 1}
  forbidden:
    # A greeting is not a commitment. Segmenting one puts a statement in front of
    # the principal to ratify and sends three roles off to work from it, which is
    # the cost of getting this wrong in the other direction.
    writes: [statements, items, glossary_terms]
    recipients: [gatekeeper, terminologist, architect]

- id: L1-LI-segment
  tier: T1
  role: liaison
  runs: 5
  pass: 4
  fixture:
    entries:
      - {id: e_<m_in>, author: principal, ts_order: 1,
         text: "morning. we need SSO, but only if it works with our LDAP"}
  inbound: {id: <m_in>, from: principal, to: liaison, verb: converse,
            body_refs: []}
  expect:
    writes:
      # Bounded above, because a lower bound alone measures that something
      # happened. This asserted ">=1" and passed 5/5 while the same role turned
      # "let people export their invoices as CSV" into fourteen statements in a
      # live run. "morning" is not a statement and the rest is one commitment
      # with a condition on it, so three is already generous.
      statements: {count: "1..3"}
  forbidden:
    # Recording is mechanical and already done — a second entry is the
    # fabrication this cost a session to learn about. And segmenting is not
    # interpreting: no items, no glossary.
    writes: [entries, items, glossary_terms]
    recipients: [gatekeeper, terminologist, architect]

- id: L1-LI-ratify
  tier: T1
  role: liaison
  runs: 5
  pass: 4
  fixture:
    entries:
      - {id: <e1>, author: principal, text: "let people export their invoices", ts_order: 1}
    statements:
      - {id: <s1>, span_entry: <e1>, span_start: 0, span_end: 32,
         text: "let people export their invoices", status: proposed}
  inbound: {from: principal, to: liaison, verb: verdict, body_refs: [<s1>]}
  expect:
    writes:
      # Measured, not probed: read back from the runs already recorded
      # against this prompt that passed. The ceiling is the highest of them.
      statements: {count: "1..1"}
  forbidden:
    # Ratifying is a status flag, not new material.
    writes: [entries, items]

- id: L1-LI-present-for-signoff
  tier: T1
  role: liaison
  runs: 5
  pass: 4
  fixture:
    items:
      - {id: <i1>, text: "users can delete their account", kind: in_scope,
         provenance: decided, approval: draft, version: 1}
      - {id: <i2>, text: "deleted accounts keep their invoices", kind: out_of_scope,
         provenance: decided, approval: draft, version: 1}
  inbound: {from: gatekeeper, to: liaison, verb: submit, body_refs: [<i1>, <i2>]}
  expect:
    messages:
      - {to: principal, verb: present, count: 1}
  forbidden:
    # Presenting is not deciding. Liaison never sets approval — that is
    # Gatekeeper applying the principal's ruling, one hop later.
    writes: [items, statements]

- id: L1-LI-no-report-no-question
  tier: T1
  role: liaison
  runs: 5
  pass: 4
  fixture:
    entries:
      - {id: e_<m_in>, author: principal, ts_order: 1,
         text: "make the dashboard better, you know what I mean"}
  inbound: {id: <m_in>, from: principal, to: liaison, verb: converse,
            body_refs: []}
  expect:
    writes:
      statements: {count: ">=1"}
  forbidden:
    # Vague, and no role has reported a blocker. Segment it and confirm the
    # segmentation — that is the L1 gate and it is required. What must not
    # happen is *clarify*: a vague statement is not Liaison's problem to solve,
    # and asking about it is inventing a question nobody raised.
    #
    # The first version of this case forbade every message to the principal,
    # which also forbade the confirm. It failed 0/5 on correct behaviour.
    messages:
      - {to: principal, verb: clarify}
    writes: [entries, items]
