      - {batch_id: <b1>, grain: "src/click/utils.py::format_filename", grain_kind: symbol,
         confidence: possible}
    tests:
      - id: <t1>
        batch_id: <b1>
        criterion_id: <c1>
        path: tests/test_utils/test_format_filename_c_1.py
