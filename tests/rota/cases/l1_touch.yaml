      - {batch_id: <b1>, commit_sha: HEAD, path: "src/click/utils.py::format_filename",
         status: mistake,
         note: "removal: `filename = os.fspath(filename)` at line 34, `if isinstance(filename,
           bytes):` at line 36 The removal of the old logic for handling bytes and
           encoding is a mistake. The request only asked for an example in the
           docstring, not a rewrite of the function. The removal touches a definition
           not named in the request or any criterion."}
  expect:
    write_includes:
      - 'filename.encode("utf-8", "surrogateescape")'
      - 'filename = os.path.basename(filename)'
  forbidden:
    writes: [tests, criteria]
    recipients: [tester, liaison, vision_keeper]
