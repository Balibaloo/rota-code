      - {id: <c3>, ticket_id: <tk1>, text: "The docstring must include an example showing
           that when shorten=True, a path like \"a/b/c.txt\" is displayed as \"c.txt\".",
         term_refs: '["format_filename"]', surface_refs: '["src/click/utils.py::format_filename"]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: HEAD}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    batch_touch:
