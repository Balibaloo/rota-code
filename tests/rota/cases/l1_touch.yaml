- id: L1-DV-put-back-a-removed-block
  # F7 pass 3, night 172's bg_3 (2026-10-28). The batch asked for one
  # docstring example in `format_filename`. The commit 128bec7e rewrote the
  # body too, and the Architect s262 judged the removal a mistake. The
  # Developers s263, s264 and s267 woke on `tick:touch_mistaken` with no
  # base text, and each wrote the head's own body back
  # (`plans/f7-night172-read.md`, sections 1 and 3). The wake now pushes
  # `code.diff`, so `[removed lines]` shows the base body, and the wake's
  # detail shows the `mistake` row with its note. The file here holds
  # `format_filename` alone, so the note's line numbers are those of this
  # file, in `code.source` numbering. The grader reads the head commit
  # after the run. Both base lines must be code in the body of
  # `format_filename`, so a word in the docstring does not pass. s264's and
  # s267's writes held `surrogateescape` in the docstring only, and s243's
  # restore held `basename` only (F7 review p3, findings 1 and 2).
  # The night's model. The case waits on the card for its recording.
  model: qwen3.5:9b
  tier: T1
  role: developer
  runs: 5
  pass: 4
  tick: touch_mistaken
  refs: [<b1>]
  repo:
    onboard: true
    change:
      src/click/utils.py: |
        import os
        import sys


        def format_filename(
            filename: str | bytes | os.PathLike[str] | os.PathLike[bytes],
            shorten: bool = False,
        ) -> str:
            """Format a filename as a string for display. Ensures the filename can be
            displayed by replacing any invalid bytes or surrogate escapes in the name
            with the replacement character ``�``.

            Invalid bytes or surrogate escapes will raise an error when written to a
            stream with ``errors="strict"``. This will typically happen with ``stdout``
            when the locale is something like ``en_GB.UTF-8``.

            Many scenarios *are* safe to write surrogates though, due to PEP 538 and
            PEP 540, including:

            -   Writing to ``stderr``, which uses ``errors="backslashreplace"``.
            -   The system has ``LANG=C.UTF-8``, ``C``, or ``POSIX``. Python opens
                stdout and stderr with ``errors="surrogateescape"``.
            -   None of ``LANG/LC_*`` are set. Python assumes ``LANG=C.UTF-8``.
            -   Python is started in UTF-8 mode  with  ``PYTHONUTF8=1`` or ``-X utf8``.
                Python opens stdout and stderr with ``errors="surrogateescape"``.

            :param filename: formats a filename for UI display.  This will also convert
                             the filename into unicode without failing.
            :param shorten: this optionally shortens the filename to strip of the
                            path that leads up to it.
            """
            if shorten:
                filename = os.path.basename(filename)
            else:
                filename = os.fspath(filename)

            if isinstance(filename, bytes):
                filename = filename.decode(sys.getfilesystemencoding(), "replace")
            else:
                filename = filename.encode("utf-8", "surrogateescape").decode(
                    "utf-8", "replace"
                )

            return filename
    batch: <b1>
    index_batch: true
    message: "Implement shorten=True logic in format_filename to return base filename"
    edit:
      src/click/utils.py: |
        import os
        import sys


        def format_filename(
            filename: str | bytes | os.PathLike[str] | os.PathLike[bytes],
            shorten: bool = False,
        ) -> str:
            """Format a filename as a string for display. Ensures the filename can be
            displayed by replacing any invalid bytes or surrogate escapes in the name
            with the replacement character ``�``.

            Invalid bytes or surrogate escapes will raise an error when written to a
            stream with ``errors="strict"``. This will typically happen with ``stdout``
            when the locale is something like ``en_GB.UTF-8``.

            Many scenarios *are* safe to write surrogates though, due to PEP 538 and
            PEP 540, including:

            -   Writing to ``stderr``, which uses ``errors="backslashreplace"``.
            -   The system has ``LANG=C.UTF-8``, ``C``, or ``POSIX``. Python opens
                stdout and stderr with ``errors="surrogateescape"``.
            -   None of ``LANG/LC_*`` are set. Python assumes ``LANG=C.UTF-8``.
            -   Python is started in UTF-8 mode  with  ``PYTHONUTF8=1`` or ``-X utf8``.
                Python opens stdout and stderr with ``errors="surrogateescape"``.

            :param filename: formats a filename for UI display.  This will also convert
                             the filename into unicode without failing.
            :param shorten: this optionally shortens the filename to strip of the
                            path that leads up to it.

            Example:
                >>> format_filename("a/b/c.txt", shorten=True)
                'c.txt'

            """
            # Convert bytes or PathLike to string if necessary
            if isinstance(filename, (bytes, bytearray)):
                try:
                    filename = filename.decode(sys.getfilesystemencoding())
                except UnicodeError:
                    filename = filename.decode("utf-8", "replace")
            elif hasattr(filename, "__fspath__"):
                filename = os.fspath(filename)

            # Handle shorten parameter
            if shorten and "/" in filename:
                filename = filename.split("/")[-1]

            return filename
  fixture:
    items:
      - {id: <i1>, text: "With shorten set to True, the path a/b/c.txt is displayed
           as c.txt in the docstring of format_filename.",
         kind: in_scope, provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "with shorten set to true, the path a/b/c.txt
           is displayed as c.txt in the docstring of format_filename"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>, text: "The docstring of format_filename must include
