          ..\..\..\..\..\..\Python\pythoncore-3.14-64\Lib\asyncio\runners.py:204: in run
              return runner.run(main)
                     ^^^^^^^^^^^^^^^^
          _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _

          self = <asyncio.runners.Runner object at 0x000001D5D1ED4590>, coro = None

              def run(self, coro, *, context=None):
                  """Run code in the embedded event loop."""
                  if events._get_running_loop() is not None:
                      # fail fast with short traceback
                      raise RuntimeError(
                          "Runner.run() cannot be called from a running event loop")

                  self._lazy_init()

                  if not coroutines.iscoroutine(coro):
                      if inspect.isawaitable(coro):
                          async def _wrap_awaitable(awaitable):
                              return await awaitable

                          coro = _wrap_awaitable(coro)
                      else:
          >               raise TypeError('An asyncio.Future, a coroutine or an '
                                          'awaitable is required')
          E               TypeError: An asyncio.Future, a coroutine or an awaitable is required

          ..\..\..\..\..\..\Python\pythoncore-3.14-64\Lib\asyncio\runners.py:103: TypeError
          ---------------------------- Captured stdout call -----------------------------
          {"a": 1}
          =========================== short test summary info ===========================
          FAILED test_export.py::test_echo_json_prints_one_line - TypeError: An asyncio...
          ============================== 1 failed in 0.21s ==============================
  expect:
