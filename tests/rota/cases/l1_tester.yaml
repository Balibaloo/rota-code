# L1 — Tester, and the two read-only `ask` modes.
#
# Tester writes what "done" means, which makes its one dangerous failure a test
# softened to end an argument: the definition of done changes and nobody decides
# to change it.

- id: L1-TS-hold-a-test-that-is-right
  # Held by the production model (5/5, 2026-08-29); the
  # recording model's red stays in case_runs as its record.
  model: qwen3:8b
  tier: T1
  role: tester
  runs: 5
  pass: 4
  inbound: {from: developer, to: tester, verb: challenge, body_refs: [<tst1>, <c1>]}
  # The challenge mode holds `code.source`, and without a repository it
  # refuses with no project_root (frame 326, fault B).
  repo:
    batch: <b1>
    message: "close an account"
    edit:
      src/accounts/close.py: |
        _closed = set()
        _invoices = {}


        def close_account(account):
            _closed.add(account)


        def invoices_for(account):
            return _invoices.get(account, [])
  fixture:
    items:
      - {id: <i1>, text: "closing an account keeps its invoices", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "close an account"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "closing an account marks it closed and leaves its invoices in place",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    tests:
      # Encodes the criterion exactly. The challenge is wrong.
      - {id: <tst1>, batch_id: <b1>, criterion_id: <c1>, path: test_close.py,
         body: "close_account(a); assert invoices_for(a) != []"}
  expect:
    messages:
      - {to: developer, verb: answer, count: 1}
  forbidden:
    # Softening it would let the diff through and change what "done" means with
    # nobody deciding to. The test is the definition, not an obstacle to it.
    #
    # Went red 2026-08-26 when the challenge mode's toolkit gained the
    # question channels the parroting guard names: the signature block grew
    # two lines and llama flipped from holding to rewriting -- five of five,
    # dropping `!= []` from the assertion. The rewrite happens to be
    # semantically equivalent for a list, and it is forbidden anyway, because
    # rewriting under pressure is the class: the next flip might not be
    # equivalent, and nobody decided anything. Red honestly; the green-by-load
    # entry in DECISIONS is about exactly this.
    writes: [tests, criteria, items]

- id: L1-TS-fix-a-test-that-asserts-more-than-its-criterion
  tier: T1
  role: tester
  runs: 5
  pass: 4
  # Attributed 2026-09-13 on qwen3:8b, 0/5 after the answer-must-carry door
  # was withdrawn: the Tester reads the test as sufficient and answers the
  # challenge in words instead of narrowing the test. 8B judgement on what
  # the criterion asserts.
  inbound: {from: developer, to: tester, verb: challenge, body_refs: [<tst1>, <c1>]}
  # The challenge mode holds `code.source`, and without a repository it
  # refuses with no project_root (frame 326, fault B).
  repo:
    batch: <b1>
    message: "truncate the subject"
    edit:
      src/mail/subject.py: |
        def truncate(subject, width=72):
            return subject[:width]
  fixture:
    items:
      - {id: <i1>, text: "long subject lines are truncated", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "truncate the subject"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "a subject longer than 72 characters is truncated to 72",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    tests:
      # Asserts the length *and* a specific ellipsis character the criterion
      # never mentions. A test that asserts more than was asked for reports as
      # coverage while failing work that was correctly done.
      - {id: <tst1>, batch_id: <b1>, criterion_id: <c1>, path: test_truncate.py,
         body: "s = truncate('x' * 100); assert len(s) == 72 and s.endswith('...')"}
  expect:
    calls: [criteria.load]
    writes:
      # One criterion in the fixture, and one test per criterion is now
      # structural rather than asked for -- `tests.encode` reports a second
      # test for a criterion it has already encoded and stages nothing. So the
      # ceiling is derived, not probed: there are no runs behind this number
      # and none needed, which is the only bound in this file that can say so.
      tests: {count: "1..1"}
  forbidden:
    # A wrong test is worse than a missing one, but fixing it is not licence to
    # re-derive what was asked for.
    writes: [criteria, items, tickets]

- id: L1-TS-fix-a-test-that-calls-a-plain-function-through-a-runner
  # Frame 110, night 106: the Tester re-wrapped a plain function for a
  # runner and never called the function. The test here fails the same way
