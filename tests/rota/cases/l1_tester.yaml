  # encodes from the criteria alone. The stubs `exceptions.py`, `utils.py`,
  # `_readline_prompt` and `_` let `src.click.termui` load in the sandbox.
  # Without them the unloadable-surface door fired on 3 of 5 runs
  # (`plans/frame143-pass1b-read.md`, section 5). The helpers sit after
  # `confirm`, so the pushed surface keeps its start line.
  model: qwen3.5:9b
  tier: T1
  role: tester
  runs: 5
  pass: 3
  inbound:
    id: m88
    from: vision_keeper
    to: tester
    verb: answer
    body_refs: [cr_1_confirm_default_on_eof, cr_2_confirm_default_on_eof, cr_3_confirm_default_on_eof]
  repo:
    batch: <b1>
    message: "let confirm take a default_on_eof flag"
    edit:
      src/click/termui.py: |
        from __future__ import annotations

        import sys

        from .exceptions import Abort
        from .utils import echo

        visible_prompt_func = input


        def _build_prompt(text, suffix, show_default=False, default=None, show_choices=True, type=None):
            return text + suffix


        def confirm(
            text: str,
            default: bool | None = False,
            abort: bool = False,
            prompt_suffix: str = ": ",
            show_default: bool = True,
            err: bool = False,
        ) -> bool:
            """Prompts for confirmation (yes/no question).

            If the user aborts the input by sending a interrupt signal this
            function will catch it and raise a :exc:`Abort` exception.

            :param text: the question to ask.
            :param default: The default value to use when no input is given. If
                ``None``, repeat until input is given.
            :param abort: if this is set to `True` a negative answer aborts the
                          exception by raising :exc:`Abort`.
            :param prompt_suffix: a suffix that should be added to the prompt.
            :param show_default: shows or hides the default value in the prompt.
            :param err: if set to true the file defaults to ``stderr`` instead of
                        ``stdout``, the same as with echo.

            .. versionchanged:: 8.3.1
                A space is no longer appended to the prompt.

            .. versionchanged:: 8.0
                Repeat until input is given if ``default`` is ``None``.

            .. versionadded:: 4.0
                Added the ``err`` parameter.
            """
            prompt = _build_prompt(
                text,
                prompt_suffix,
                show_default,
                "y/n" if default is None else ("Y/n" if default else "y/N"),
            )

            while True:
                try:
                    value = _readline_prompt(visible_prompt_func, prompt, err).lower().strip()
                except (KeyboardInterrupt, EOFError):
                    raise Abort() from None
                if value in ("y", "yes"):
                    rv = True
                elif value in ("n", "no"):
                    rv = False
                elif default is not None and value == "":
                    rv = default
                else:
                    echo(_("Error: invalid input"), err=err)
                    continue
                break
            if abort and not rv:
                raise Abort()
            return rv


        def _readline_prompt(func, prompt, err):
            return func(prompt)


        def _(message):
            return message
      src/click/__init__.py: ""
      src/click/exceptions.py: |
        class Abort(Exception):
            pass
      src/click/utils.py: |
        def echo(message=None, err=False):
            print(message)
  fixture:
