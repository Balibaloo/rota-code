  expect:
    # `status: unresolved` tells the new verdict from the open question of
    # `cannot`.
    messages: [{to: terminologist, verb: question, count: 1,
                refs_include: [<c1>], status: unresolved}]
  forbidden:
    # A test on the return value is the night 91 fault. The criterion is the
    # Terminologist's to rewrite, not the Tester's.
    writes: [tests, criteria, items]

- id: L1-TS-act-on-the-reason-of-a-challenge
  # Frame 200, pass 5, night 143's bg_5 (2026-10-12): the Tester s440, woken
  # by the challenge m291, had Click's hint "Try passing 'package_name'
  # instead" and passed the argument to runner.invoke, not to the decorator
  # (`plans/night143-cycle-bg5.md`, section 2). m291 carried two quotes and no
  # reason. Here the challenge refs the Developer's reason row, s441's own
  # sentence, verbatim. The case measures the seat, not a red of the code: a
