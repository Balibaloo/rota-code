  # Frame 143, night 154 (2026-10-17), s199 seq 3: the Tester, woken by the
  # Vision Keeper's answer m88, encoded `assert confirm("y/n",
  # default_on_eof=True) == "y"`. `confirm` returns `True` or `False`, and
