        batch_id: <b1>
        test_id: <tst1>
        # The red run names the edit commit, as a real run does. The output
        # is the tail of this body under pytest on Python 3.14.2 (observed:
        # a scratch run, 2026-10-02).
        commit_sha: HEAD
        result: fail
        output: |
          capsys = <_pytest.capture.CaptureFixture object at 0x000001D5D1ED46E0>

              def test_echo_json_prints_one_line(capsys):
          >       asyncio.run(echo_json({"a": 1}))

          test_export.py:7:
