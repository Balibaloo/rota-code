- id: L1-TS-send-a-test-written-into-the-reply-as-tests-encode
  # Frame 152, night 125: the Tester s149, woken by the challenge m69,
  # wrote a right repair in a fence and sent no tests.encode. The runner
  # said nothing, and the session closed with nothing written. Here the
  # seat's turn 1 is s149's own reply, and the runner answers it with the
  # nudge for a test written into a reply. The judgement is the first call
  # after the nudge: tests.encode on the challenged test's id.
  # The night's model.
  model: qwen3.5:9b
  tier: T1
  role: tester
  runs: 5
  pass: 4
  inbound:
    from: developer
    to: tester
    verb: challenge
    body_refs: [<c1>, <tst1>]
    body_text: "The callable `echo_json` accepts any Python object and
      writes its JSON representation to the stream using
      `json.dumps(obj, separators=(\",\", \":\"))`, followed by a single
      newline. ... output = sys.stdout.getvalue()"
  # The challenge mode holds `code.source`, and without a repository it
  # refuses with no project_root (frame 326, fault B). The edit commit is
  # the batch head, and the run below is seeded against it, as on the night.
  repo:
    batch: <b1>
    message: "add echo_json"
    edit:
      src/click/utils.py: |
        import json


        def echo_json(obj):
            print(json.dumps(obj, separators=(",", ":")))
  replies:
    - |-
      The test failed because `sys.stdout` is not a plain file object but an `EncodedFile`. The test's attempt to call `.getvalue()` on it fails. This is a common pattern when testing code that writes to stdout: you must capture the output differently (e.g., by redirecting at the process level or using a custom stream wrapper).

      However, the criterion does not specify how to capture output — only what `echo_json` should write. The test's implementation choice (using `StringIO`) is invalid in this environment because `sys.stdout` has been replaced with an `EncodedFile`, which lacks `.getvalue()`.

      The fix is to use a method that works with the actual runtime environment. Since we cannot assume `sys.stdout` can be replaced with a plain file, we must instead capture output via a different mechanism — for example, by using `contextlib.redirect_stdout` or by mocking stdout in a way compatible with `EncodedFile`.

      But wait: the criterion says nothing about how to test it — only what behavior is expected. The test's failure is due to an implementation detail (using `StringIO` directly on `sys.stdout`). That is not a flaw in the criterion, but in the test's approach.

      We must rewrite the test so that it captures output correctly without relying on `.getvalue()` on an `EncodedFile`.

      Let’s fix the test by using `contextlib.redirect_stdout` to redirect stdout to a `StringIO` during the call.

      ```python
      def test_echo_json_compact():
          import sys
          from io import StringIO
          from contextlib import redirect_stdout
          from src.click.utils import echo_json

          captured = StringIO()
          with redirect_stdout(captured):
              echo_json({"key": "value"})

          output = captured.getvalue()
          assert output.strip() == '{"key": "value"}'
          # Check for single newline at end
          assert output.endswith("\n")
          # Check no extra newlines
          assert output.count("\n") == 1
      ```

      This avoids the `.getvalue()` call on `sys.stdout` directly and instead uses a context manager to redirect stdout to a `StringIO`.

      Now encode this corrected test.
  fixture:
    items:
      - {id: <i1>, text: "Add an echo_json(obj) helper next to echo that prints
           an object as compact JSON on one line, followed by a newline.",
         kind: in_scope, provenance: decided, approval: approved,
         approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "add echo_json"}
    criteria:
      - id: <c1>
        ticket_id: <tk1>
        text: "The callable `echo_json` accepts any Python object and writes
          its JSON representation to the stream using
          `json.dumps(obj, separators=(\",\", \":\"))`, followed by a single
          newline."
        term_refs: '[]'
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: a7045de}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    # The night's row that covers the test's literal. Without it the
    # assumption door refuses the repair, and the case measures that door.
    ledger:
      - {id: <l1>, about_ref: <c1>, about_table: criteria,
         default_taken: "the test assumes input string '{\"key\": \"value\"}'
           where the material is silent",
         status: resolved, author: tester, version: 2}
    tests:
      # Version 2 of inh_echo_json_01 from s145. It reads the buffer after
      # it puts the old stdout back, so it fails before any assertion.
      - id: <tst1>
        batch_id: <b1>
        criterion_id: <c1>
        path: tests/test_utils/test_echo_json_compact.py
        version: 2
        # One change from the night: the night's assert compared with a
        # string that holds both quote kinds, and the parser decodes one
        # level of escapes, so 5 of 5 first encodes that copied it failed
        # to parse (frame 152's review of 9684e3c, point 5). The assert
        # then compared parsed JSON, and 5 of 5 first encodes took that
        # assert without its import (the review of 5e0dd71, F4). The assert
        # now needs no import and holds one quote kind.
        body: |-
          def test_echo_json_compact():
              import sys
              from io import StringIO
              from src.click.utils import echo_json

              old_stdout = sys.stdout
              sys.stdout = StringIO()
              try:
                  echo_json({"key": "value"})
              finally:
                  sys.stdout = old_stdout

              output = sys.stdout.getvalue()
              assert "key" in output and "value" in output
              # Check for single newline at end
              assert output.endswith("\n")
              # Check no extra newlines
              assert output.count("\n") == 1
    test_runs:
      - id: <r1>
        batch_id: <b1>
        test_id: <tst1>
        commit_sha: HEAD
        result: fail
        attempt: 5
        output: |-
          F                                                                        [100%]
          ================================== FAILURES ===================================
          ___________________________ test_echo_json_compact ____________________________

              def test_echo_json_compact():
                  import sys
                  from io import StringIO
                  from src.click.utils import echo_json

                  old_stdout = sys.stdout
                  sys.stdout = StringIO()
                  try:
                      echo_json({"key": "value"})
                  finally:
                      sys.stdout = old_stdout

          >       output = sys.stdout.getvalue()
                           ^^^^^^^^^^^^^^^^^^^
          E       AttributeError: 'EncodedFile' object has no attribute 'getvalue'

          tests\test_utils\test_echo_json_compact.py:13: AttributeError
          =========================== short test summary info ===========================
          FAILED tests/test_utils/test_echo_json_compact.py::test_echo_json_compact - A...
          1 failed in 0.14s
  expect:
    # One judgement: the first call after the nudge sends the test on the
    # challenged id. Whether the doors then admit the body is another
    # judgement, and the case does not score it.
    first_call:
      fn: tests.encode
      args: {id: <tst1>, criterion_id: <c1>,
             path: tests/test_utils/test_echo_json_compact.py}
  forbidden:
    writes: [criteria, items, tickets]

- id: L1-VK-answer-a-scope-inquiry-read-only
  tier: T1
  role: vision_keeper
  runs: 5
  pass: 4
  inbound: {from: liaison, to: vision_keeper, verb: ask, body_refs: [<i1>, <i2>]}
  fixture:
    items:
      - {id: <i1>, text: "people can close their account", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
      - {id: <i2>, text: "bulk export is not part of this", kind: out_of_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
  expect:
    messages:
      - {to: liaison, verb: answer, count: 1}
  forbidden:
    # Read-only stops being free the moment an inquiry quietly becomes a
    # decision. The namespace forbids the write; the case watches for the answer
    # going back to the role that asked rather than out to the roles it is about.
    writes: [items, decisions, tickets]
    recipients: [terminologist, architect, developer, tester]

# ---------------------------------------------------------------------------
# The cannot verdicts. One judgement, measured to its boundary and re-specced.
#
# These two cases spent a register generation demanding the right desk first
# time -- vision_keeper for an uncheckable sentence, researcher for an outside
# fact -- and the fork verdict (2026-08-28) showed what that bought: 8B says
# `encodable` 5/5 on both, 14B correctly says cannot but collapses every kind
# to the nearest desk. The taxonomy only existed to pick a desk, and the
# `unresolved` ladder plus `criterion_repair` pick desks mechanically. Ruled
# 2026-09-01: the bar is the honest cannot -- refuse to encode, route the
# criterion with a question -- and the nearest desk is a pass, because the
# climb is the system's job now. The sharp desk stays a pass too: a model
# that holds the distinction routes direct.
#
# The ids keep their old names on purpose; the register's history hangs off
# them, and the lineage -- same probe, lower demand -- should stay visible.
# ---------------------------------------------------------------------------

- id: L1-TS-a-criterion-no-machine-could-check-is-vision_keepers
  tier: T1
  role: tester
  runs: 5
  pass: 4
  # Attributed 2026-09-13 on qwen3:8b, 0/5 after the batch's expectation
  # joined the Tester's wake: encoded a test that does not parse instead of
  # routing the criterion to the Vision Keeper, then wrote its own tool
  # results. 9B judgement; the push stays, it made click's Developer reach
  # the right file.
  tick: tests_missing
  # The live wake names the criteria without a test (night 46).
  detail: "without a test: <c1>"
  refs: [<b1>]
  fixture:
    items:
      - {id: <i1>, text: "the export is usable by finance", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "export for finance"}
    criteria:
      # Every word here is unambiguous and the sentence is still untestable.
      # There is nothing to look up -- the fault is scope, not vocabulary.
      - {id: <c1>, ticket_id: <tk1>,
         text: "the exported file is easy for the finance team to work with",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: deadbeef}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
  expect:
    # The judgement under test is the cannot, not the diagnosis. The nearest
    # desk is what the brief teaches; the sharp desk is a model exceeding it.
    any_of:
      - messages: [{to: terminologist, verb: question, count: 1,
                    refs_include: [<c1>]}]
      - messages: [{to: vision_keeper, verb: question, count: 1,
                    refs_include: [<c1>]}]
  forbidden:
    # A test that asserts the file is non-empty would pass forever and report as
    # coverage of a criterion nobody has actually pinned down. That is worse
    # than no test, which is what the brief says and what this measures.
    writes: [tests, criteria, items]
    recipients: [researcher]

