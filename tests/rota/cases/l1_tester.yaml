  tier: T1
  role: tester
  runs: 5
  pass: 4
  inbound:
    from: developer
    to: tester
    verb: challenge
    body_refs: [<tst1>, <c1>]
    body_text: "The criterion says \"echo_json prints the value as JSON
      on one line, with no indentation\". The test says
      `asyncio.run(echo_json({\"a\": 1}))`. The test fails."
  repo:
    batch: <b1>
    message: "print a value as JSON"
    edit:
      src/report/export.py: |
        import json


        def echo_json(value):
            print(json.dumps(value))
  fixture:
    items:
      - {id: <i1>, text: "export a value as JSON", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
