# L1 — the `finding_violated` mode: the Architect found a constraint violated
# by the diff, after the tests passed and the Critic passed.
#
# tipsAJ (2026-09-10): four such findings, and nothing woke anyone. The
# Developer answers with a commit that restores what the constraint says,
# or with an escalation to the Architect when the finding is wrong.

- id: L1-DV-restore-what-the-finding-names
  tier: T1
  role: developer
  runs: 5
  pass: 3
  tick: finding_violated
  refs: [<b1>]
  detail: "round 1: the Critic upheld <f1> on <k1>"
  repo:
    batch: <b1>
    message: "split the bill"
    edit:
      main.py: |
        def calculate_share(total, tip_percentage, people):
            tip = total * tip_percentage / 100
            return (total + tip) / people


        def display_results(total, tip, total_with_tip):
            print(f"Total: {total:.2f}")
            print(f"Tip: {tip:.2f}")
            print(f"Total with tip: {total_with_tip:.2f}")


        if __name__ == "__main__":
            total = float(input("Enter total amount: "))
            pct = float(input("Enter tip percentage: "))
            people = int(input("How many people: "))
            print(calculate_share(total, pct, people))
  fixture:
    items:
      - {id: <i1>, text: "the bill is split between the people paying", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "split the bill"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "each person's share is the total with tip divided by the number of people",
         term_refs: '[]', surface_refs: '["main.py::calculate_share"]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    constraints:
      - {id: <k1>, headline: "calculate_tip is called by the main script",
         text: "The function calculate_tip(total, tip_percentage) is called by the main script to compute the tip. If renamed or given a new required parameter, the main script fails.",
         provenance: observed, is_global: 0}
    constraint_bindings:
      - {constraint_id: <k1>, grain: main.py, grain_kind: path, resolves: 1}
    findings:
      - {id: <f1>, batch_id: <b1>, constraint_id: <k1>, commit_sha: abc123,
         status: violated, grain: calculate_tip}
    # Frame 88: the Developer wakes on a finding the Critic upheld.
    finding_rulings:
      - {id: "critic:<f1>:abc123", finding_id: <f1>, commit_sha: abc123,
         ruling: upheld, reason: "the main script calls calculate_tip"}
  expect:
    calls: [findings.load, code.write, code.commit]
    # The old name comes back: the constraint holds and the criterion still does.
  forbidden:
    writes: [constraints, findings, criteria, tests]
    recipients: [critic, tester, vision_keeper, terminologist]

# Pinned to the walk's Developer model. The fixture's repository holds the
# edited file as its only commit, so the drift door has no project base to
# compare against here and llama's escalation goes through; in a run the
# door refuses it (d4d1880). qwen3.5:9b gives the defaults 5/5.
# Red 0/5 on the 2026-09-14 re-record (363ce42): the model read the five-
# argument call in main.py as matching the constraint and escalated the
# finding as wrong. A judgement flip on a re-recorded prompt, not a door;
# the constraint names the three-argument form. Brief work, not a guard.
- id: L1-DV-give-the-new-parameters-defaults
  tier: T1
  role: developer
  model: qwen3.5:9b
  runs: 5
  pass: 3
  tick: finding_violated
  refs: [<b1>]
  detail: "round 1: the Critic upheld <f1> on <k1>"
  repo:
    batch: <b1>
    message: "split the bill"
    edit:
      main.py: |
        def calculate_tip(total, tip_percentage):
            return total * tip_percentage / 100


        def display_results(total, tip, total_with_tip, num_payers, shares):
            print(f"Total: {total:.2f}")
            print(f"Tip: {tip:.2f}")
            print(f"Total with tip: {total_with_tip:.2f}")
            for i in range(num_payers):
                print(f"Payer {i + 1}: {shares[i]:.2f}")


        if __name__ == "__main__":
            total = float(input("Enter total amount: "))
            pct = float(input("Enter tip percentage: "))
            people = int(input("How many people: "))
            tip = calculate_tip(total, pct)
            display_results(total, tip, total + tip, people, [(total + tip) / people] * people)
  fixture:
    items:
      - {id: <i1>, text: "the bill is split between the people paying", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "split the bill"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "each payer's share is printed after the totals",
         term_refs: '[]', surface_refs: '["main.py::display_results"]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    constraints:
      - {id: <k1>, headline: "display_results is called by the main script",
         text: "The function display_results(total, tip, total_with_tip) is called by the main script to show the results. If renamed or given a new required parameter, the main script fails.",
         provenance: observed, is_global: 0}
    constraint_bindings:
      - {constraint_id: <k1>, grain: main.py, grain_kind: path, resolves: 1}
    findings:
      - {id: <f1>, batch_id: <b1>, constraint_id: <k1>, commit_sha: abc123,
         status: violated, grain: display_results}
    # Frame 88: the Developer wakes on a finding the Critic upheld.
    finding_rulings:
      - {id: "critic:<f1>:abc123", finding_id: <f1>, commit_sha: abc123,
         ruling: upheld, reason: "the main script calls display_results"}
  expect:
    calls: [findings.load, code.write, code.commit]
  forbidden:
    writes: [constraints, findings, criteria, tests]
    recipients: [critic, tester, vision_keeper, terminologist, architect]

