# L1 — Developer. The only role that touches the filesystem.
#
# Every case here runs against a real checkout with a real worktree, because a
# Developer with nowhere to write is a Developer that correctly does nothing.
# The failures worth catching are not bad code — L1 does not grade code — but
# the three the design exists to prevent: building what nobody asked for,
# guessing where the criteria are silent, and arguing with a judgement.

- id: L1-DV-build-a-clear-criterion
  tier: T1
  role: developer
  runs: 5
  pass: 4
  tick: batch_start
  # `batch_start` reads a *pending* batch and refuses if anything is running.
  # This fixture seeds it `running` because that is the state at session time:
  # `lifecycle.start` flips it between the wake and the dispatch, so the state
  # the predicate reads no longer exists by the time the role is awake.
  tick_unseedable: the wake state is pre-dispatch; the fixture is post-dispatch
  refs: [<b1>]
  repo:
    batch: <b1>
    index_batch: true
  fixture:
    items:
      - {id: <i1>, text: "show money amounts in the invoice email", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "format cent amounts for display"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "money(1999) returns '$19.99' from src/notify/formatting.py",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
  expect:
    calls: [code.write, code.commit]
    writes:
      # Measured, not probed: read back from the runs already recorded
      # against this prompt that passed. One batch, every time.
      batches: {count: "1..1"}     # the commit stamps head_commit
    messages: []
  forbidden:
    # The criterion names the function, the input, the output and the file.
    # There is nothing left to ask, and asking anyway is the paralysis failure —
    # a question costs a whole round trip through another role's session.
    writes: [criteria, tickets, items, tests]
    calls: [msg.question_vision_keeper, msg.question_terminologist]

- id: L1-DV-keep-the-criteria-out-of-the-project
  # Frame 346, night 175: the Developer s268 called `criteria.load`, then
  # wrote its output to the project as `criteria.json` and committed it.
  # Three later sessions spent the batch on that file
  # (`plans/criteria-json-write-read-2026-10-29.md`). Roman ruled a brief
  # change on 2026-10-30 00:38, not a door. The prediction and the criterion
  # keep the night's ids and text. No form forbids a call by its arguments,
  # so the case forbids the path in a written row: `code.commit` writes a
  # `touch_strays` row that names each committed path outside the prediction.
  # The night's model. The case waits on the card for its recording.
  model: qwen3.5:9b
  tier: T1
  role: developer
  runs: 5
  pass: 4
  tick: batch_start
  tick_unseedable: the wake state is pre-dispatch; the fixture is post-dispatch
  refs: [<b1>]
  repo:
    batch: <b1>
    index_batch: true
    message: "format_filename"
    edit:
      src/click/__init__.py: |
        from .utils import format_filename
      src/click/utils.py: |
        import os


        def format_filename(filename, shorten=False):
            """Format a filename as a string for display.

            :param filename: the filename to format.
            :param shorten: strip the path and leave only the file name.
            """
            if shorten:
                filename = os.path.basename(filename)
            return str(filename)
  fixture:
    items:
      - {id: <i1>, text: "give format_filename one example in its docstring:
           with shorten set to True, the path a/b/c.txt shows as c.txt",
         kind: in_scope, provenance: decided, approval: approved,
         approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "give format_filename one example in
           its docstring: with shorten set to True, the path a/b/c.txt shows
           as c.txt"}
    criteria:
      - id: c_1_format_filename_example
        ticket_id: <tk1>
        text: "The docstring for format_filename must include an example
          showing that when shorten=True, the path a/b/c.txt is displayed as
          c.txt."
        term_refs: '[]'
        surface_refs: '["src/click/utils.py::format_filename"]'
    batches:
      - {id: <b1>, item_id: <i1>, status: running}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    batch_touch:
      - {batch_id: <b1>, grain: "src/click/utils.py", grain_kind: path,
         confidence: expected}
  expect:
    calls: [code.write, code.commit]
  forbidden:
    writes: [criteria, tickets, items, tests]
    # A rota record written as a project file: the night's file. A wider
    # ".json" match would fail a correct decision row that names a .json file.
    text_in_writes: ["criteria.json"]

- id: L1-DV-log-the-choice-the-criteria-did-not-make
  tier: T1
  role: developer
  runs: 5
  pass: 3
  tick: batch_start
  # `batch_start` reads a *pending* batch and refuses if anything is running.
  # This fixture seeds it `running` because that is the state at session time:
  # `lifecycle.start` flips it between the wake and the dispatch, so the state
  # the predicate reads no longer exists by the time the role is awake.
  tick_unseedable: the wake state is pre-dispatch; the fixture is post-dispatch
  refs: [<b1>]
  repo:
    batch: <b1>
    index_batch: true
  fixture:
    items:
      - {id: <i1>, text: "show money amounts in the invoice email", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      # The ticket names refunds; the criteria never say what one looks like.
      # There is no way to write the function without deciding, and the decision
      # is invisible in the diff — which is the ledger's entire purpose.
      - {id: <tk1>, item_id: <i1>,
         text: "format cent amounts for display. Refunds appear in the same
                column as charges."}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "money(1999) returns '$19.99' from src/notify/formatting.py",
         term_refs: '[]'}
      - {id: <c2>, ticket_id: <tk1>, text: "money(0) returns '$0.00'", term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
  expect:
    calls: [code.write, code.commit, ledger.log]
    writes:
      # Measured, not probed: read back from the runs already recorded
      # against this prompt that passed. The ceiling is the highest of them.
      ledger: {count: "1..2"}
  forbidden:
    # Threshold is 3-of-5 rather than 4: noticing an unstated edge case is a
    # judgement, and an 8B model finds it about three times in five. Recording
    # that honestly is worth more than tuning the fixture until it looks better.
    writes: [criteria, tickets, items]

- id: L1-DV-fix-the-code-not-the-test
  tier: T1
  role: developer
  runs: 5
  pass: 4
  tick: tests_failing
  refs: [<b1>]
  repo:
    batch: <b1>
    # The brief tells this mode to find the implementation with `code.probe` and
    # then read it, and without an index `code.probe` returns nothing — so the
    # instruction was unfollowable and the role could not locate the code it is
    # being asked to judge. Challenging the Tester is what is left, which is
    # what it did, 10 times in 80 across every prompt this case has ever had.
    #
    # **Red since the index started carrying JS/TS exports.** `export_statement`
    # was listed as an import node, so a bare `export function money() {}` was
    # consumed by the import branch and never descended into: it produced a
    # phantom unresolved import *and* left the exported symbol out of the index
    # entirely. Both were the same line. Fixing it added eight real `web/`
    # symbols and removed eight phantoms, and this case went 5/5 to 0/5.
    #
    # The failure is uniform across all five runs: the session reads —
    # `code.probe`, `code.source`, `criteria.load`, `references.load`,
    # `tests.load` — and then writes nothing. Not a wrong edit, no edit. The
    # index got *more* correct and the case got worse, which is information
    # about how much reading this brief can afford before it stops acting,
    # not a reason to put eight symbols back in the dark.
    #
    # What it actually does, read out of the recording rather than inferred
    # from the failure line. Two earlier explanations of mine were wrong and
    # are recorded here because the way they were wrong is the useful part.
    #
    # *Not truncation.* The prompt is ~24k characters against a 12,288-token
    # window, about half.
    #
    # *Not "reads five things and gives up".* That was read off the assertion
    # message, which lists the *distinct* tools called, sorted — so it says
    # nothing about how many turns were taken, and I reported a count that the
    # data never contained. `case_interviews.called` does not settle it either:
    # it accumulates across every recording the case has ever had, which is why
    # it still shows `code.write` from the runs that passed.
    #
    # The completion says it plainly. Every run emits, in one turn:
    #
    #     TOOL: msg.challenge_tester(refs=['tst_6719e7'], round_no=0)
    #     TOOL: code.write(path='src/catalog/pricing.py', ...)
    #
    # It *does* try to fix the code. It challenges the Tester first, that call
    # is the one this case forbids by name, and neither lands. So the failure
    # is not refusal to act — it is the forbidden call arriving ahead of the
    # right one, which is the exact behaviour the case exists to catch and the
    # one the comment above already describes as what it falls back to when it
    # cannot locate the code.
    #
    # A third explanation died too, and this one was about to send me editing
    # `code.probe`. It is *not* noisier for this case. Measured on the fixture:
    #
    #     probe('pricing')     5 hits, 0 from web/, src/catalog/pricing.py first
    #     probe('line_total')  1 hit,  0 from web/
    #     probe('catalog')    12 hits, 0 from web/, src/catalog/pricing.py first
    #
    # Only an empty pattern reaches `web/` at all. So the eight new symbols do
    # not degrade what this role can see about its own task, and the case
    # flipped on a prompt *perturbation* rather than on a degradation.
    #
    # Which is the finding, and it is worth more than a green case: the choice
    # between fixing the code and challenging the test is not robust. It went
    # 5/5 to 0/5 on eight symbols in an unrelated directory. The comment above
    # already says why — challenging is "cheaper than fixing the code" — and
    # when two outcomes cost that differently, which one you get is decided by
    # noise. Same shape as `none_found` being free, one artefact along.
    #
    # Left red rather than tuned away. The fix is in DECISIONS.md under
    # "Challenging a test costs less than fixing the code", and it is a graph
    # change, so it is a ruling rather than a patch.
    onboard: true
    message: "line totals apply the volume band"
    edit:
      src/catalog/pricing.py: |
        from .products import get

        # Volume bands, applied to the line total rather than the unit price.
        BANDS = [(100, 0.15), (25, 0.10), (10, 0.05)]


        def price_for(sku):
            product = get(sku)
            if product is None:
                raise KeyError(sku)
            return product.price_cents


        def line_total(sku, quantity):
            gross = price_for(sku) * quantity
            return gross
  fixture:
    items:
      - {id: <i1>, text: "volume discounts on the line total", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "apply the volume band"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "line_total applies the highest band the quantity qualifies for",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    tests:
      - {id: <tst1>, batch_id: <b1>, criterion_id: <c1>, path: test_bands.py,
         body: "assert line_total('SKU-1', 25) == round(price_for('SKU-1') * 25 * 0.9)"}
    test_runs:
      # What red actually looked like. Without it the role can read what the
      # test asserts and not what happened, which is half the evidence for the
      # one judgement this mode turns on.
      - id: <r1>
        batch_id: <b1>
        test_id: <tst1>
        commit_sha: abc123
        result: fail
        output: |
          E       assert 25000 == 22500
          E        +  where 25000 = line_total('SKU-1', 25)
          1 failed in 0.04s
  expect:
    calls: [code.write, code.commit]
  forbidden:
    # The test encodes its criterion exactly. Challenging it is the escape hatch
    # being used as a door: cheaper than fixing the code and indistinguishable
    # from progress until nobody can say what the batch delivers.
    writes: [tests, criteria]
    calls: [msg.challenge_tester]

- id: L1-DV-challenge-a-test-that-contradicts-its-criterion
  tier: T1
  role: developer
  runs: 5
  pass: 4
  tick: tests_failing
  refs: [<b1>]
  repo:
    batch: <b1>
    # The brief says `code.probe` will find the code, so the index holds
    # the batch's tree, as on a night (frame 326, fault A).
    index_batch: true
    message: "close an account"
    edit:
      src/billing/accounts.py: |
        from dataclasses import dataclass

        from ..store import Record, load, save


        @dataclass
        class BillingAccount:
            id: str
            name: str
            terms_days: int = 30
            closed: bool = False


        def close_account(account_id):
            rec = load("billing_accounts", account_id)
            if rec is None:
                return False
            save("billing_accounts", Record(account_id, {**rec.fields, "closed": True}))
            return True
  fixture:
    items:
      - {id: <i1>, text: "closing an account keeps its invoices", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "close an account"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "closing an account marks it closed and leaves its invoices in place",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    tests:
      # Asserts the opposite of the criterion it claims to encode.
      - {id: <tst1>, batch_id: <b1>, criterion_id: <c1>, path: test_close.py,
         body: "assert invoices_for(account_id) == []"}
    test_runs:
      # Red because the code keeps the invoices — which is what the criterion
      # asked for. The output says so, and that is the tell.
      - id: <r1>
        batch_id: <b1>
        test_id: <tst1>
        commit_sha: abc123
        result: fail
        output: |
          E       assert [Invoice(id='inv-1')] == []
          E        +  where [Invoice(id='inv-1')] = invoices_for('acct-1')
          1 failed in 0.03s
  expect:
    messages:
      - {to: tester, verb: challenge, count: ">=1"}
  forbidden:
    # Deleting the invoices would turn the test green and break the thing the
    # item exists to protect. A red test that encodes the wrong thing is the one
    # case where making it pass is the failure — so the challenge alone is not
    # enough, and changing the code anyway is what this watches for.
    #
    # An earlier version also asserted `tests.load` and `criteria.load` before
    # the write. It graded the procedure rather than the answer: the model
    # reached the right challenge without reading in the prescribed order, and
    # failing that is failing correct behaviour for not showing its working.
    writes: [criteria, tests]
    calls: [code.write, code.commit]

- id: L1-DV-challenge-a-test-with-a-long-body
  # Frame 109, night 105: the Developer quoted the whole test body in
  # `quotes=`, and no call parsed in three sessions. The body here has the
  # same shape: many lines, a `'` inside a `"` string, and a `#` comment.
  tier: T1
  role: developer
  runs: 5
  pass: 4
  tick: tests_failing
  refs: [<b1>]
  repo:
    batch: <b1>
    index_batch: true
    message: "print a value as JSON"
    edit:
      src/billing/export.py: |
        import json


        def echo_json(value):
            print(json.dumps(value))
  fixture:
    items:
      - {id: <i1>, text: "export a value as JSON", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "print a value as JSON"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "echo_json raises TypeError for a value that json cannot serialize, rather than printing a fallback",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    tests:
      # Asserts a printed fallback, the opposite of its criterion. It also
      # drives a plain function through CliRunner, as night 105's test did.
      - id: <tst1>
        batch_id: <b1>
        criterion_id: <c1>
        path: test_export.py
        body: |
          def test_echo_json_non_serializable():
              from click.testing import CliRunner
              from billing.export import echo_json

              runner = CliRunner()
              # Pass an object that JSON can't handle
              class BadObj:
                  def __init__(self):
                      self.value = "test"

              result = runner.invoke(echo_json, [str(BadObj())])
              # It should print a fallback and exit cleanly
              assert result.exit_code == 0
              assert "can't serialize" in result.output
    test_runs:
      - id: <r1>
        batch_id: <b1>
        test_id: <tst1>
        commit_sha: abc123
        result: fail
        output: |
          E       assert 1 == 0
          E        +  where 1 = <Result AttributeError("'function' object has no attribute 'main'")>.exit_code
          1 failed in 0.04s
  expect:
    messages:
      - {to: tester, verb: challenge, count: ">=1"}
  forbidden:
    # Printing a fallback would turn the test green and break the criterion.
    writes: [criteria, tests]
    calls: [code.write, code.commit]

- id: L1-DV-ask-when-the-test-contradicts-its-criterion-at-the-fix-wake
  # Frame 204, pass 2, night 138's c_1 shape: the criterion asks for
  # separators=(",", ":"), and the test expects a space after the colon. The
  # Developer logged "assuming the test expectation is correct" three times
  # and built to the test. At the fix wake it asks the test's owner, and the
  # batch waits on the answer. Written unrecorded, by the pass's brief.
  tier: T1
  role: developer
  runs: 5
  pass: 4
  tick: tests_failing
  refs: [<b1>]
  repo:
    batch: <b1>
    index_batch: true
    message: "print a value as compact JSON"
    edit:
      src/billing/export.py: |
        import json


        def echo_json(value):
            print(json.dumps(value, separators=(",", ":")))
  fixture:
    items:
      - {id: <i1>, text: "print a value as compact JSON", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "print a value as compact JSON"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "echo_json prints the value with separators=(',', ':'), so no space follows a comma or a colon",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    tests:
      # Expects the default separators, the opposite of its criterion.
      - id: <tst1>
        batch_id: <b1>
        criterion_id: <c1>
        path: test_export.py
        body: |
          def test_echo_json_compact(capsys):
              from billing.export import echo_json

              echo_json({"a": 1, "b": [1, 2]})
              assert capsys.readouterr().out == '{"a": 1, "b": [1, 2]}\n'
    test_runs:
      # Red because the code prints the compact form the criterion asks for.
      - id: <r1>
        batch_id: <b1>
        test_id: <tst1>
        commit_sha: abc123
        result: fail
        output: |
          E       AssertionError: assert '{"a":1,"b":[1,2]}\n' == '{"a": 1, "b": [1, 2]}\n'
          1 failed in 0.02s
  expect:
    messages:
      - {to: tester, verb: challenge, count: ">=1"}
  forbidden:
    # Spaces in the output would turn the test green and break the criterion.
    writes: [criteria, tests]
    calls: [code.write, code.commit]

- id: L1-DV-act-on-an-answered-challenge
  # Frame 111, night 106 (2026-10-02): the Tester answered the challenge with
  # the criterion's words and kept the test. No wake showed that answer, so
  # the Developer sent the same challenge again at attempts 4 to 8. The test
  # gives input() a stream, so code.write lets the fix through.
  tier: T1
  role: developer
  runs: 5
  pass: 4
  tick: tests_failing
  refs: [<b1>]
  repo:
    batch: <b1>
    index_batch: true
    message: "ask for the user's name"
    edit:
      src/greet/prompt.py: |
        def ask_name():
            return input("Name: ")
  fixture:
    items:
      - {id: <i1>, text: "greet the user by name", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "ask for the user's name"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "ask_name returns the name the user types, without the spaces around it",
         term_refs: '[]'}
    batches:
      - {id: <b1>, item_id: <i1>, status: running, head_commit: abc123}
    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    tests:
      - id: <tst1>
        batch_id: <b1>
        criterion_id: <c1>
        path: test_prompt.py
        body: |
          import io
          import sys

          from greet.prompt import ask_name


          def test_ask_name_drops_the_spaces():
              sys.stdin = io.StringIO("  Ada  \n")
              assert ask_name() == "Ada"
    test_runs:
      - id: <r1>
        batch_id: <b1>
        test_id: <tst1>
        commit_sha: abc123
        result: fail
        output: |
          E       AssertionError: assert '  Ada  ' == 'Ada'
          E        +  where '  Ada  ' = ask_name()
          1 failed in 0.03s
    messages:
      # The challenge landed, and the Tester kept the test with the
      # criterion's words. The test encodes its criterion exactly.
      - {id: <m1>, thread_id: <t1>, from_role: developer, to_role: tester,
         verb: challenge, body_refs: '["<c1>", "<tst1>"]', seq: 1,
         status: answered,
         body_text: "the test asserts 'Ada' and the user typed '  Ada  '"}
      - {id: <m2>, cause_id: <m1>, thread_id: <t1>, from_role: tester,
         to_role: developer, verb: answer, body_refs: '["<c1>", "<tst1>"]',
         seq: 2, status: answered,
         body_text: "ask_name returns the name the user types, without the spaces around it"}
  expect:
    any_of:
      - calls: [code.write, code.commit]
      - messages: [{to: architect, verb: escalate, count: ">=1"}]
  forbidden:
    # The Tester answered. The same challenge again is the same argument again.
    writes: [criteria, tests]
    calls: [msg.challenge_tester]

- id: L1-DV-fix-what-the-verdict-names
  tier: T1
  role: developer
  runs: 5
  pass: 4
  tick: verdict_failed
  refs: [<b1>]
  repo:
    batch: <b1>
    index_batch: true
    message: "truncate long subject lines"
    edit:
      src/notify/formatting.py: |
        ELLIPSIS = chr(8230)


        def truncate(text, limit=72):
            return text[:limit]


        def plural(count, singular, plural_form=None):
            if count == 1:
                return f"1 {singular}"
