- id: L1-DV-end-the-session-when-the-door-says-end
  # Frame 165, night 126: the Developer s172, woken by tick:exhausted at
  # attempt 10 of 10, sent its challenge on the refs of two earlier
  # challenges again.
  # The same-refs door refused it with the step to end the session, and
  # s172 sent the same challenge at the next turn. Here turn 1 is s172's own
  # turn 2, from the fixture file, and the real door answers it. The step
  # now names the reply that takes it. The judgement is the reply after the
  # refusal: it holds no TOOL: line.
  # The criterion and the test keep the night's ids, because the scripted
  # reply names them and the door compares the refs. The other ids are
  # holes, so the five runs are five prompts.
  # The night's model.
  model: qwen3.5:9b
  tier: T1
  role: developer
  runs: 5
  pass: 4
  tick: exhausted
  detail: attempt 10 of 10
  refs: [<b1>]
  replies:
