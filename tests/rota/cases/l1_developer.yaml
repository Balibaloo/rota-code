    batch_tickets:
      - {batch_id: <b1>, ticket_id: <tk1>}
    tests:
      # Body 5 of the night, version 17, as s439's wake showed it.
      - id: tst_version_option_show_python
        batch_id: <b1>
        criterion_id: ver_opt_show_py_tk2
        path: tests/test_version_option.py
        body: |
          from click.decorators import version_option
          import inspect
          from unittest.mock import patch
          from click.testing import CliRunner
          import click

          def test_version_option_show_python():
              # Test that show_python flag exists and is off by default
              sig = inspect.signature(version_option)
              assert "show_python" in sig.parameters

              # Get the default value for show_python
              default_value = sig.parameters["show_python"].default
              assert default_value == False

              # Test that enabling show_python appends Python version
              @click.command()
              @version_option(show_python=True)
              def cmd_enabled():
                  pass

              @click.command()
              @version_option(show_python=False)
              def cmd_disabled():
                  pass

              runner = CliRunner()

              # No mock needed; use real package name lookup
              result_enabled = runner.invoke(cmd_enabled, ["--version"])
              assert "Python" in result_enabled.output

              result_disabled = runner.invoke(cmd_disabled, ["--version"])
              assert "Python" not in result_disabled.output
