# L1 — the ladder for a question, rather than for a batch.
#
# Somebody asked, somebody answered, and the asker said the answer left them
# where they were. That declaration is the one thing in the register no query
# can produce, and everything after it is derived: the next rung is the first
# role that has not spoken in the thread and can reply to the asker, Liaison
# last, because a ladder ending in silence is the dead end this half exists to
# prevent.
#
# One limitation these share, stated rather than designed around. In production
# the wake carries `unresolved_note` as its detail -- the asker's own account of
# what is still missing, written after reading the answer, which is the sharpest
# version of the question that exists. The L1 harness sets `detail` to the tick
# name instead, so these cases run on the thread alone. That makes them strictly
# harder than the real thing, which is the safe direction.

- id: L1-AR-a-dead-answer-is-a-question-about-the-model
  tier: T1
  role: architect
  runs: 5
  pass: 3
  tick: unresolved
  refs: [<m1>]
  fixture:
    items:
      - {id: <i1>, text: "orders arriving out of sequence are reconciled",
         kind: in_scope, provenance: decided, approval: approved,
         approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "reconcile out-of-order arrivals"}
    criteria:
      - {id: <c1>, ticket_id: <tk1>,
         text: "an order that arrives late is reconciled against the ledger",
         term_refs: '[]'}
    messages:
      # The question, and Vision Keeper's answer to it. The answer is correct about
      # the criteria and beside the point about the work, which is the shape
      # this whole mechanism exists for.
      - {id: <m1>, thread_id: <t1>, from_role: developer, to_role: vision_keeper,
         verb: question, body_refs: '["<c1>"]', seq: 1, status: unresolved,
         body_text: "does a partially reconciled order count as done?",
         unresolved_note: "the criteria say reconciled against the ledger and
           do not say whether partial counts"}
      - {id: <m2>, cause_id: <m1>, thread_id: <t1>, from_role: vision_keeper,
         to_role: developer, verb: answer, body_refs: '["<c1>"]', seq: 2,
         status: answered}
  expect:
    # Either is the job: answer it, or say it is not yours. What is not the job
    # is being a quiet rung -- the asker is already blocked.
    any_of:
      - messages: [{to: developer, verb: answer, count: ">=1"}]
      - messages: [{to: liaison, verb: report, count: ">=1"}]
  forbidden:
    # Vision Keeper has already answered. Asking the roles in the thread again is
    # the loop with nothing new in it.
    calls: [msg.question_terminologist]

- id: L1-VK-the-last-rung-rules-or-sends-it-up
  tier: T1
  role: vision_keeper
  runs: 5
  pass: 3
  tick: unresolved
  refs: [<m1>]
  fixture:
    items:
      - {id: <i1>, text: "archived orders are searchable", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <tk1>, item_id: <i1>, text: "search archived orders"}
    messages:
      # Tester asked Terminologist; Terminologist answered; Architect has no
      # edge to answer Tester, so the climb arrives here. Vision Keeper is the last
      # rung anything wakes.
      - {id: <m1>, thread_id: <t1>, from_role: tester, to_role: terminologist,
         verb: question, body_refs: '["<tk1>"]', seq: 1, status: unresolved,
         body_text: "which sense of archived does this ticket take?",
         unresolved_note: "both senses are recorded and the ticket does not say
           which one it means"}
      - {id: <m2>, cause_id: <m1>, thread_id: <t1>, from_role: terminologist,
         to_role: tester, verb: answer, body_refs: '["<tk1>"]', seq: 2,
         status: answered}
    glossary_terms:
      - {id: <g1>, term: archived, sense_short: "flagged inactive, row stays",
         provenance: decided}
      - {id: <g2>, term: archived, sense_short: "moved to cold storage",
         provenance: decided}
  expect:
    # Which sense the project means is a ruling, not a clarification, and the
    # last rung sending a guess ends the thread with nobody left to catch it.
    #
    # RED, and measuring something true: five runs out of five answered
    # *Developer*, who is not in this thread and did not ask. The mode offers
    # `msg.answer_developer` and `msg.answer_tester` because Vision Keeper can
    # reach both, and the prompt saying "use the one who asked" does not
    # arbitrate -- prose never has here. The structural fix is to derive the
    # permitted recipient from the wake rather than from the mode, which is a
    # narrowing the sandbox cannot currently express per-wake.
    any_of:
      - messages: [{to: liaison, verb: submit, count: ">=1"}]
      - messages: [{to: tester, verb: answer, count: ">=1"}]
  forbidden:
    # Picking a sense is Terminologist's write and the principal's ruling.
    writes: [glossary_terms]

- id: L1-LI-a-question-the-roles-could-not-answer
  tier: T1
  role: liaison
  runs: 5
  pass: 3
  tick: unresolved
  refs: [<m1>]
  fixture:
    entries:
      - {id: <e1>, author: principal, ts_order: 1,
         text: "orders that arrive out of sequence get reconciled"}
    statements:
      - {id: <s1>, span_entry: <e1>, span_start: 0, span_end: 48,
         text: "orders that arrive out of sequence get reconciled",
         status: ratified}
    messages:
      # Everyone who could take it has spoken. That is what puts it here: not
      # that it is important, but that the roles have been through it.
      - {id: <m1>, thread_id: <t1>, from_role: developer, to_role: vision_keeper,
         verb: question, body_refs: '["<s1>"]', seq: 1, status: unresolved,
         body_text: "does a partially reconciled order count as done?",
         unresolved_note: "nobody can say whether partial counts, and the
           statement does not distinguish the two"}
      - {id: <m2>, cause_id: <m1>, thread_id: <t1>, from_role: vision_keeper,
         to_role: developer, verb: answer, body_refs: '["<s1>"]', seq: 2,
         status: answered}
      - {id: <m3>, thread_id: <t1>, from_role: architect, to_role: developer,
         verb: answer, body_refs: '["<s1>"]', seq: 3, status: answered}
  expect:
    # Their words, and the statement they can recognise -- a message id names a
    # role they do not know reported anything.
    #
    # RED on the refs alone: `clarify` reaches the principal five runs out of
    # five and carries no `refs`, which is the same signature as
    # `L1-TS-a-word-with-two-senses-is-terminologists`. Two roles, two modes,
    # one failure -- the right message with nothing attached -- so this is not
    # a Tester quirk.
    #
    # Disproved here rather than left as a hypothesis: a paragraph in
    # `liaison/unresolved.md` stating outright that refs is the statement and
    # is not optional changed nothing, 0/5 before and after. Prose does not
    # arbitrate this, as it has not arbitrated the last six. The fix will be
    # structural -- a channel whose refs the sandbox will not let go empty.
    messages:
      - {to: principal, verb: clarify, count: 1, refs_include: [<s1>]}
  forbidden:
    # Liaison does not decide, and a question the roles failed to answer is not
    # something to organise and present as news.
    calls: [msg.present_principal]
    writes: [decisions, glossary_terms, items]

- id: L1-TE-a-rung-for-a-question-the-principal-asked
  tier: T1
  role: terminologist
  runs: 5
  pass: 3
  tick: unresolved
  refs: [<m1>]
  # The ladder's newest rung, and the first one reached by a question the
  # *principal* asked rather than a role.
  #
  # `unresolved` picks the next rung off the graph -- the first role that has
  # not spoken in this thread and can reply to the asker -- and for a Liaison
  # question that is the three artefact owners. Terminologist had no
  # `unresolved` mode at all, so it woke with its whole namespace and its base
  # brief, which is the arrangement every measured failure in this system has
  # come out of.
  #
  # Architect answered from the model and cited constraint zero: true about the
  # run, and not the answer. The question is about what a *word* means here,
  # which is the distance between the question and the answer that this mode
  # exists to notice.
  fixture:
    glossary_terms:
      - {id: <g1>, term: recipe, provenance: observed,
         sense_short: "a note whose contents seed a new note"}
      - {id: <g2>, term: recipe, provenance: observed,
         sense_short: "the frontmatter block that names one"}
    constraints:
      - {id: k0, headline: "not yet surveyed",
         text: "everything in this repository no survey has reached",
         provenance: observed}
    entries:
      - {id: <e1>, author: principal, ts_order: 1,
         text: "where exactly does a user write a recipe -- which file, and under which key?"}
    messages:
      - {id: <m1>, thread_id: <t1>, from_role: liaison, to_role: architect,
         verb: ask, body_refs: '["<e1>"]', seq: 1, status: unresolved,
         unresolved_note: "the architect said the area is not surveyed; the
           question is about what a recipe is and where it is written"}
      - {id: <m2>, cause_id: <m1>, thread_id: <t1>, from_role: architect,
         to_role: liaison, verb: answer, body_refs: '["<e1>", "k0"]', seq: 2,
         status: answered}
  expect:
    # Two live senses is the answer, and the refs are what carry it. Saying
    # neither is being a quiet rung, which is the failure the mode exists to
    # prevent -- the asker is already blocked and the principal is waiting.
    any_of:
      - messages: [{to: liaison, verb: answer, count: 1, refs_include: [<g1>]}]
      - messages: [{to: liaison, verb: answer, count: 1, refs_include: [<g2>]}]
      - messages: [{to: liaison, verb: report, count: ">=1"}]
  forbidden:
    # Resolving a collision is a decision, and a decision is a write this
    # session does not have. Nor is it Terminologist's to rule on scope.
    writes: [glossary_terms, items, statements, decisions]

- id: L1-TE-adopt-what-the-principal-approved
  tier: T1
  role: terminologist
  runs: 5
  pass: 4
  # The observed exit, at the owner's end. Onboarding found the senses, the
  # principal ruled, Liaison relayed -- and the row the ruling approves is the
  # only one that moves. `glossary.adopt` checks the ruling off the cause
  # chain itself, so the contested sense cannot slip through even if named;
  # what this case measures is that the session adopts at all, and does not
  # start editing content while it is here.
  prompt: relay
  inbound: {id: <m_relay>, from: liaison, to: terminologist, verb: relay,
            body_refs: [<g1>, <g2>], cause: <m_rule>}
  fixture:
    config:
      - {key: "verdict:<m_rule>", value: '{"<g1>": "approve", "<g2>": "contest"}'}
    glossary_terms:
      - {id: <g1>, term: recipe, provenance: observed,
         sense_short: "a note whose contents seed a new note"}
      - {id: <g2>, term: intent, provenance: observed,
         sense_short: "a note-creation configuration"}
    messages:
      - {id: <m_present>, thread_id: <t1>, from_role: liaison, to_role: principal,
         verb: present, body_refs: '["<g1>","<g2>"]', seq: 1}
      - {id: <m_rule>, cause_id: <m_present>, thread_id: <t1>,
         from_role: principal, to_role: liaison, verb: verdict,
         body_refs: '["<g1>"]', seq: 2, status: answered}
  expect:
    writes:
      glossary_terms: {count: 1}
  forbidden:
    # Adoption is not authorship: the content is untouched, and the contested
    # sense is not this session's to fix.
    writes: [constraints, items, decisions, statements]
    recipients: [principal, vision_keeper, developer]

- id: L1-AR-adopt-what-the-principal-approved
  tier: T1
  role: architect
  runs: 5
  pass: 4
  # The same exit for the model's artefacts. One constraint approved, one
  # area contested: one row moves.
  prompt: relay
  inbound: {id: <m_relay>, from: liaison, to: architect, verb: relay,
            body_refs: [<k1>, <a1>], cause: <m_rule>}
  fixture:
    config:
      - {key: "verdict:<m_rule>", value: '{"<k1>": "approve", "<a1>": "contest"}'}
    constraints:
      - {id: <k1>, headline: "frontmatter must match the schema",
         text: "validateFmSchema warns in console", provenance: observed}
    model_areas:
      - {id: <a1>, account: "the variables area parses and provides values",
         provenance: observed}
    messages:
      - {id: <m_present>, thread_id: <t1>, from_role: liaison, to_role: principal,
         verb: present, body_refs: '["<k1>","<a1>"]', seq: 1}
      - {id: <m_rule>, cause_id: <m_present>, thread_id: <t1>,
         from_role: principal, to_role: liaison, verb: verdict,
         body_refs: '["<k1>"]', seq: 2, status: answered}
  expect:
    writes:
      constraints: {count: 1}
  forbidden:
    writes: [glossary_terms, items, decisions, model_areas]
    recipients: [principal, vision_keeper, developer]

- id: L1-TE-repair-the-criterion-the-tester-cannot-encode
  tier: T1
  role: terminologist
  runs: 5
  pass: 3
  # The repair path, at the owner's end. The Tester hit the parroting guard --
  # the criterion is the ticket's sentence, and encoding it writes the
  # sentence back -- took the guard's named exit, and said the answer did not
  # land. That routes here: not a ladder rung, a defect report about an
  # artefact with one writer, in the mode that can rewrite it.
  tick: criterion_repair
  refs: [<q1>]
  fixture:
    items:
      - {id: <i1>, text: "emails are stored lowercased", kind: in_scope,
         provenance: decided, approval: approved, approval_ver: 1, version: 1}
    tickets:
      - {id: <t1>, item_id: <i1>,
         text: "store the email lowercased on registration"}
    criteria:
      # The defect: the criterion is the ticket's own sentence, so a test
      # "encoding" it can only parrot.
      - {id: <c1>, ticket_id: <t1>,
         text: "store the email lowercased on registration", term_refs: '[]'}
    messages:
      - {id: <q1>, thread_id: <th1>, from_role: tester, to_role: terminologist,
         verb: question, body_refs: '["<c1>"]', seq: 1, status: unresolved,
         body_text: "what would make this checkable?",
         unresolved_note: "the criterion is the ticket sentence; encoding it
           is parroting"}
      - {id: <a1>, cause_id: <q1>, thread_id: <th1>, from_role: terminologist,
         to_role: tester, verb: answer, body_refs: '["<c1>"]', seq: 2,
         status: answered}
  expect:
    # The rewrite, and the asker told -- so the question closes and the next
    # encode meets the new words. Or the honest decline: the criterion is
    # right and the promise is the problem, said to the role that owns
    # promises.
    any_of:
      - writes: {criteria: {count: 1}}
      - messages: [{to: vision_keeper, verb: challenge, count: 1}]
  forbidden:
    # Repair is rewording what done means. It is not re-deciding scope, not
    # redefining terms on the way past, and not inventing a second criterion
    # beside the broken one.
    writes: [items, tickets, glossary_terms, statements, decisions]
